services:
  # ========================================
  # LENS TEAM RESPONSIBILITY
  # ========================================
  
  # API Gateway - Port 8080
  # Responsibilities:
  # - Route /api/{service}/** to downstream services
  # - Error handling (404 for unknown routes, etc)
  # - Gateway health endpoint (/health, /health/ready)
  # ========================================
  gateway:
    build:
      context: ./teams/lens/gateway
      dockerfile: Dockerfile
    container_name: gateway-service
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      - SERVER_PORT=8080
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-local}
    depends_on:
      - bridge
      - mind
      - inbox
      - chain
    networks:
      - resonance-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ========================================
  # OTHER TEAMS' SERVICES (Mock for testing)
  # Each team is responsible for:
  # - Building their own /health endpoint
  # - Responding to /api/{service}/** requests
  # - Maintaining their own service configuration
  # ========================================

  # Bridge Service - Bridge Team Responsibility
  bridge:
    build:
      context: ./teams/bridge
      dockerfile: Dockerfile
    container_name: bridge-service
    ports:
      - "${BRIDGE_PORT:-8081}:8080"
    environment:
      - SERVER_PORT=8080
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-local}
    networks:
      - resonance-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Mind Service - handles AI/ML operations
  mind:
    build:
      context: ./teams/mind
      dockerfile: Dockerfile
    container_name: mind-service
    ports:
      - "${MIND_PORT:-8082}:8080"
    environment:
      - SERVER_PORT=8080
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-local}
    networks:
      - resonance-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Inbox Service - handles inbox/notification operations
  inbox:
    build:
      context: ./teams/inbox
      dockerfile: Dockerfile
    container_name: inbox-service
    ports:
      - "${INBOX_PORT:-8083}:8080"
    environment:
      - SERVER_PORT=8080
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-local}
    networks:
      - resonance-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Chain Service - handles workflow chain operations
  chain:
    build:
      context: ./teams/chain
      dockerfile: Dockerfile
    container_name: chain-service
    ports:
      - "${CHAIN_PORT:-8084}:8080"
    environment:
      - SERVER_PORT=8080
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-local}
    networks:
      - resonance-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

# Shared network for inter-service communication
networks:
  resonance-network:
    driver: bridge
