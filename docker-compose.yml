# ========================================
# RESONANCE FLOW - Docker Compose
# ========================================
# 
# Current Services:
# 1. Gateway (LENS Team) - Routes Frontend ↔ BFF
# 2. BFF (Sari) - [PENDING - Add when ready]
#
# TODO: When BFF is ready, add this section:
# 
#   bff:
#     build:
#       context: ./teams/bff  # or wherever Sari creates it
#       dockerfile: Dockerfile
#     container_name: bff-service
#     ports:
#       - "${BFF_PORT:-8081}:8080"
#     environment:
#       - SERVER_PORT=8080
#     depends_on:
#       - gateway
#     networks:
#       - resonance-network
#     healthcheck:
#       test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
#       interval: 10s
#       timeout: 5s
#       retries: 3
#       start_period: 20s
# 
# Then Gateway will route /api/** requests to BFF
# ========================================

services:
  # ========================================
  # LENS TEAM RESPONSIBILITY
  # ========================================
  
  # API Gateway - Port 8080
  # ONLY routes between:
  # - Frontend/External clients
  # - BFF (Backend for Frontend) by Sari
  #
  # Gateway responsibilities:
  # - Route /api/** to BFF
  # - Error handling (404 for unknown routes, etc)
  # - Gateway health endpoint (/health, /health/ready)
  #
  # NOTE: BFF is responsible for communicating with
  #       Bridge, Chain, Inbox, and Mind teams
  # ========================================
  gateway:
    build:
      context: ./teams/lens/gateway
      dockerfile: Dockerfile
    container_name: gateway-service
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      - SERVER_PORT=8080
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-local}
    networks:
      - resonance-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ========================================
  # NOT IN DOCKER-COMPOSE (Team responsibility)
  # ========================================
  # 
  # The following services are built and maintained
  # by their respective teams independently:
  # - Bridge Team: teams/bridge/
  # - Chain Team: teams/chain/
  # - Inbox Team: teams/inbox/
  # - Mind Team: teams/mind/
  #
  # These teams will provide their service images
  # for docker-compose when their implementations
  # are ready. For now, they are developed separately.

networks:
  resonance-network:
    driver: bridge
