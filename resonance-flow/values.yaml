# Default values for resonance-flow.

imagePullSecrets: [] # pre-existing secret names (cloud/prod path, not yet wired up)
imagePullSecret:
  create: false # opt-in: chart creates a dockerconfigjson Secret from a personal PAT
  registry: ghcr.io
  username: "" # developer's GitHub username
  password: "" # developer's PAT, scope: read:packages - NEVER commit a real value here
  email: "noreply@kamatech.org"
nameOverride: ""
fullnameOverride: ""
serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""
podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}
# נשאר זמנית בשביל templates ישנים שעדיין משתמשים ב-.Values.service
service:
  type: ClusterIP
  port: 8082
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
    - name: gateway
      sectionName: http
  hostnames:
    - chart-example.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /headers
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
volumes: []
volumeMounts: []
# Applies to every component. Each entry blocks the pod with a
# wait-for-<name> initContainer until <host>:<port> is TCP-reachable,
# before the main container starts. Set per-component instead via
# components.<name>.dependencies for a dependency only one service has.
# dependencies:
#   - name: kafka
#     host: kafka.kafka.svc.cluster.local
#     port: 9092
dependencies: []
# Escape hatch for init-container logic the `dependencies` shorthand above
# can't express (e.g. a readiness check that isn't a plain TCP dial).
# Raw Kubernetes container specs, merged after the generated
# wait-for-<dependency> containers. Can also be set per-component via
# components.<name>.initContainers.
initContainers: []
nodeSelector: {}
tolerations: []
affinity: {}
components:
  mind:
    replicaCount: 1
    image:
      repository: "ghcr.io/kamatechorg/resonance-flow/mind"
      pullPolicy: IfNotPresent
      tag: "22a8e01"
    containerPort: 8000
    service:
      type: ClusterIP
      port: 80
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    startupProbe:
      httpGet:
        path: /health
        port: http
      periodSeconds: 5
      failureThreshold: 40
    livenessProbe:
      httpGet:
        path: /health
        port: http
      periodSeconds: 10
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /health
        port: http
      periodSeconds: 5
      failureThreshold: 3
    env: {}
