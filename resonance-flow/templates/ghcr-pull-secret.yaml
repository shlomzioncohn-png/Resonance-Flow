{{- if .Values.imagePullSecret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "resonance-flow.fullname" . }}-ghcr-pull
  labels:
    {{- include "resonance-flow.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ include "resonance-flow.dockerconfigjson" . }}
{{- end }}
