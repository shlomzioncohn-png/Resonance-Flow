name: Lens Frontend CI/CD

on:
  push:
    branches: [ "main" ]
    tags: [ "lens-frontend-v*.*.*" ]
    paths:
      - "teams/lens/frontend/**"
  pull_request:
    branches: [ "main" ]
    paths:
      - "teams/lens/frontend/**"
  workflow_dispatch: {}

jobs:
  ci:
    permissions:
      contents: write
      packages: write
      pull-requests: write
    uses: ./.github/workflows/service-ci.yaml
    with:
      service_name: lens-frontend
      service_dir: teams/lens/frontend
      language: node
      container_port: 8083
