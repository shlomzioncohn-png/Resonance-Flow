name: Lens Frontend CI/CD

on:
  push:
    branches: [ "main" ]
    tags: [ "lens-frontend-v*.*.*" ]
    paths:
      - "teams/lens/frontend/**"
  pull_request:
    branches: [ "main" ]
    paths:
      - "teams/lens/frontend/**"
  workflow_dispatch: {}

jobs:
  ci:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/service-ci-node.yaml
    with:
      service_name: lens-frontend
      service_dir: teams/lens/frontend

  cd:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      packages: write
      pull-requests: write
    uses: ./.github/workflows/service-cd.yaml
    secrets: inherit
    with:
      service_name: lens-frontend
      service_dir: teams/lens/frontend
      language: node
