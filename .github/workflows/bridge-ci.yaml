name: Bridge CI/CD

on:
  push:
    branches: [ "main" ]
    tags: [ "bridge-v*.*.*" ]
    paths:
      - "teams/bridge/**"
  pull_request:
    branches: [ "main" ]
    paths:
      - "teams/bridge/**"
  workflow_dispatch: {}

jobs:
  ci:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/service-ci-java.yaml
    with:
      service_name: bridge
      service_dir: teams/bridge

  cd:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      packages: write
      pull-requests: write
    uses: ./.github/workflows/service-cd.yaml
    secrets: inherit
    with:
      service_name: bridge
      service_dir: teams/bridge
      language: java
