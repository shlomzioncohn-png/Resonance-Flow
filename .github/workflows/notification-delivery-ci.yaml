name: Notification Delivery CI/CD

on:
  push:
    branches: [ "main" ]
    tags: [ "notification-delivery-v*.*.*" ]
    paths:
      - "teams/relay/src/**"
  pull_request:
    branches: [ "main" ]
    paths:
      - "teams/relay/src/**"
  workflow_dispatch: {}

jobs:
  ci:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/service-ci-java.yaml
    with:
      service_name: notification-delivery
      service_dir: teams/relay

  cd:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      packages: write
      pull-requests: write
    uses: ./.github/workflows/service-cd.yaml
    secrets: inherit
    with:
      service_name: notification-delivery
      service_dir: teams/relay
      language: java
      container_port: 8082
