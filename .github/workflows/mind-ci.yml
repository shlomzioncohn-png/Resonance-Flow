name: MIND CI

on:
  pull_request:
    paths:
      - 'teams/mind/**'
      - '.github/workflows/mind-ci.yml'

# Cancel an in-progress run when a newer commit is pushed to the same ref —
# the older run is measuring stale code and just burns Actions minutes.
concurrency:
  group: mind-ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this job only reads the repo (checkout, install, test).
permissions:
  contents: read

jobs:
  test:
    runs-on: self-hosted
    timeout-minutes: 15  # a hung `make eval` must not run to the 6h default
    defaults:
      run:
        working-directory: teams/mind
    # A temporary vector-store container for this CI run only, migrated by
    # `make migrate` below (see migrations/) -- not a shared or persistent
    # database, and not schema-bootstrapped by the app itself anymore
    # (issue #441). This is local/Compose-shaped wiring only; in
    # production MIND_VECTOR_STORE__DSN arrives as a whole Secret, not
    # composed from separate env vars in YAML.
    services:
      vector-store:
        image: pgvector/pgvector:0.8.1-pg16
        env:
          POSTGRES_USER: mind
          POSTGRES_PASSWORD: mind
          POSTGRES_DB: mind
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mind -d mind"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MIND_VECTOR_STORE__DSN: postgresql://mind:mind@localhost:5432/mind
      MIND_ENVIRONMENT: ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: teams/mind/pyproject.toml

      - name: Install
        run: make dev

      - name: Lint (ruff + mypy)
        run: make lint

      # docker-compose.yml gets this for free from db/init/ (mounted as
      # docker-entrypoint-initdb.d); this services: container has no
      # equivalent init-script mount, so it's a superuser one-off step
      # here instead -- migration 0001 assumes the extension already
      # exists and deliberately doesn't create it (see its docstring).
      - name: Enable pgvector extension
        run: |
          python <<'PY'
          import os
          import psycopg

          with psycopg.connect(os.environ["MIND_VECTOR_STORE__DSN"], autocommit=True) as conn:
              conn.execute("CREATE EXTENSION IF NOT EXISTS vector;")
          PY

      - name: Run migrations
        run: make migrate

      - name: Tests
        run: make test

      # Smoke-check that run.py still produces a report end-to-end. The real
      # regression check runs against eval/personas/ — it is switched on in the
      # PR that lands the persona scenario set.
      - name: Evaluation harness smoke check
        run: python -m mind.evaluation.run --model dummy --personas tests/fixtures/personas
