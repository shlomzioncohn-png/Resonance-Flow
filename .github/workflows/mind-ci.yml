name: MIND CI

on:
  pull_request:
    paths:
      - 'teams/mind/**'
      - '.github/workflows/mind-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: teams/mind
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: teams/mind/pyproject.toml

      - name: Install
        run: make dev

      - name: Lint (ruff + mypy)
        run: make lint

      - name: Tests
        run: make test

      - name: Evaluation harness against eval/personas (regression check)
        run: make eval
