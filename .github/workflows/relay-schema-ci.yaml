name: Relay / schema compatibility (PR)

# Pre-merge gate: blocks a PR that would break Kafka schema compatibility,
# WITHOUT any live cluster. It stands up a throwaway Schema Registry (the same
# Apicurio image prod uses), seeds it with each schema version as it exists on
# the PR's base branch — the "previous known-good schema from Git" — then
# dry-run checks the PR's versions against it.
#
# No `branches:` filter: the base branch is whatever the PR targets, read from
# github.event.pull_request.base.sha, so this works for PRs into main or any
# other branch.
#
# The schema list and the compatibility level come from that base ref too (via
# `git show`), not from the PR, so a PR can't weaken its own gate. The workflow
# file itself still runs from the PR — it is deliberately thin.
#
# No `paths:` filter: schema-compat and chart-lint are Required status checks on
# every PR (#240). A Required check whose workflow is skipped by a path filter
# leaves the PR stuck on "Expected — Waiting for status" forever. So the workflow
# runs on every PR; the `changes` job decides whether there is anything to check,
# and schema-compat / chart-lint skip when there isn't — a skipped job satisfies
# a Required status check.
#
# The post-merge equivalent is teams/relay/schema-sync-hook, which runs the
# same check + an actual register inside the cluster via ArgoCD. See
# teams/relay/ci/README.md.
on:
  pull_request:

jobs:
  changes:
    runs-on: self-hosted
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Here, not in schema-compat: its registry service container starts before any step.
      - uses: ./.github/actions/free-runner-disk
      - name: Did this PR touch relay schema / chart / ci files?
        id: filter
        run: |
          if git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD \
             | grep -qE '^shared/proto/|^teams/relay/(ci|schema-sync-hook)/|^\.github/workflows/relay-schema-ci\.yaml$'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "Relay schema / chart / ci files changed — running the checks."
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "No relay schema / chart / ci changes — schema-compat and chart-lint will skip."
          fi

  schema-compat:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: self-hosted

    services:
      schema-registry:
        image: apicurio/apicurio-registry-mem:2.5.11.Final
        ports:
          - 8080

    steps:
      - uses: actions/checkout@v7
        with:
          # the scripts read the base branch's schema files / list / level via `git show`
          fetch-depth: 0

      - name: Point at this job's Schema Registry port
        run: echo "SCHEMA_REGISTRY_URL=http://localhost:${{ job.services.schema-registry.ports['8080'] }}/apis/ccompat/v6" >> "$GITHUB_ENV"

      - name: Wait for Schema Registry to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf "${SCHEMA_REGISTRY_URL}/subjects" >/dev/null; then
              echo "Schema Registry is up."
              exit 0
            fi
            echo "waiting for Schema Registry... ($i)"
            sleep 2
          done
          echo "Schema Registry did not come up in time." >&2
          exit 1

      - name: Seed registry with base-branch schema versions
        run: bash teams/relay/ci/seed-registry.sh "${{ github.event.pull_request.base.sha }}"

      - name: Check PR schema versions for compatibility
        run: bash teams/relay/ci/check-all-schemas.sh "${{ github.event.pull_request.base.sha }}"

  chart-lint:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    # Catches a broken schema-sync-hook chart (templating errors in
    # configmap.yaml / job.yaml) before merge, instead of at ArgoCD sync time.
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
      - name: Lint and render the schema-sync-hook chart
        run: |
          helm lint teams/relay/schema-sync-hook
          helm template t teams/relay/schema-sync-hook >/dev/null
