name: Lens BFF CI/CD

on:
  push:
    branches: [ "main" ]
    tags: [ "lens-bff-v*.*.*" ]
    paths:
      - "teams/lens/bff/**"
      - "resonance-flow/**"
      - ".github/workflows/lens-bff-ci.yaml"
      - ".github/workflows/service-ci.yaml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "teams/lens/bff/**"
      - ".github/workflows/lens-bff-ci.yaml"
      - ".github/workflows/service-ci.yaml"
  workflow_dispatch: {}

jobs:
  ci:
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/service-ci.yaml
    with:
      service_name: lens-bff
      service_dir: teams/lens/bff
      language: java
      container_port: 8082
