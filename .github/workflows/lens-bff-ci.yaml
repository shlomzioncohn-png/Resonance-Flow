name: Lens BFF CI/CD

on:
  push:
    branches: [ "main" ]
    tags: [ "lens-bff-v*.*.*" ]
    paths:
      - "teams/lens/bff/**"
  pull_request:
    branches: [ "main" ]
    paths:
      - "teams/lens/bff/**"
  workflow_dispatch: {}

jobs:
  ci:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/service-ci-java.yaml
    with:
      service_name: lens-bff
      service_dir: teams/lens/bff

  cd:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      packages: write
      pull-requests: write
    uses: ./.github/workflows/service-cd.yaml
    secrets: inherit
    with:
      service_name: lens-bff
      service_dir: teams/lens/bff
      language: java
      container_port: 8082

  round-trip:
    needs: ci
    if: github.event_name == 'pull_request'
    runs-on: self-hosted
    timeout-minutes: 25
    permissions:
      contents: read

    env:
      CHART_DIR: teams/relay/helm/resonance-flow
      RELEASE: lens-bff-rt
      NAMESPACE: lens-bff-rt
      KIND_CLUSTER: lens-bff-rt-${{ github.run_id }}-${{ github.run_attempt }}
      IMAGE_TAG: local-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/free-runner-disk

      - uses: azure/setup-helm@v5

      - name: Use this job's own kubeconfig
        run: echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ${{ env.KIND_CLUSTER }}

      - name: Fetch chart dependencies
        run: helm dependency build "$CHART_DIR"

      - uses: ./.github/actions/install-yq

      - name: Build all-components-off overlay
        run: |
          echo "CHART_ALL_OFF=$RUNNER_TEMP/components-all-off.yaml" >> "$GITHUB_ENV"
          yq '{"components": (.components | map_values({"enabled": false}))}' "$CHART_DIR/values.yaml" > "$RUNNER_TEMP/components-all-off.yaml"

      - name: Build and load the lens-bff and inbox images
        run: |
          docker build -t "lens-bff:$IMAGE_TAG" teams/lens/bff
          docker build -t "inbox:$IMAGE_TAG" teams/inbox --build-context shared=shared
          kind load docker-image "lens-bff:$IMAGE_TAG" --name "$KIND_CLUSTER"
          kind load docker-image "inbox:$IMAGE_TAG" --name "$KIND_CLUSTER"

      - name: Deploy chart with lens-bff + inbox enabled
        run: |
          helm upgrade --install "$RELEASE" "$CHART_DIR" \
            -f "$CHART_DIR/values.yaml" \
            -f "$CHART_ALL_OFF" \
            --set components.lens-bff.enabled=true \
            --set components.lens-bff.image.repository=lens-bff \
            --set components.lens-bff.image.tag="$IMAGE_TAG" \
            --set components.lens-bff.image.pullPolicy=Never \
            --set components.lens-bff.env.INBOX_MOCK_ENABLED=false \
            --set components.inbox.enabled=true \
            --set components.inbox.image.repository=inbox \
            --set components.inbox.image.tag="$IMAGE_TAG" \
            --set components.inbox.image.pullPolicy=Never \
            --set components.schema-registry.enabled=true \
            --set postgresql.enabled=true \
            --namespace "$NAMESPACE" --create-namespace \
            --wait --timeout 600s

      - name: Diagnose deploy failure
        if: failure()
        run: |
          kubectl -n "$NAMESPACE" get pods -o wide
          kubectl -n "$NAMESPACE" describe pods
          kubectl -n "$NAMESPACE" logs -l app.kubernetes.io/component=lens-bff --all-containers --tail=200 || true
          kubectl -n "$NAMESPACE" logs -l app.kubernetes.io/component=inbox --all-containers --tail=200 || true

      - name: Round trip
        run: ./teams/lens/bff/scripts/round-trip.sh
