name: Lens BFF CI/CD / ci / test

on:
  pull_request:
    paths:
      - 'teams/lens/bff/**'
      - '.github/workflows/lens-bff-ci.yml'

concurrency:
  group: lens-bff-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: teams/lens/bff
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test
        run: mvn clean verify -DskipTests=false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bff-test-results
          path: teams/lens/bff/target/surefire-reports/
          retention-days: 30
