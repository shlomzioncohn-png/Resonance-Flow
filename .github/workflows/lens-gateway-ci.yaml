name: Lens Gateway CI/CD

on:
  push:
    branches: [ "main" ]
    tags: [ "lens-gateway-v*.*.*" ]
    paths:
      - "teams/lens/gateway/**"
  pull_request:
    branches: [ "main" ]
    paths:
      - "teams/lens/gateway/**"
  workflow_dispatch: {}

jobs:
  ci:
    permissions:
      contents: write
      packages: write
      pull-requests: write
    uses: ./.github/workflows/service-ci.yaml
    with:
      service_name: lens-gateway
      service_dir: teams/lens/gateway
      language: java
      container_port: 8080
