name: Service CI/CD (reusable)

on:
  workflow_call:
    inputs:
      service_name:
        description: "Component name, matches the key under components.<service_name> in teams/relay/helm/resonance-flow/values.yaml"
        required: true
        type: string
      service_dir:
        description: "Path to the service, e.g. teams/bridge"
        required: true
        type: string
      language:
        description: "python, java, or node"
        required: true
        type: string
      container_port:
        description: "Local port used for the post-deploy smoke test port-forward"
        required: true
        type: number

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/${{ inputs.service_name }}
  SERVICE_DIR: ${{ inputs.service_dir }}
  CHART_DIR: teams/relay/helm/resonance-flow
  CHART_VALUES: teams/relay/helm/resonance-flow/values.yaml
  # True on the build+deploy phase (push/workflow_dispatch), not plain PR runs.
  IS_DEPLOY_RUN: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}

jobs:
  test:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.tags.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5

      # Generic for every service, every run - each team's own per-team values
      # file (kafka/postgresql/minio enabled flags) decides what actually
      # comes up, so this doesn't need to know which service needs what.
      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ${{ inputs.service_name }}-cluster

      - name: Fetch chart dependencies
        run: helm dependency build "$CHART_DIR"

      - name: Install yq
        run: |
          sudo curl -sL -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      # First half of one release's lifecycle: install with the component itself
      # disabled (only its infra deps come up); phase two below upgrades it in
      # place. kafka stays enabled here - disabling then re-enabling on the
      # second install trips Bitnami's "provide current passwords" guard.
      - name: Deploy chart with ${{ inputs.service_name }} disabled (infra only, for tests)
        run: |
          SERVICE="${{ inputs.service_name }}"
          helm upgrade --install "$SERVICE" "$CHART_DIR" \
            -f "$CHART_VALUES" \
            -f "$CHART_DIR/values/values-${SERVICE}.yaml" \
            --set components.${SERVICE}.enabled=false \
            --namespace "$SERVICE" --create-namespace \
            --wait --timeout 300s

      # Driven by this service's own values file, not a hardcoded team name -
      # only relevant if it actually declares a chart-managed Postgres.
      - name: Port-forward test Postgres to localhost:5432
        run: |
          SERVICE="${{ inputs.service_name }}"
          NEEDS_PG=$(yq eval ".postgresql.enabled // false" "$CHART_DIR/values/values-${SERVICE}.yaml")
          if [ "$NEEDS_PG" != "true" ]; then
            echo "values-${SERVICE}.yaml doesn't enable postgresql - skipping"
            exit 0
          fi
          kubectl -n "$SERVICE" port-forward svc/${SERVICE}-postgresql 5432:5432 &
          for i in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/5432) >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "Postgres port-forward never became reachable" >&2
          exit 1

      - name: Set up Python 3.12
        if: inputs.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ${{ inputs.service_dir }}/pyproject.toml

      - name: Install package (dev)
        if: inputs.language == 'python'
        working-directory: ${{ inputs.service_dir }}
        run: pip install -e ".[dev]"

      - name: Run Python tests
        if: inputs.language == 'python'
        working-directory: ${{ inputs.service_dir }}
        run: pytest --cov=src/${{ inputs.service_name }}

      - name: Set up JDK 21
        if: inputs.language == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ${{ inputs.service_dir }}/pom.xml

      - name: Run Java tests
        if: inputs.language == 'java'
        working-directory: ${{ inputs.service_dir }}
        run: mvn -B test

      - name: Set up Node 22
        if: inputs.language == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ inputs.service_dir }}/package-lock.json

      - name: Install dependencies
        if: inputs.language == 'node'
        working-directory: ${{ inputs.service_dir }}
        run: npm ci

      - name: Lint
        if: inputs.language == 'node'
        working-directory: ${{ inputs.service_dir }}
        run: npm run lint

      - name: Build frontend
        if: inputs.language == 'node'
        working-directory: ${{ inputs.service_dir }}
        run: npm run build

      - name: Normalize image name to lowercase
        if: env.IS_DEPLOY_RUN == 'true'
        run: echo "IMAGE_NAME=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Compute image tags (sha + semver, no latest)
        if: env.IS_DEPLOY_RUN == 'true'
        id: tags
        run: |
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          TAGS="${IMAGE_NAME}:${SHORT_SHA}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#${{ inputs.service_name }}-}"
            TAGS="${TAGS},${IMAGE_NAME}:${VERSION}"
          fi
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
        if: env.IS_DEPLOY_RUN == 'true'

      - name: Build image (local, for smoke test)
        if: env.IS_DEPLOY_RUN == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.service_dir }}
          load: true
          tags: ${{ inputs.service_name }}:local
          cache-from: type=gha,scope=${{ inputs.service_name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service_name }}

      - name: Load image into kind
        if: env.IS_DEPLOY_RUN == 'true'
        run: kind load docker-image ${{ inputs.service_name }}:local --name ${{ inputs.service_name }}-cluster

      # Second half: turns the component on with the now-built image. For inbox
      # this upgrades the release from phase one; for others it's a fresh install.
      - name: Deploy chart with the built image (smoke test)
        if: env.IS_DEPLOY_RUN == 'true'
        run: |
          SERVICE="${{ inputs.service_name }}"

          # values/values-<service>.yaml already enables only this service's
          # component (plus the shared infra subcharts it depends on) - no
          # need to re-set components.$SERVICE.enabled here.
          helm upgrade --install "$SERVICE" "$CHART_DIR" \
            -f "$CHART_VALUES" \
            -f "$CHART_DIR/values/values-${SERVICE}.yaml" \
            --set components.${SERVICE}.image.repository="$SERVICE" \
            --set components.${SERVICE}.image.tag=local \
            --set components.${SERVICE}.image.pullPolicy=Never \
            --namespace "$SERVICE" --create-namespace \
            --wait --timeout 420s

      - name: Diagnose deploy failure
        if: failure() && env.IS_DEPLOY_RUN == 'true'
        run: |
          SERVICE="${{ inputs.service_name }}"
          echo "::group::kubectl get pods -o wide"
          kubectl -n "$SERVICE" get pods -o wide
          echo "::endgroup::"
          echo "::group::kubectl describe pods"
          kubectl -n "$SERVICE" describe pods
          echo "::endgroup::"
          echo "::group::kubectl get events (sorted)"
          kubectl -n "$SERVICE" get events --sort-by=.lastTimestamp
          echo "::endgroup::"
          for pod in $(kubectl -n "$SERVICE" get pods -l app.kubernetes.io/component="$SERVICE" -o jsonpath='{.items[*].metadata.name}'); do
            echo "::group::kubectl logs $pod (current)"
            kubectl -n "$SERVICE" logs "$pod" --all-containers --tail=200 || true
            echo "::endgroup::"
            echo "::group::kubectl logs $pod (previous, if it restarted)"
            kubectl -n "$SERVICE" logs "$pod" --all-containers --previous --tail=200 || true
            echo "::endgroup::"
          done

      - name: Smoke test
        if: env.IS_DEPLOY_RUN == 'true'
        run: |
          # Single source of truth: the chart's own readinessProbe path.
          HEALTH_PATH=$(yq eval ".components.${{ inputs.service_name }}.readinessProbe.httpGet.path" "$CHART_VALUES")
          kubectl -n ${{ inputs.service_name }} port-forward svc/${{ inputs.service_name }}-resonance-flow-${{ inputs.service_name }} ${{ inputs.container_port }}:80 &
          sleep 5
          curl -sf "http://localhost:${{ inputs.container_port }}${HEALTH_PATH}"

      - name: Log in to GHCR
        if: env.IS_DEPLOY_RUN == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: env.IS_DEPLOY_RUN == 'true'
        run: |
          IFS=',' read -ra TAG_LIST <<< "${{ steps.tags.outputs.tags }}"
          for t in "${TAG_LIST[@]}"; do
            docker tag ${{ inputs.service_name }}:local "$t"
            docker push "$t"
          done

  update-manifest:
    needs: test
    if: env.IS_DEPLOY_RUN == 'true'
    runs-on: self-hosted
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: resonance-flow-values-update
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Install yq
        run: |
          sudo curl -sL -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Update chart values with new image tag
        run: |
          IMAGE_NAME_LC=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          yq -i ".components.${{ inputs.service_name }}.image.repository = \"${IMAGE_NAME_LC}\" | .components.${{ inputs.service_name }}.image.tag = \"${{ needs.test.outputs.image_tag }}\"" "$CHART_VALUES"

      - name: Commit updated values
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$CHART_VALUES"
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(${{ inputs.service_name }}): deploy image ${{ needs.test.outputs.image_tag }} [skip ci]"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # main's ruleset requires every change to go through a reviewed PR, and
      # there's no bot bypass configured (deliberately - a bypass broad enough
      # for the bot would also let every real admin skip review, which defeats
      # the rule's purpose). So instead of pushing directly, open a new PR for
      # a human to approve, same as any other change to main.
      - name: Open a PR with the manifest update
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="ci/${{ inputs.service_name }}-deploy-${{ needs.test.outputs.image_tag }}"
          git checkout -b "$BRANCH"
          git push origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore(${{ inputs.service_name }}): deploy image ${{ needs.test.outputs.image_tag }}" \
            --body "Automated image tag bump for \`${{ inputs.service_name }}\` to \`${{ needs.test.outputs.image_tag }}\`, triggered by \`${{ github.event_name }}\` on \`${{ github.ref_name }}\`. Needs review/approval per the \`main\` branch ruleset."
