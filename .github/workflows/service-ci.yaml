name: Service CI/CD (reusable)

on:
  workflow_call:
    inputs:
      service_name:
        description: "Component name, matches the key under components.<service_name> in teams/relay/helm/resonance-flow/values.yaml"
        required: true
        type: string
      service_dir:
        description: "Path to the service, e.g. teams/bridge"
        required: true
        type: string
      language:
        description: "python, java, or node"
        required: true
        type: string
      container_port:
        description: "Local port used for the post-deploy smoke test port-forward"
        required: true
        type: number

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/${{ inputs.service_name }}
  SERVICE_DIR: ${{ inputs.service_dir }}
  CHART_DIR: teams/relay/helm/resonance-flow
  CHART_VALUES: teams/relay/helm/resonance-flow/values.yaml

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.tags.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5

      # Created whenever inbox needs it for a real Postgres (every run, since
      # its tests need one) or whenever a later step needs it for the smoke
      # test (push/workflow_dispatch only) - one cluster serves both phases
      # below instead of a second one being stood up from scratch later.
      - name: Create kind cluster
        if: inputs.service_name == 'inbox' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: helm/kind-action@v1
        with:
          cluster_name: ${{ inputs.service_name }}-cluster

      - name: Fetch chart dependencies
        if: inputs.service_name == 'inbox' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: helm dependency build "$CHART_DIR"

      - name: Install yq
        if: inputs.service_name == 'inbox' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          sudo curl -sL -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      # First half of a single release's lifecycle: install this service's own
      # component disabled (so only the infra it depends on - here, Postgres -
      # comes up) under the release name the smoke-test phase will later
      # `helm upgrade` in place, instead of installing the whole chart a
      # second time from scratch once the image exists.
      #
      # kafka is left at its default (enabled) here even though tests don't
      # need it: toggling kafka.enabled false->true on the *second* install
      # trips the Bitnami chart's "you must provide your current passwords
      # when upgrading" guard, since disabling it here means no Secret with
      # those passwords ever gets created for the later upgrade to find.
      # Leaving it enabled throughout avoids the false->true transition
      # entirely instead of working around that guard.
      - name: Deploy chart with ${{ inputs.service_name }} disabled (infra only, for tests)
        if: inputs.service_name == 'inbox'
        run: |
          SERVICE="${{ inputs.service_name }}"
          helm upgrade --install "$SERVICE" "$CHART_DIR" \
            -f "$CHART_VALUES" \
            -f "$CHART_DIR/values/values-${SERVICE}.yaml" \
            --set components.${SERVICE}.enabled=false \
            --namespace "$SERVICE" --create-namespace \
            --wait --timeout 300s

      - name: Port-forward test Postgres to localhost:5432
        if: inputs.service_name == 'inbox'
        run: |
          kubectl -n inbox port-forward svc/inbox-postgresql 5432:5432 &
          for i in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/5432) >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "Postgres port-forward never became reachable" >&2
          exit 1

      - name: Set up Python 3.12
        if: inputs.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ${{ inputs.service_dir }}/pyproject.toml

      - name: Install package (dev)
        if: inputs.language == 'python'
        working-directory: ${{ inputs.service_dir }}
        run: pip install -e ".[dev]"

      - name: Run Python tests
        if: inputs.language == 'python'
        working-directory: ${{ inputs.service_dir }}
        run: pytest --cov=src/${{ inputs.service_name }}

      - name: Set up JDK 21
        if: inputs.language == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ${{ inputs.service_dir }}/pom.xml

      - name: Run Java tests
        if: inputs.language == 'java'
        working-directory: ${{ inputs.service_dir }}
        run: mvn -B test

      - name: Set up Node 22
        if: inputs.language == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ inputs.service_dir }}/package-lock.json

      - name: Install dependencies
        if: inputs.language == 'node'
        working-directory: ${{ inputs.service_dir }}
        run: npm ci

      - name: Lint
        if: inputs.language == 'node'
        working-directory: ${{ inputs.service_dir }}
        run: npm run lint

      - name: Build frontend
        if: inputs.language == 'node'
        working-directory: ${{ inputs.service_dir }}
        run: npm run build

      - name: Normalize image name to lowercase
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: echo "IMAGE_NAME=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Compute image tags (sha + semver, no latest)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        id: tags
        run: |
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          TAGS="${IMAGE_NAME}:${SHORT_SHA}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#${{ inputs.service_name }}-}"
            TAGS="${TAGS},${IMAGE_NAME}:${VERSION}"
          fi
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

      - name: Build image (local, for smoke test)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.service_dir }}
          load: true
          tags: ${{ inputs.service_name }}:local
          cache-from: type=gha,scope=${{ inputs.service_name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service_name }}

      - name: Load image into kind
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: kind load docker-image ${{ inputs.service_name }}:local --name ${{ inputs.service_name }}-cluster

      # Second half of the same release's lifecycle: for inbox this is a real
      # `helm upgrade` turning the component on with the image that didn't
      # exist during the first install above - the same path ArgoCD takes in
      # production (upgrading an existing release), not just a fresh install.
      # For every other service there's no prior install from this job, so
      # `--install` makes this the one and only install, same as before.
      - name: Deploy chart with the built image (smoke test)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          SERVICE="${{ inputs.service_name }}"

          # values/values-<service>.yaml already enables only this service's
          # component plus the shared infra subcharts it actually depends on
          # (see teams/relay/helm/resonance-flow/README.md).
          helm upgrade --install "$SERVICE" "$CHART_DIR" \
            -f "$CHART_VALUES" \
            -f "$CHART_DIR/values/values-${SERVICE}.yaml" \
            --set components.${SERVICE}.enabled=true \
            --set components.${SERVICE}.image.repository="$SERVICE" \
            --set components.${SERVICE}.image.tag=local \
            --set components.${SERVICE}.image.pullPolicy=Never \
            --namespace "$SERVICE" --create-namespace \
            --wait --timeout 420s

      - name: Smoke test
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          # Read straight from the chart's own readinessProbe instead of a
          # second, hand-maintained health_path input per team - one source
          # of truth for "is this service up" instead of two that can drift.
          HEALTH_PATH=$(yq eval ".components.${{ inputs.service_name }}.readinessProbe.httpGet.path" "$CHART_VALUES")
          kubectl -n ${{ inputs.service_name }} port-forward svc/${{ inputs.service_name }}-resonance-flow-${{ inputs.service_name }} ${{ inputs.container_port }}:80 &
          sleep 5
          curl -sf "http://localhost:${{ inputs.container_port }}${HEALTH_PATH}"

      - name: Log in to GHCR
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          IFS=',' read -ra TAG_LIST <<< "${{ steps.tags.outputs.tags }}"
          for t in "${TAG_LIST[@]}"; do
            docker tag ${{ inputs.service_name }}:local "$t"
            docker push "$t"
          done

  update-manifest:
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: resonance-flow-values-update
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Install yq
        run: |
          sudo curl -sL -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Update chart values with new image tag
        run: |
          IMAGE_NAME_LC=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          yq -i ".components.${{ inputs.service_name }}.image.repository = \"${IMAGE_NAME_LC}\" | .components.${{ inputs.service_name }}.image.tag = \"${{ needs.test.outputs.image_tag }}\"" "$CHART_VALUES"

      - name: Commit and push updated values
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$CHART_VALUES"
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(${{ inputs.service_name }}): deploy image ${{ needs.test.outputs.image_tag }} [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
