name: Relay / sync schema files into schema-sync-hook

# Keeps teams/relay/schema-sync-hook/files/ in sync with the real source files,
# automatically — nobody should ever hand-edit the copies in files/.
on:
  push:
    branches: ["main"]
    paths:
      - "teams/relay/src/main/proto/**"
      - "teams/relay/ci/**"
      - ".github/workflows/relay-schema-sync.yaml"

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Copy real schema + CI files into the hook chart
        run: |
          mkdir -p teams/relay/schema-sync-hook/files/schemas teams/relay/schema-sync-hook/files/ci
          cp teams/relay/src/main/proto/*.proto teams/relay/schema-sync-hook/files/schemas/
          # only the two scripts the chart actually mounts — not seed-registry.sh /
          # check-all-schemas.sh, which are CI-only
          cp teams/relay/ci/check-schema-compatibility.sh teams/relay/ci/register-schema.sh teams/relay/schema-sync-hook/files/ci/
          cp teams/relay/ci/schema-subjects.tsv teams/relay/schema-sync-hook/files/

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add teams/relay/schema-sync-hook/files
          if git diff --cached --quiet; then
            echo "No changes to sync"
          else
            git commit -m "chore(schema-sync-hook): sync schema/script files [skip ci]"
            git push origin HEAD:main
          fi
