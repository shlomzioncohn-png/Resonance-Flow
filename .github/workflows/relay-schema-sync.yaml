name: Relay / sync schema file copies

# Keeps every copy of relay's schema files in sync with the real source files,
# automatically — nobody should ever hand-edit the copies:
#   - teams/relay/schema-sync-hook/files/  (a Helm chart can't read outside its dir)
#   - teams/inbox/src/main/proto/          (outside inbox's Docker build context)
# Opens a PR rather than pushing: the main ruleset rejects direct pushes (GH013).
on:
  push:
    branches: ["main"]
    paths:
      - "shared/proto/**"
      - "teams/relay/ci/**"
      - ".github/workflows/relay-schema-sync.yaml"

jobs:
  sync:
    runs-on: self-hosted
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: relay-schema-sync
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Copy real schema + CI files into their copies
        run: |
          mkdir -p teams/relay/schema-sync-hook/files/schemas teams/relay/schema-sync-hook/files/ci
          cp shared/proto/*.proto teams/relay/schema-sync-hook/files/schemas/
          # only the two scripts the chart actually mounts — not seed-registry.sh /
          # check-all-schemas.sh, which are CI-only
          cp teams/relay/ci/check-schema-compatibility.sh teams/relay/ci/register-schema.sh teams/relay/schema-sync-hook/files/ci/
          cp teams/relay/ci/schema-subjects.tsv teams/relay/schema-sync-hook/files/
          # inbox keeps only the schemas it publishes - refresh those, don't add others
          for f in teams/inbox/src/main/proto/*.proto; do
            cp "teams/relay/src/main/proto/$(basename "$f")" "$f"
          done

      # PAT, not GITHUB_TOKEN - see service-update-manifest.yaml. No-op when nothing changed.
      - name: Open a PR with the synced copies
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.RELAY_CI_PUSH_TOKEN }}
          base: main
          branch: ci/relay-schema-sync
          add-paths: |
            teams/relay/schema-sync-hook/files
            teams/inbox/src/main/proto
          commit-message: "chore(relay): sync schema file copies"
          title: "chore(relay): sync schema file copies"
          body: "Automated sync of `teams/relay/src/main/proto` and `teams/relay/ci` into their copies, triggered by `${{ github.sha }}`. Needs review/approval per the `main` branch ruleset."
