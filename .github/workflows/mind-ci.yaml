name: Mind CI/CD

on:
  push:
    branches: [ "main" ]
    tags: [ "mind-v*.*.*" ]
    paths:
      - "teams/mind/**"
  pull_request:
    branches: [ "main" ]
    paths:
      - "teams/mind/**"
  workflow_dispatch: {}

jobs:
  ci:
    permissions:
      contents: write
      packages: write
      pull-requests: write
    uses: ./.github/workflows/service-ci.yaml
    with:
      service_name: mind
      service_dir: teams/mind
      language: python
      container_port: 8000
