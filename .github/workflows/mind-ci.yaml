name: Mind CI/CD

on:
  push:
    branches: [ "main" ]
    tags: [ "mind-v*.*.*" ]
    paths:
      - "teams/mind/**"
      - "shared/proto/**"
  pull_request:
    # ready_for_review: draft PRs skip CI (see lint's `if`), so it has to run
    # when the PR leaves draft.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "teams/mind/**"
      - "shared/proto/**"
      - ".github/workflows/mind-ci.yaml"
  workflow_dispatch: {}

# Cancel an in-progress run when a newer commit is pushed to the same ref —
# the older run is measuring stale code and just burns Actions minutes.
concurrency:
  group: mind-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Needs only Python (no kind/Docker/Postgres), so it runs on GitHub's
  # runners and doesn't hold a slot on the shared self-hosted runner. Skipped
  # on draft PRs; every other job needs lint, so they skip with it.
  lint:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15  # a hung `make eval` must not run to the 6h default
    permissions:
      contents: read
    defaults:
      run:
        working-directory: teams/mind
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: teams/mind/pyproject.toml

      - name: Install
        run: make dev

      - name: Lint (ruff + mypy)
        run: make lint

      # Smoke-check that run.py still produces a report end-to-end. The real
      # regression check runs against eval/personas/ — it is switched on in the
      # PR that lands the persona scenario set.
      - name: Evaluation harness smoke check
        run: python -m mind.evaluation.run --model dummy --personas tests/fixtures/personas

  ci:
    needs: lint
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/service-ci-python.yaml
    with:
      service_name: mind
      service_dir: teams/mind

  # #469: produces real numbers for vector-store-comparison.md's "Foundation
  # Gate benchmark" section against a real pgvector instance (same kind
  # cluster + Helm infra the `ci`/`cd` jobs use), instead of a human having
  # to trust a result no CI run ever actually reproduced. Report-only, not a
  # merge gate -- continue-on-error so a flaky run doesn't block the PR.
  # Runs only after merge to main, not on every PR push. Not on
  # workflow_dispatch either: a manual run also runs `cd`, which publishes an image.
  foundation-gate-benchmark:
    needs: lint
    if: github.event_name == 'push'
    runs-on: self-hosted
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-service-infra
        with:
          service_name: mind

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: teams/mind/pyproject.toml

      - name: Install
        working-directory: teams/mind
        run: make dev

      # foundation_gate_benchmark.py uses its own dedicated bench table
      # (create_vector_store_test_table()), not the real task_embeddings
      # schema -- no `alembic upgrade head` needed here.
      - name: Run Foundation Gate benchmark against real Postgres
        working-directory: teams/mind
        env:
          MIND_VECTOR_STORE__DSN: ${{ env.TEST_DATABASE_URL }}
        run: python -m benchmarks.foundation_gate_benchmark

      - name: Write results to job summary
        working-directory: teams/mind
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          r = json.load(open("benchmarks/foundation_gate_benchmark_results.json"))
          print("### Foundation Gate benchmark (#469) -- real numbers from this run\n")
          print(f"Vectors: {r['total_vector_count']} ({r['real_task_count']} real + {r['filler_task_count']} filler)\n")
          lat = r["latency"]
          print(f"Latency: p50={lat['p50_ms']:.2f}ms p95={lat['p95_ms']:.2f}ms p99={lat['p99_ms']:.2f}ms\n")
          print(f"Recall: {r['recall_hit_rate']*len(r['recall_detail']):.0f}/{len(r['recall_detail'])} "
                f"({r['recall_hit_rate']*100:.0f}%)\n")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: foundation-gate-benchmark-results
          path: teams/mind/benchmarks/foundation_gate_benchmark_results.json

  cd:
    needs: lint
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      packages: write
      pull-requests: write
    uses: ./.github/workflows/service-cd.yaml
    secrets: inherit
    with:
      service_name: mind
      service_dir: teams/mind
      language: python
      container_port: 8000
      extra_build_contexts: shared=shared

  # Deploys Kafka/Schema Registry/MIND via the real Helm chart; round-trip.py
  # then runs from the runner against the deployed Kafka/registry.
  # needs lint: don't spend ~9 runner minutes when lint already failed.
  round-trip:
    needs: lint
    if: github.event_name == 'pull_request'
    runs-on: self-hosted
    timeout-minutes: 25
    permissions:
      contents: read

    env:
      RELEASE: mind
      NAMESPACE: mind

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-service-infra
        with:
          service_name: mind

      - uses: ./.github/actions/deploy-service
        with:
          service_name: mind
          service_dir: teams/mind
          extra_build_contexts: shared=shared
          push: 'false'

      - name: Register the schemas through Relay's schema-sync-hook
        run: |
          SR_SVC=$(kubectl -n "$NAMESPACE" get svc -l app.kubernetes.io/component=schema-registry -o jsonpath='{.items[0].metadata.name}')
          helm install schema-sync teams/relay/schema-sync-hook -n "$NAMESPACE" \
            --set schemaRegistryUrl="http://${SR_SVC}.${NAMESPACE}.svc.cluster.local:8080/apis/ccompat/v6" \
            --wait --wait-for-jobs --timeout 300s \
            || { kubectl -n "$NAMESPACE" logs -l app.kubernetes.io/instance=schema-sync --tail=200; exit 1; }

      # Kafka's advertised.listeners is the in-cluster pod DNS name, unreachable
      # through a port-forward - run round-trip.py inside the MIND pod instead.
      - name: Round trip
        run: |
          POD=$(kubectl -n "$NAMESPACE" get pod -l app.kubernetes.io/component=mind -o jsonpath='{.items[0].metadata.name}')
          SR_SVC=$(kubectl -n "$NAMESPACE" get svc -l app.kubernetes.io/component=schema-registry -o jsonpath='{.items[0].metadata.name}')
          kubectl -n "$NAMESPACE" exec "$POD" -- python scripts/round-trip.py \
            --bootstrap-servers "${RELEASE}-kafka:9092" \
            --schema-registry-url "http://${SR_SVC}:8080/apis/ccompat/v6"
