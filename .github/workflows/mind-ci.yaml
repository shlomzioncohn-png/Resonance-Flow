name: Mind CI/CD

on:
  push:
    branches: [ "main" ]
    tags: [ "mind-v*.*.*" ]
    paths:
      - "teams/mind/**"
  pull_request:
    paths:
      - "teams/mind/**"
      - ".github/workflows/mind-ci.yaml"
  workflow_dispatch: {}

# Cancel an in-progress run when a newer commit is pushed to the same ref —
# the older run is measuring stale code and just burns Actions minutes.
concurrency:
  group: mind-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: self-hosted
    timeout-minutes: 15  # a hung `make eval` must not run to the 6h default
    permissions:
      contents: read
    defaults:
      run:
        working-directory: teams/mind
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: teams/mind/pyproject.toml

      - name: Install
        run: make dev

      - name: Lint (ruff + mypy)
        run: make lint

      # Smoke-check that run.py still produces a report end-to-end. The real
      # regression check runs against eval/personas/ — it is switched on in the
      # PR that lands the persona scenario set.
      - name: Evaluation harness smoke check
        run: python -m mind.evaluation.run --model dummy --personas tests/fixtures/personas

  ci:
    needs: lint
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/service-ci-python.yaml
    with:
      service_name: mind
      service_dir: teams/mind

  cd:
    needs: lint
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      packages: write
      pull-requests: write
    uses: ./.github/workflows/service-cd.yaml
    secrets: inherit
    with:
      service_name: mind
      service_dir: teams/mind
      language: python
      container_port: 8000

  # Deploys Kafka/Schema Registry/MIND via the real Helm chart; round-trip.py
  # then runs from the runner against the deployed Kafka/registry.
  round-trip:
    if: github.event_name == 'pull_request'
    runs-on: self-hosted
    timeout-minutes: 25
    permissions:
      contents: read

    env:
      CHART_DIR: teams/relay/helm/resonance-flow
      RELEASE: mind-rt
      NAMESPACE: mind-rt

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/free-runner-disk

      - uses: azure/setup-helm@v5

      # No working-directory override on this or the helm/kubectl steps below -
      # kind's kubeconfig write-up is tied to where it runs, keep it at the repo root.
      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: mind-rt-cluster

      - name: Fetch chart dependencies
        run: helm dependency build "$CHART_DIR"

      # Phase 1: infra only, MIND's image isn't built yet (two-phase, like service-ci.yaml).
      - name: Deploy chart with MIND disabled (infra only)
        run: |
          helm upgrade --install "$RELEASE" "$CHART_DIR" \
            -f "$CHART_DIR/values.yaml" \
            -f "$CHART_DIR/values/values-mind.yaml" \
            --set components.mind.enabled=false \
            --namespace "$NAMESPACE" --create-namespace \
            --wait --timeout 420s

      - name: Build and load the MIND image
        working-directory: teams/mind
        run: |
          docker build -t mind:local .
          kind load docker-image mind:local --name mind-rt-cluster

      # No --wait here on purpose: the MIND deployment can't become Ready
      # until the schema is migrated (see "Run Alembic migrations" below),
      # so waiting here would just time out before that ever runs. This
      # step only needs to get the Deployment/ConfigMap/Secret applied.
      - name: Deploy chart with MIND enabled
        run: |
          helm upgrade --install "$RELEASE" "$CHART_DIR" \
            -f "$CHART_DIR/values.yaml" \
            -f "$CHART_DIR/values/values-mind.yaml" \
            --namespace "$NAMESPACE"

      # #441/#528 moved vector-store schema creation from the app's own
      # auto-create-on-first-use to Alembic migrations -- nothing else in
      # this cluster runs them, so without this step the MIND pod crashes
      # at startup ("Vector store table 'task_embeddings' does not exist")
      # and never becomes Ready. Runs as a one-off Pod using the same
      # already-loaded image and the same config/secret mounts the real
      # Deployment uses (see templates/deployment.yaml), so it resolves
      # the DSN exactly the way the app itself would.
      - name: Run Alembic migrations
        run: |
          cat <<EOF | kubectl -n "$NAMESPACE" apply -f -
          apiVersion: v1
          kind: Pod
          metadata:
            name: mind-migrate
          spec:
            restartPolicy: Never
            containers:
              - name: migrate
                image: mind:local
                imagePullPolicy: Never
                command: ["alembic", "upgrade", "head"]
                env:
                  - name: CONFIG_FILE_PATH
                    value: "/etc/resonance-flow/config/config.yaml"
                  - name: SECRETS_FILE_PATH
                    value: "/etc/resonance-flow/secret/secrets.yaml"
                volumeMounts:
                  - name: resonance-flow-config
                    mountPath: /etc/resonance-flow/config/config.yaml
                    subPath: config.yaml
                    readOnly: true
                  - name: resonance-flow-secret
                    mountPath: /etc/resonance-flow/secret
                    readOnly: true
            volumes:
              - name: resonance-flow-config
                configMap:
                  name: resonance-flow-mind-config
              - name: resonance-flow-secret
                secret:
                  secretName: resonance-flow-mind-secret
                  optional: true
          EOF
          kubectl -n "$NAMESPACE" wait --for=jsonpath='{.status.phase}'=Succeeded pod/mind-migrate --timeout=120s || true
          kubectl -n "$NAMESPACE" logs pod/mind-migrate
          STATUS=$(kubectl -n "$NAMESPACE" get pod mind-migrate -o jsonpath='{.status.phase}')
          kubectl -n "$NAMESPACE" delete pod mind-migrate --ignore-not-found
          test "$STATUS" = "Succeeded"

      - name: Wait for MIND deployment to be ready
        run: kubectl -n "$NAMESPACE" rollout status deployment/resonance-flow-mind --timeout=420s

      - name: Diagnose deploy failure
        if: failure()
        run: |
          kubectl -n "$NAMESPACE" get pods -o wide
          kubectl -n "$NAMESPACE" describe pods
          kubectl -n "$NAMESPACE" logs -l app.kubernetes.io/component=mind --all-containers --tail=200 || true
          kubectl -n "$NAMESPACE" logs pod/mind-migrate --tail=200 || true

      # Kafka's advertised.listeners is the in-cluster pod DNS name, unreachable
      # through a port-forward - run round-trip.py inside the MIND pod instead.
      - name: Round trip
        run: |
          POD=$(kubectl -n "$NAMESPACE" get pod -l app.kubernetes.io/component=mind -o jsonpath='{.items[0].metadata.name}')
          SR_SVC=$(kubectl -n "$NAMESPACE" get svc -l app.kubernetes.io/component=schema-registry -o jsonpath='{.items[0].metadata.name}')
          kubectl -n "$NAMESPACE" exec "$POD" -- python scripts/round-trip.py \
            --bootstrap-servers "${RELEASE}-kafka:9092" \
            --schema-registry-url "http://${SR_SVC}:8080/apis/ccompat/v6"
