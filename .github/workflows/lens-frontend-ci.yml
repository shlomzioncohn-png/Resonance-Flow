name: Lens Frontend CI/CD / ci / test

on:
  pull_request:
    paths:
      - 'teams/lens/frontend/**'
      - '.github/workflows/lens-frontend-ci.yml'
      - 'docker-compose.yml'
      - 'teams/lens/docker-compose.yml'

concurrency:
  group: lens-frontend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: teams/lens/frontend
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: teams/lens/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint + TypeScript)
        run: npm run lint

      - name: Build
        run: npm run build

      - name: E2E Tests (Playwright)
        run: npm run test:e2e

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: teams/lens/frontend/playwright-report/
          retention-days: 30
