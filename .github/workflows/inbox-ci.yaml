name: Inbox CI/CD

on:
  push:
    branches: [ "main" ]
    tags: [ "inbox-v*.*.*" ]
    paths:
      - "teams/inbox/**"
      - "shared/proto/**"
  pull_request:
    branches: [ "main" ]
    paths:
      - "teams/inbox/**"
      - "shared/proto/**"
  workflow_dispatch: {}

jobs:
  ci:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/service-ci-java.yaml
    with:
      service_name: inbox
      service_dir: teams/inbox

  release:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      packages: write
      pull-requests: write
    uses: ./.github/workflows/service-release.yaml
    secrets: inherit
    with:
      service_name: inbox
      service_dir: teams/inbox
      language: java
      container_port: 8080
      extra_build_contexts: shared=shared
