name: LENS issue auto-fix

# Manual trigger by design: apply the "lens-auto-fix" label to an issue to run this.
# Do NOT switch to `types: [opened]` in this monorepo without scoping it (5 teams
# share this repo/issue tracker) - it would fire Claude on every issue, not just LENS ones.
on:
  issues:
    types: [labeled]

jobs:
  fix:
    if: github.event.label.name == 'lens-auto-fix'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v6

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            /fix-reported-issue

            Issue #${{ github.event.issue.number }}: ${{ github.event.issue.title }}

            ${{ github.event.issue.body }}
          claude_args: "--max-turns 20"
