name: MIND / update LLM key Secret

on:
  workflow_dispatch: {}

jobs:
  update:
    runs-on: self-hosted
    permissions:
      contents: read
    concurrency:
      group: mind-llm-secret
      cancel-in-progress: false
    env:
      NAMESPACE: resonance-flow
      SECRET: resonance-flow-mind-llm
      DEPLOYMENT: resonance-flow-mind
    steps:
      - name: Write the cluster kubeconfig
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: |
          [ -n "$KUBECONFIG_CONTENT" ] || { echo "::error::The KUBECONFIG secret is not set"; exit 1; }
          (umask 077 && printf '%s\n' "$KUBECONFIG_CONTENT" > "$RUNNER_TEMP/kubeconfig")
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      - name: Create or update the Secret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          KEYS="$(mktemp -d)"
          trap 'rm -rf "$KEYS"' EXIT
          ARGS=()
          if [ -n "$GEMINI_API_KEY" ]; then
            (umask 077 && printf '%s' "$GEMINI_API_KEY" > "$KEYS/gemini-api-key")
            ARGS+=(--from-file="$KEYS/gemini-api-key")
          fi
          if [ -n "$DEEPSEEK_API_KEY" ]; then
            (umask 077 && printf '%s' "$DEEPSEEK_API_KEY" > "$KEYS/deepseek-api-key")
            ARGS+=(--from-file="$KEYS/deepseek-api-key")
          fi
          [ "${#ARGS[@]}" -gt 0 ] || { echo "::error::Neither GEMINI_API_KEY nor DEEPSEEK_API_KEY is set"; exit 1; }
          kubectl -n "$NAMESPACE" create secret generic "$SECRET" "${ARGS[@]}" --dry-run=client -o yaml \
            | kubectl apply --server-side --field-manager=mind-llm-secret --force-conflicts -f -

      - name: Restart MIND so it reads the new key
        run: kubectl -n "$NAMESPACE" rollout restart "deployment/$DEPLOYMENT"

      - name: Remove the kubeconfig
        if: always()
        run: rm -f "$RUNNER_TEMP/kubeconfig"
