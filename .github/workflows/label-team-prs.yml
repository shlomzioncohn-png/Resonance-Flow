name: Label team PRs

on:
  pull_request:
    types: [opened]

jobs:
  add-label:
    runs-on: self-hosted
    # Labeling is cosmetic - a GitHub API hiccup here must not fail PR checks.
    continue-on-error: true
    # Repo default token is read-only; creating/adding labels needs write.
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Ensure labels exist and label the PR by its author's team
        uses: actions/github-script@v7
        with:
          script: |
            const teams = [
              { label: 'Lens',   color: '0e8a16', members: ['Dvori-558', 'elisheva-666', 'sarisholomon', 'mali8573'] },
              { label: 'Inbox',  color: '1d76db', members: [] }, // fill in: INBOX team members
              { label: 'Bridge', color: '5319e7', members: [] }, // fill in: BRIDGE team members
              { label: 'Mind',   color: 'b60205', members: [] }, // fill in: MIND team members
              { label: 'Chain',  color: 'fbca04', members: ['RuthHoltzman', 'Shifi-Aisenstain', 'rikiMittelman'] },
              { label: 'Relay',  color: '0052cc', members: ['avigailrapa', 'Ayala679', 'ch-kap219', 'gittyafe'] },
            ];

            // Label names are case-insensitive on GitHub, so compare lowercased
            const existingLabels = await github.paginate(
              github.rest.issues.listLabelsForRepo,
              { owner: context.repo.owner, repo: context.repo.repo }
            );
            const existingNames = new Set(existingLabels.map(l => l.name.toLowerCase()));

            for (const team of teams) {
              if (!existingNames.has(team.label.toLowerCase())) {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: team.label,
                  color: team.color,
                });
                console.log(`Created missing label: ${team.label}`);
              }
            }

            const author = context.payload.pull_request.user.login;
            const matchedTeam = teams.find(team => team.members.includes(author));

            if (matchedTeam) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                labels: [matchedTeam.label]
              });
              console.log(`Added label "${matchedTeam.label}" for ${author}`);
            } else {
              console.log(`No team match found for ${author}, skipping.`);
            }
