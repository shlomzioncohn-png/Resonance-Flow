name: Deploy service
description: >
  Builds the service's image, loads it into the already-running kind cluster, upgrades
  the chart to enable the component with that image, smoke-tests it, then pushes the
  image to GHCR. Assumes setup-service-infra already ran in this job (same kind cluster,
  same namespace, component installed disabled, $CHART_DIR/$CHART_VALUES exported).

inputs:
  service_name:
    description: "Component name, matches the key under components.<service_name> in teams/relay/helm/resonance-flow/values.yaml"
    required: true
  service_dir:
    description: "Path to the service, e.g. teams/bridge"
    required: true
  container_port:
    description: "Unused - the smoke test lets kubectl pick a free port. Kept until callers stop passing it (already removed on main by #504)."
    required: false
    default: ""
  extra_build_contexts:
    description: "Optional docker build-contexts (name=path per line), e.g. shared=shared"
    required: false
    default: ""

outputs:
  image_tag:
    description: "Short git SHA used to tag the built image"
    value: ${{ steps.tags.outputs.short_sha }}
  image_repository:
    description: "Lowercased ghcr.io repository path the image was pushed to"
    value: ${{ steps.normalize.outputs.image_name }}

runs:
  using: composite
  steps:
    - name: Normalize image name to lowercase
      id: normalize
      shell: bash
      run: |
        RAW_IMAGE_NAME="ghcr.io/${{ github.repository }}/${{ inputs.service_name }}"
        IMAGE_NAME=$(echo "$RAW_IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
        echo "IMAGE_NAME=${IMAGE_NAME}" >> "$GITHUB_ENV"
        echo "image_name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

    - name: Compute image tags (sha + semver, no latest)
      id: tags
      shell: bash
      run: |
        SHORT_SHA=$(git rev-parse --short=7 HEAD)
        TAGS="${IMAGE_NAME}:${SHORT_SHA}"
        if [ "${{ github.ref_type }}" = "tag" ]; then
          VERSION="${GITHUB_REF_NAME#${{ inputs.service_name }}-}"
          TAGS="${TAGS},${IMAGE_NAME}:${VERSION}"
        fi
        echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
        echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

    - uses: docker/setup-buildx-action@v3

    - name: Build image (local, for smoke test)
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.service_dir }}
        build-contexts: ${{ inputs.extra_build_contexts }}
        load: true
        tags: ${{ inputs.service_name }}:local
        cache-from: type=gha,scope=${{ inputs.service_name }}
        cache-to: type=gha,mode=max,scope=${{ inputs.service_name }}

    - name: Load image into kind
      shell: bash
      run: kind load docker-image ${{ inputs.service_name }}:local --name ${{ inputs.service_name }}-cluster

    - name: Deploy chart with the built image (smoke test)
      shell: bash
      run: |
        SERVICE="${{ inputs.service_name }}"
        helm upgrade --install "$SERVICE" "$CHART_DIR" \
          -f "$CHART_VALUES" \
          -f "$CHART_DIR/values/values-${SERVICE}.yaml" \
          --set components.${SERVICE}.image.repository="$SERVICE" \
          --set components.${SERVICE}.image.tag=local \
          --set components.${SERVICE}.image.pullPolicy=Never \
          --namespace "$SERVICE" --create-namespace \
          --wait --timeout 420s

    - name: Diagnose deploy failure
      if: failure()
      shell: bash
      run: |
        SERVICE="${{ inputs.service_name }}"
        echo "::group::kubectl get pods -o wide"
        kubectl -n "$SERVICE" get pods -o wide
        echo "::endgroup::"
        echo "::group::kubectl describe pods"
        kubectl -n "$SERVICE" describe pods
        echo "::endgroup::"
        echo "::group::kubectl get events (sorted)"
        kubectl -n "$SERVICE" get events --sort-by=.lastTimestamp
        echo "::endgroup::"
        for pod in $(kubectl -n "$SERVICE" get pods -o jsonpath='{.items[*].metadata.name}'); do
          echo "::group::kubectl logs $pod (current)"
          kubectl -n "$SERVICE" logs "$pod" --all-containers --tail=200 || true
          echo "::endgroup::"
          echo "::group::kubectl logs $pod (previous, if it restarted)"
          kubectl -n "$SERVICE" logs "$pod" --all-containers --previous --tail=200 || true
          echo "::endgroup::"
        done

    - name: Smoke test
      shell: bash
      run: |
        SERVICE="${{ inputs.service_name }}"
        HEALTH_PATH=$(yq eval ".components.${SERVICE}.readinessProbe.httpGet.path" "$CHART_VALUES")
        # fullnameOverride is pinned to "resonance-flow" (values.yaml), so this is the
        # same Service name ArgoCD deploys in prod.
        SVC="svc/resonance-flow-${SERVICE}"
        # ":80" lets kubectl pick a free local port - fixed ports collide between services
        # sharing the self-hosted runner.
        PF_LOG="$RUNNER_TEMP/port-forward-${SERVICE}.log"
        kubectl -n "$SERVICE" port-forward "$SVC" :80 > "$PF_LOG" 2>&1 &
        PF_PID=$!
        # Don't leave the forward running on the shared runner after the step.
        trap 'kill "$PF_PID" 2>/dev/null || true' EXIT
        for i in $(seq 1 30); do
          PORT=$(sed -n 's/^Forwarding from 127\.0\.0\.1:\([0-9]*\) .*/\1/p' "$PF_LOG" | head -1)
          [ -n "$PORT" ] && break
          kill -0 "$PF_PID" 2>/dev/null || break  # forward died (e.g. Service not found) - fail now
          sleep 1
        done
        if [ -z "$PORT" ]; then
          echo "port-forward to $SVC never came up:" >&2; cat "$PF_LOG" >&2; exit 1
        fi
        curl -sf --retry 5 --retry-connrefused "http://localhost:${PORT}${HEALTH_PATH}"

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Push image
      shell: bash
      run: |
        IFS=',' read -ra TAG_LIST <<< "${{ steps.tags.outputs.tags }}"
        for t in "${TAG_LIST[@]}"; do
          docker tag ${{ inputs.service_name }}:local "$t"
          docker push "$t"
        done
