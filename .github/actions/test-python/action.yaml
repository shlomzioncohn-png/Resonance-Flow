name: Run Python tests
description: Installs the package (dev extras) and runs pytest with coverage for one service.

inputs:
  service_name:
    description: "Component name, used as the coverage package path (src/<service_name>)"
    required: true
  service_dir:
    description: "Path to the service, e.g. teams/mind"
    required: true

runs:
  using: composite
  steps:
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: ${{ inputs.service_dir }}/pyproject.toml

    - name: Install package (dev)
      shell: bash
      working-directory: ${{ inputs.service_dir }}
      run: pip install -e ".[dev]"

    - name: Run Python tests
      shell: bash
      working-directory: ${{ inputs.service_dir }}
      run: pytest --cov=src/${{ inputs.service_name }}
