name: Install yq
description: Installs mikefarah/yq on the (self-hosted) runner, which doesn't ship it.

runs:
  using: composite
  steps:
    - name: Install yq
      shell: bash
      run: |
        sudo curl -sL -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
        sudo chmod +x /usr/local/bin/yq
