server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: inbox
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:resonance_flow}?stringtype=unspecified
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  flyway:
    locations: ${DB_MIGRATIONS_LOCATION:filesystem:../../shared/database/migrations}
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:inbox-service}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

inbox:
  kafka:
    topics:
      bridge-structured-tasks: ${BRIDGE_STRUCTURED_TASKS_TOPIC:bridge.structured.tasks}
      mind-task-creation-requested: ${MIND_TASK_CREATION_REQUESTED_TOPIC:task.creation.requested}
    retry:
      max-attempts: ${INBOX_KAFKA_RETRY_MAX_ATTEMPTS:3}
      initial-backoff-ms: ${INBOX_KAFKA_RETRY_INITIAL_BACKOFF_MS:500}
      multiplier: ${INBOX_KAFKA_RETRY_MULTIPLIER:2.0}
      max-backoff-ms: ${INBOX_KAFKA_RETRY_MAX_BACKOFF_MS:10000}

kafka:
  producer:
    retry:
      max-attempts: ${KAFKA_PRODUCER_RETRY_MAX_ATTEMPTS:3}
      initial-backoff-ms: ${KAFKA_PRODUCER_RETRY_INITIAL_BACKOFF_MS:200}
      backoff-multiplier: ${KAFKA_PRODUCER_RETRY_BACKOFF_MULTIPLIER:2.0}
      max-backoff-ms: ${KAFKA_PRODUCER_RETRY_MAX_BACKOFF_MS:5000}

outbox:
  worker:
    poll-interval-ms: ${OUTBOX_WORKER_POLL_INTERVAL_MS:5000}
    batch-size: ${OUTBOX_WORKER_BATCH_SIZE:20}
    max-retries: ${OUTBOX_WORKER_MAX_RETRIES:3}
    backoff-base-seconds: ${OUTBOX_WORKER_BACKOFF_BASE_SECONDS:10}
    backoff-max-seconds: ${OUTBOX_WORKER_BACKOFF_MAX_SECONDS:120}
  cleanup:
    cron: ${OUTBOX_CLEANUP_CRON:0 0 3 * * *}
    published-retention-days: ${OUTBOX_CLEANUP_PUBLISHED_RETENTION_DAYS:7}
    failed-retention-days: ${OUTBOX_CLEANUP_FAILED_RETENTION_DAYS:30}

logging:
  file:
    name: ${LOG_FILE_PATH:logs/inbox.log}
  logback:
    rollingpolicy:
      max-file-size: ${LOG_MAX_FILE_SIZE:10MB}
      max-history: ${LOG_MAX_HISTORY_DAYS:14}
      total-size-cap: ${LOG_TOTAL_SIZE_CAP:500MB}

