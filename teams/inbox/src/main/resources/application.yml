server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: inbox
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:resonance_flow}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  flyway:
    locations: ${DB_MIGRATIONS_LOCATION:filesystem:../../shared/database/migrations}
    baseline-on-migrate: true
