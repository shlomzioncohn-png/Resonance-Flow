[project]
name = "mind"
version = "0.1.0"
description = "MIND — extraction, embeddings, and scoring for Resonance Flow (Team MIND, KamaTech x Gong Bootcamp)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    # core
    "pydantic>=2.0",
    "fastapi",
    "uvicorn",
    # add as decided: vector-store client, OCR/ASR libs, LLM client, etc.
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "httpx",  # required by fastapi.testclient.TestClient
]
# Not a runtime dependency of src/mind/ -- extraction/multimodal isn't
# built yet (Phase 2). Only benchmarks/ocr_benchmark.py needs these;
# also requires the tesseract-ocr system binary (not pip-installable).
benchmark = [
    "pytesseract",
    "pillow",
    "psutil",  # cross-platform peak-RSS/CPU sampling; stdlib `resource` is Unix-only
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mind"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
