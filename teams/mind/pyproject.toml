[project]
name = "mind"
version = "0.1.0"
description = "MIND — extraction, embeddings, and scoring for Resonance Flow (Team MIND, KamaTech x Gong Bootcamp)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    # core
    "pydantic>=2.0",
    "fastapi",
    "uvicorn",
    # OCR (src/mind/multimodal/ocr.py) -- tesseract --psm 11, the decision
    # made in benchmarks/ocr-asr-benchmark.md. Also requires the
    # tesseract-ocr system binary (not pip-installable).
    "pillow",
    "pypdfium2",  # rasterizes PDF pages to images for the OCR pipeline
    # add as decided: vector-store client, ASR libs, LLM client, etc.
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "httpx",  # required by fastapi.testclient.TestClient
]
# Not a runtime dependency of src/mind/ -- only benchmarks/ocr_asr_benchmark.py
# needs these. pytesseract/pillow/psutil compare against PaddleOCR; PaddleOCR
# also requires its model weights, which may need manual placement under
# ~/.paddlex/official_models/ if the auto-download hosters are
# network-filtered -- see benchmarks/ocr-asr-benchmark.md "PaddleOCR -- setup".
benchmark = [
    "pytesseract",
    "pillow",
    "psutil",  # cross-platform peak-RSS/CPU sampling; stdlib `resource` is Unix-only
    "paddleocr",
    "paddlepaddle",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mind"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.mypy]
# No stubs/py.typed marker published for this dependency.
[[tool.mypy.overrides]]
module = "pypdfium2.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
