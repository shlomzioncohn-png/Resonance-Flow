[project]
name = "mind"
version = "0.1.0"
description = "MIND — extraction, embeddings, and scoring for Resonance Flow (Team MIND, KamaTech x Gong Bootcamp)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    # core
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "fastapi",
    "uvicorn",
    # embeddings (src/mind/embeddings)
    "psycopg[binary,pool]>=3.1",
    "scikit-learn>=1.4",
    "numpy>=1.26",
    # migrations (migrations/) -- runs at deploy time, inside the image,
    # not just in dev, so this belongs here and not in [dev].
    "alembic>=1.13",
    "sqlalchemy>=2.0",
    # add as decided: OCR/ASR libs, LLM client, etc.
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "mypy",
    "httpx",  # required by fastapi.testclient.TestClient
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mind"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# TID252 (flake8-tidy-imports): use absolute imports, not relative ("from .x").
extend-select = ["TID252"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# One event loop for the whole session, not one per test -- see
# tests/test_vector_store.py's _store_lifecycle fixture docstring for why:
# the vector store's connection pool needs to live on one long-lived loop,
# the same way it does under a real server, not get recreated per test.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[[tool.mypy.overrides]]
module = "sklearn.*"
ignore_missing_imports = true
