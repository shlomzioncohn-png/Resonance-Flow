[project]
name = "mind"
version = "0.1.0"
description = "MIND — extraction, embeddings, and scoring for Resonance Flow (Team MIND, KamaTech x Gong Bootcamp)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    # core
    "pydantic>=2.0",
    "fastapi",
    "uvicorn",
    # embeddings (src/mind/embeddings)
    "psycopg2-binary>=2.9",
    "sentence-transformers>=3.0",
    # add as decided: OCR/ASR libs, LLM client, etc.
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mind"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
