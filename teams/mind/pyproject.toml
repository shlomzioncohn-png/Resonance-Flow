[project]
name = "mind"
version = "0.1.0"
description = "MIND — extraction, embeddings, and scoring for Resonance Flow (Team MIND, KamaTech x Gong Bootcamp)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    # core
    "pydantic>=2.0",
    "fastapi",
    "uvicorn",
    # add as decided: vector-store client, OCR/ASR libs, LLM client, etc.
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "httpx",  # required by fastapi.testclient.TestClient
]
# Not a runtime dependency of src/mind/ -- extraction/multimodal isn't
# built yet (Phase 2). Only benchmarks/ocr_asr_benchmark.py needs these;
# Tesseract also requires the tesseract-ocr system binary (not
# pip-installable); PaddleOCR also requires its model weights, which may
# need manual placement under ~/.paddlex/official_models/ if the
# auto-download hosters are network-filtered -- see
# benchmarks/ocr-asr-benchmark.md "PaddleOCR -- setup".
benchmark = [
    "psutil",  # cross-platform peak-RSS/CPU sampling; stdlib `resource` is Unix-only
    "types-psutil",  # mypy stub for psutil -- see [tool.mypy] override below for paddleocr,
                     # which has no stub package to install
    "paddleocr",
    "paddlepaddle",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mind"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "benchmarks"]

# paddleocr ships no type stubs and no py.typed marker -- no stub package
# exists to install (unlike psutil's types-psutil above), so this is the
# standard mypy way to silence "missing library stubs" for it specifically,
# not a blanket ignore for the whole benchmarks/ tree.
[[tool.mypy.overrides]]
module = "paddleocr"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
