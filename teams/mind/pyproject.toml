[project]
name = "mind"
version = "0.1.0"
description = "MIND — extraction, embeddings, and scoring for Resonance Flow (Team MIND, KamaTech x Gong Bootcamp)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    # core
    "pydantic>=2.0",
    "fastapi",
    "uvicorn",
    "confluent-kafka[protobuf,schemaregistry]>=2.5,<2.11",
    "protobuf>=5",
    "pyyaml",
    # add as decided: vector-store client, OCR/ASR libs, LLM client, etc.
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "types-PyYAML",
    "httpx",  # required by fastapi.testclient.TestClient
    "grpcio-tools==1.71.0",  # protoc, for `make proto`
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mind"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["*_pb2.py"]

[tool.mypy]
exclude = ["_pb2\\.py$"]

[[tool.mypy.overrides]]
module = "confluent_kafka.*"
ignore_missing_imports = true

[tool.ruff.lint]
# TID252 (flake8-tidy-imports): use absolute imports, not relative ("from .x").
extend-select = ["TID252"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pytest.ini_options]
testpaths = ["tests"]