# MIND's secrets.yaml for running on your machine (#481) -- `make run-local`
# points SECRETS_FILE_PATH here. Placeholders only: in the cluster this file
# is a real Secret, never one from the repo.
#
# The password is the throwaway one .env.example gives the local
# `vector-store` container (POSTGRES_PASSWORD) -- if you change it there,
# change it here too. Anything real (e.g. a provider key) goes in a copy named
# secrets.local.yaml, which .gitignore keeps out of the repo:
#   make run-local SECRETS_FILE_PATH=secrets.local.yaml

vector_store:
  password: mind
