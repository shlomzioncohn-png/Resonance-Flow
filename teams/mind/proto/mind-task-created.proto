syntax = "proto3";

package com.rnd.mind.event;

option java_package = "com.rnd.mind.event";
option java_multiple_files = true;

import "google/protobuf/timestamp.proto";

// kafkaTopic: task.created (DRAFT, not reconciled with Inbox yet)

message Task {
  string task_id = 1;
  string organization_id = 2;
  optional string project_id = 3;

  string title = 4;
  optional string description = 5;

  SourceType source_type = 6;
  optional string source_ref = 7;

  optional TaskTier tier = 8;
  optional RoleContext role_context = 9;

  optional int32 urgency = 10;                       // 1..5
  optional int32 effort_estimate_minutes = 11;       // > 0
  optional float effort_estimate_confidence = 12;    // 0.0..1.0
  optional google.protobuf.Timestamp deadline = 13;

  TaskStatus status = 14;
  bool is_available = 15;
  optional float priority_score = 16;
  optional google.protobuf.Timestamp snoozed_until = 17;

  ExtractionProvenance extraction_provenance = 18;
  optional float confidence = 19;                    // 0.0..1.0

  optional string owner_id = 20;
  optional string suggested_owner_user_id = 21;
  optional float suggested_owner_confidence = 22;    // 0.0..1.0
  repeated Assignee assignees = 23;

  optional string created_by = 24;
  google.protobuf.Timestamp created_at = 25;
  google.protobuf.Timestamp updated_at = 26;
  optional google.protobuf.Timestamp completed_at = 27;
}

message Assignee {
  AssigneeType assignee_type = 1;
  string id = 2;
}

enum SourceType {
  SOURCE_TYPE_UNSPECIFIED = 0;
  SOURCE_TYPE_EMAIL = 1;
  SOURCE_TYPE_SLACK = 2;
  SOURCE_TYPE_WHATSAPP = 3;
  SOURCE_TYPE_MEETING = 4;
  SOURCE_TYPE_CALENDAR = 5;
  SOURCE_TYPE_DOC = 6;
  SOURCE_TYPE_SCANNED_DOC = 7;
  SOURCE_TYPE_DRIVE = 8;
  SOURCE_TYPE_GITHUB_ISSUE = 9;
}

enum TaskTier {
  TASK_TIER_UNSPECIFIED = 0;
  TASK_TIER_OPERATIONAL = 1;
  TASK_TIER_TACTICAL = 2;
  TASK_TIER_STRATEGIC = 3;
}

enum RoleContext {
  ROLE_CONTEXT_UNSPECIFIED = 0;
  ROLE_CONTEXT_DEVELOPER = 1;
  ROLE_CONTEXT_MANAGER = 2;
  ROLE_CONTEXT_HIGHER_MANAGER = 3;
  ROLE_CONTEXT_FIELD_ENGINEER = 4;
  ROLE_CONTEXT_SALESPERSON = 5;
  ROLE_CONTEXT_CEO = 6;
}

enum TaskStatus {
  TASK_STATUS_UNSPECIFIED = 0;
  TASK_STATUS_NEW = 1;
  TASK_STATUS_IN_REVIEW = 2;
  TASK_STATUS_APPROVED = 3;
  TASK_STATUS_IN_PROGRESS = 4;
  TASK_STATUS_SNOOZED = 5;
  TASK_STATUS_DONE = 6;
  TASK_STATUS_REJECTED = 7;
  TASK_STATUS_CANCELLED = 8;
}

enum ExtractionProvenance {
  EXTRACTION_PROVENANCE_UNSPECIFIED = 0;
  EXTRACTION_PROVENANCE_ETL = 1;
  EXTRACTION_PROVENANCE_ML_INFERRED = 2;
  EXTRACTION_PROVENANCE_MANUAL = 3;
}

enum AssigneeType {
  ASSIGNEE_TYPE_UNSPECIFIED = 0;
  ASSIGNEE_TYPE_USER = 1;
  ASSIGNEE_TYPE_TEAM = 2;
}
