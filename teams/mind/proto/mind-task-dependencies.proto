syntax = "proto3";

package com.rnd.mind.event;

option java_package = "com.rnd.mind.event";
option java_multiple_files = true;

import "google/protobuf/timestamp.proto";

// kafkaTopic: task.dependencies.detected (DRAFT, not confirmed with Chain yet)

message TaskDependenciesDetected {
  string tenant_id = 1;
  string task_id = 2;
  repeated string depends_on_task_ids = 3;
  optional int32 estimated_duration_minutes = 4;
  google.protobuf.Timestamp created_at = 5;
}
