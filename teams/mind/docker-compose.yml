services:
  mind:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Overrides the host= in .env's MIND_VECTOR_STORE_DSN: on this
      # compose network the DB is reachable at its service name,
      # `vector-store`, not `localhost` (which inside this container would
      # mean the `mind` container itself). Credentials match the
      # vector-store service's own bootstrap env below.
      MIND_VECTOR_STORE_DSN: dbname=${VECTOR_STORE_DB:-mind} user=${VECTOR_STORE_USER:-mind} password=${VECTOR_STORE_PASSWORD:-mind} host=vector-store port=5432
    volumes:
      - ./models:/app/models
    depends_on:
      vector-store:
        condition: service_healthy

  # pgvector: PostgreSQL + a vector similarity search extension. See
  # README "Open decisions" (resolved) and db/init/ for the extension
  # bootstrap -- no application schema yet, that lands with the real
  # embeddings work.
  vector-store:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=${VECTOR_STORE_USER:-mind}
      - POSTGRES_PASSWORD=${VECTOR_STORE_PASSWORD:-mind}
      - POSTGRES_DB=${VECTOR_STORE_DB:-mind}
    ports:
      - "5432:5432"
    volumes:
      - vector-store-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${VECTOR_STORE_USER:-mind} -d ${VECTOR_STORE_DB:-mind}"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  vector-store-data:
