services:
  mind:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Built from POSTGRES_USER/PASSWORD/DB (below) rather than read as a
      # single var from .env, and pointed at the `vector-store` service
      # name -- inside this container, `localhost` would mean the `mind`
      # container itself, not the DB container next to it.
      MIND_VECTOR_STORE__DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@vector-store:5432/${POSTGRES_DB}
    volumes:
      - ./models:/app/models
    depends_on:
      migrate:
        condition: service_completed_successfully

  # One-shot: runs the schema migrations against `vector-store` and exits.
  # `mind` waits on this completing successfully, not just on `vector-store`
  # being healthy -- an unmigrated table must fail the whole stack here,
  # not surface later as an UndefinedTable on the app's first query.
  migrate:
    build: .
    env_file:
      - .env
    environment:
      MIND_VECTOR_STORE__DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@vector-store:5432/${POSTGRES_DB}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      vector-store:
        condition: service_healthy

  vector-store:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - vector-store-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  vector-store-data:
