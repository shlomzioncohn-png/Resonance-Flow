services:
  mind:
    build:
      context: .
      additional_contexts:
        shared: ../../shared
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Built from POSTGRES_USER/PASSWORD/DB (below) rather than read as a
      # single var from .env, and pointed at the `vector-store` service
      # name -- inside this container, `localhost` would mean the `mind`
      # container itself, not the DB container next to it.
      MIND_VECTOR_STORE__DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@vector-store:5432/${POSTGRES_DB}
    volumes:
      - ./models:/app/models
    depends_on:
      vector-store:
        condition: service_healthy

  mind-index-consumer:
    build:
      context: .
      additional_contexts:
        shared: ../../shared
    command: ["python", "-m", "mind.embeddings.index_consumer_runner"]
    # No HTTP server in this process -- the Dockerfile's HEALTHCHECK (hits
    # :8000/health) doesn't apply here and would report unhealthy forever.
    healthcheck:
      disable: true
    # No local Kafka broker wired into this compose file yet (only
    # teams/inbox/docker-compose.yml has one today) -- gated behind a
    # profile so `docker compose up`/`make docker-up` doesn't start a
    # consumer with nothing to connect to. Bring it up explicitly once
    # there's a broker: `docker compose --profile kafka up`.
    profiles: ["kafka"]
    env_file:
      - .env
    environment:
      MIND_VECTOR_STORE__DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@vector-store:5432/${POSTGRES_DB}
    volumes:
      - ./models:/app/models
    depends_on:
      vector-store:
        condition: service_healthy

  vector-store:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - vector-store-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  vector-store-data:
