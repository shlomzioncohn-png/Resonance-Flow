# #481: every MIND container reads its connection settings from two files,
# mounted at the same paths Relay's Helm chart uses in the cluster:
#   config.yaml  <- ./config.compose.yml (committed; no credentials)
#   secrets.yaml <- built here from .env's POSTGRES_PASSWORD (mind-secrets below),
#                   so no password is committed and it can't drift from the DB's.
x-mind-config-env: &mind-config-env
  CONFIG_FILE_PATH: /etc/resonance-flow/config/config.yaml
  SECRETS_FILE_PATH: /etc/resonance-flow/secret/secrets.yaml
x-mind-config-files: &mind-config-files
  - source: mind-config
    target: /etc/resonance-flow/config/config.yaml
  - source: mind-secrets
    target: /etc/resonance-flow/secret/secrets.yaml

services:
  mind:
    build:
      context: .
      additional_contexts:
        shared: ../../shared
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment: *mind-config-env
    configs: *mind-config-files
    volumes:
      - ./models:/app/models
    depends_on:
      migrate:
        condition: service_completed_successfully

  # One-shot: runs the schema migrations against `vector-store` and exits.
  # `mind` waits on this completing successfully, not just on `vector-store`
  # being healthy -- an unmigrated table must fail the whole stack here,
  # not surface later as an UndefinedTable on the app's first query.
  migrate:
    # Same build as `mind`: the Dockerfile copies shared/proto from the
    # `shared` context, so a bare `build: .` can't build it.
    build:
      context: .
      additional_contexts:
        shared: ../../shared
    env_file:
      - .env
    environment: *mind-config-env
    configs: *mind-config-files
    command: ["alembic", "upgrade", "head"]
    depends_on:
      vector-store:
        condition: service_healthy

  mind-index-consumer:
    build:
      context: .
      additional_contexts:
        shared: ../../shared
    command: ["python", "-m", "mind.embeddings.index_consumer_runner"]
    # No HTTP server here -- the Dockerfile's :8000/health check doesn't apply.
    healthcheck:
      disable: true
    # No local Kafka broker wired up yet -- `docker compose --profile kafka up`.
    profiles: ["kafka"]
    env_file:
      - .env
    environment: *mind-config-env
    configs: *mind-config-files
    volumes:
      - ./models:/app/models
    depends_on:
      migrate:
        condition: service_completed_successfully

  mind-score-publisher:
    build:
      context: .
      additional_contexts:
        shared: ../../shared
    command: ["python", "-m", "mind.scoring.score_publisher_runner"]
    # A Kafka error kills the process on purpose, so the message is retried.
    restart: on-failure
    # No HTTP server here -- the Dockerfile's :8000/health check doesn't apply.
    healthcheck:
      disable: true
    # No local Kafka broker wired up yet -- `docker compose --profile kafka up`.
    profiles: ["kafka"]
    env_file:
      - .env
    environment: *mind-config-env
    configs: *mind-config-files

  # #919: bridge.raw.landed -> extraction -> dedup -> task.creation.requested,
  # with the task.created listener in the same process (one in-memory pending
  # store). Kafka, the vector store and the LLM provider come from the config
  # files (#481), like the consumers above; MinIO from MIND_OBJECT_STORAGE__* in .env.
  mind-landed-consumer:
    build:
      context: .
      additional_contexts:
        shared: ../../shared
    command: ["python", "-m", "mind.ingestion.landed_consumer_runner"]
    # A Kafka error kills the process on purpose, so the message is retried.
    restart: on-failure
    # No HTTP server here -- the Dockerfile's :8000/health check doesn't apply.
    healthcheck:
      disable: true
    # No local Kafka broker wired up yet -- `docker compose --profile kafka up`.
    profiles: ["kafka"]
    env_file:
      - .env
    environment: *mind-config-env
    configs: *mind-config-files
    volumes:
      - ./models:/app/models
    depends_on:
      migrate:
        condition: service_completed_successfully

  vector-store:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - vector-store-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  vector-store-data:

configs:
  mind-config:
    file: ./config.compose.yml
  # A config, not a Compose secret: a secret can only hold one raw value, and
  # MIND needs a YAML file. Local dev only -- in the cluster it's a real Secret.
  mind-secrets:
    content: |
      vector_store:
        password: "${POSTGRES_PASSWORD}"
