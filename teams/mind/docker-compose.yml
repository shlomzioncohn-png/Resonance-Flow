services:
  mind:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Overrides the host= in .env's MIND_VECTOR_STORE_DSN: on this
      # compose network the DB is reachable at its service name,
      # `vector-store`, not `localhost` (which inside this container would
      # mean the `mind` container itself).
      MIND_VECTOR_STORE_DSN: dbname=mind user=postgres password=postgres host=vector-store port=5432
    volumes:
      - ./models:/app/models
    depends_on:
      vector-store:
        condition: service_healthy

  vector-store:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mind
    ports:
      - "5432:5432"
    volumes:
      - vector-store-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  vector-store-data:
