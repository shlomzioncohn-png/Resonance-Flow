services:
  # ========================================
  # Gateway - Spring Boot (Port 8080)
  # ========================================
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: gateway-service
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      - SERVER_PORT=8080
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-local}
      - BFF_SERVICE_URL=http://host.docker.internal:8082
    networks:
      - lens-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ========================================
  # Frontend - Next.js (Port 3000)
  # ========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: lens-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NEXT_PUBLIC_GATEWAY_URL=http://gateway:8080
      - NODE_ENV=development
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - lens-network
    command: npm run dev

  # ========================================
  # Playwright E2E Tests (Profile: test)
  # ========================================
  playwright:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: playwright
    container_name: lens-playwright
    environment:
      - PLAYWRIGHT_HEADLESS=true
      - BASE_URL=http://frontend:3000
    volumes:
      - ./frontend/tests:/app/tests
      - ./frontend/playwright.config.ts:/app/playwright.config.ts
      - ./frontend/test-results:/app/test-results
    depends_on:
      frontend:
        condition: service_started
    networks:
      - lens-network
    command: npm run test:e2e
    profiles:
      - test

networks:
  lens-network:
    driver: bridge
