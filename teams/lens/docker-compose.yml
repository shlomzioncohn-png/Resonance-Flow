networks:
  default:
    name: lens

services:
  gateway:
    build: ./gateway
    container_name: lens-gateway
    environment:
      - SERVER_PORT=8080
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-local}
      # Gateway's Java default (bff-service:8080) matches neither this compose file's
      # bff service name nor its port — must be overridden here or every BFF-bound
      # request (workspace endpoints, /health/ready) fails to resolve.
      - BFF_SERVICE_URL=http://bff:8082
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      - bff

  bff:
    build: ./bff
    container_name: lens-bff
    environment:
      - SERVER_PORT=8082
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-local}
    ports:
      - "${BFF_PORT:-8082}:8082"

  lens-frontend:
    build: ./frontend
    container_name: lens-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - gateway
      - bff
