networks:
  default:
    name: lens

services:
  gateway:
    build: ./gateway
    container_name: lens-gateway
    environment:
      - SERVER_PORT=8080
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-local}
    ports:
      - "${GATEWAY_PORT:-8080}:8080"

  bff:
    build: ./bff
    container_name: lens-bff
    environment:
      - SERVER_PORT=8082
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-local}
    ports:
      - "${BFF_PORT:-8082}:8082"

  lens-frontend:
    build: ./frontend
    container_name: lens-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - gateway
      - bff
