services:
  # ========================================
  # Keycloak - Identity provider (Port 8180)
  # ========================================
  # Dev mode (in-memory DB): the "lens" realm, its roles, clients and test
  # users are re-imported from keycloak/realm-lens.json on every start.
  # Admin console: http://localhost:8180 (admin / admin)
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    container_name: lens-keycloak
    command: start-dev --import-realm
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      # Tokens are always issued with iss=http://localhost:8180/realms/lens (the
      # URL the browser uses), even when fetched from inside the docker network.
      - KC_HOSTNAME=http://localhost:${KEYCLOAK_PORT:-8180}
      - KC_HOSTNAME_BACKCHANNEL_DYNAMIC=true
    volumes:
      - ./keycloak/realm-lens.json:/opt/keycloak/data/import/realm-lens.json:ro
    networks:
      - lens-network

  # ========================================
  # Gateway - Spring Boot (Port 8080)
  # ========================================
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: gateway-service
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      - SERVER_PORT=8080
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-local}
      - BFF_SERVICE_URL=http://host.docker.internal:8082
      # Must match the token's "iss" claim (Keycloak's public URL)
      - KEYCLOAK_ISSUER_URI=http://localhost:${KEYCLOAK_PORT:-8180}/realms/lens
      # Signing keys are fetched over the internal docker network
      - KEYCLOAK_JWK_SET_URI=http://keycloak:8080/realms/lens/protocol/openid-connect/certs
    depends_on:
      - keycloak
    networks:
      - lens-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ========================================
  # Frontend - Next.js (Port 3000)
  # ========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: lens-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NEXT_PUBLIC_GATEWAY_URL=http://gateway:8080
      - NODE_ENV=development
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - lens-network
    command: npm run dev

  # ========================================
  # Playwright E2E Tests (Profile: test)
  # ========================================
  playwright:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: playwright
    container_name: lens-playwright
    environment:
      - PLAYWRIGHT_HEADLESS=true
      - BASE_URL=http://frontend:3000
    volumes:
      - ./frontend/tests:/app/tests
      - ./frontend/playwright.config.ts:/app/playwright.config.ts
      - ./frontend/test-results:/app/test-results
    depends_on:
      frontend:
        condition: service_started
    networks:
      - lens-network
    command: npm run test:e2e
    profiles:
      - test

networks:
  lens-network:
    driver: bridge
