services:
  bff:
    build: ../bff
    container_name: bff-service
    ports:
      - "${BFF_PORT:-8082}:8082"
    environment:
      - SERVER_PORT=${BFF_PORT:-8082}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-local}
      # Inbox isn't part of this compose file (teams/inbox has its own) — reach it on the
      # host, where its own docker-compose.yml publishes it. See InboxUserClient's javadoc.
      - INBOX_SERVICE_URL=${INBOX_SERVICE_URL:-http://host.docker.internal:8080}

  gateway:
    build: .
    container_name: gateway-service
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      - SERVER_PORT=${GATEWAY_PORT:-8080}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-local}
      - BFF_SERVICE_URL=${BFF_SERVICE_URL:-http://bff-service:8082}
      - BFF_CONNECT_TIMEOUT_MS=${BFF_CONNECT_TIMEOUT_MS:-2000}
      - BFF_READ_TIMEOUT_MS=${BFF_READ_TIMEOUT_MS:-10000}
    depends_on:
      - bff
