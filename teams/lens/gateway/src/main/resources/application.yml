spring:
  application:
    name: gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  cloud:
    gateway:
      routes:
        # Route to BFF (Backend for Frontend)
        # BFF is responsible for all downstream team communication
        - id: bff
          uri: http://bff-service:8080
          predicates:
            - Path=/api/**
          filters:
            - StripPrefix=1
      
      # Global CORS configuration
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    root: INFO
    com.rnd.gateway: DEBUG
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: DEBUG
