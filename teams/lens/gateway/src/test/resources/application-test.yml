spring:
  application:
    name: gateway
  # Most tests authenticate with spring-security-test's jwt() post-processor,
  # which skips real decoding, so these URLs are never called.
  # SecurityJwtValidationTests overrides them with a real JWKS stub.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://test-issuer/realms/lens
          jwk-set-uri: http://localhost:9998/realms/lens/protocol/openid-connect/certs

app:
  dev-mode: true
  # Tests run with enforcement on; AuthDisabledTests covers the off switch
  auth:
    enabled: true

bff:
  service:
    url: http://localhost:9999
  connect-timeout-ms: 2000
  read-timeout-ms: 10000
  endpoints:
    workspace-recommend: /workspace/recommend
    tasks: /workspace/tasks
    task-selection: /workspace/tasks/selection
    employee-task: /workspace/employee-task

server:
  port: 0

logging:
  level:
    root: WARN
    com.rnd.gateway: DEBUG
