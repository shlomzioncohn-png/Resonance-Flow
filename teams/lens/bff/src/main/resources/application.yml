server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: bff

# Inbox (task data) - see InboxClient and lens/frontend/docs/api-integration-status.md
inbox:
  # false (default) = call the real Inbox. true = in-memory mock tasks, no Inbox needed.
  mock-enabled: ${INBOX_MOCK_ENABLED:false}
  # Inbox runs on Docker - use localhost when BFF runs locally
  service:
    url: ${INBOX_SERVICE_URL:http://localhost:8082}
  # Seeded Inbox user UUID sent as X-Actor-Id instead of the Gateway's mock "emp_001".
  # Local testing only - empty means "send the userId from the Gateway".
  dev-actor-id: ${INBOX_DEV_ACTOR_ID:}
  connect-timeout-ms: ${INBOX_CONNECT_TIMEOUT_MS:2000}
  read-timeout-ms: ${INBOX_READ_TIMEOUT_MS:10000}

# Chain (dependency graph, task history) - see ChainClient. Every call sends X-Tenant-Id.
chain:
  service:
    # Chain runs on Docker (teams/chain, default host port 8081) - use localhost when BFF runs
    # locally. If you moved Chain to another port (its SERVER_PORT), set CHAIN_SERVICE_URL to match.
    # The cluster sets its own URL (helm values), so this default only affects local runs.
    url: ${CHAIN_SERVICE_URL:http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
