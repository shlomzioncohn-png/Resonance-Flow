server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: bff

# Inbox (task data) - see InboxClient and lens/frontend/docs/api-integration-status.md
inbox:
  # true = in-memory mock tasks, no Inbox needed. Set false to call the real Inbox.
  mock-enabled: ${INBOX_MOCK_ENABLED:true}
  # Local Inbox runs on 8083 (8080/8082 are taken by our Gateway/BFF)
  service:
    url: ${INBOX_SERVICE_URL:http://localhost:8083}
  # Seeded Inbox user UUID sent as X-Actor-Id instead of the Gateway's mock "emp_001".
  # Local testing only - empty means "send the userId from the Gateway".
  dev-actor-id: ${INBOX_DEV_ACTOR_ID:}
  connect-timeout-ms: ${INBOX_CONNECT_TIMEOUT_MS:2000}
  read-timeout-ms: ${INBOX_READ_TIMEOUT_MS:10000}

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Inbox service configuration — used by InboxUserClient (admin Users screen).
# Override INBOX_SERVICE_URL to point at a different Inbox without recompiling.
inbox:
  service:
    url: ${INBOX_SERVICE_URL:http://inbox-service:8080}
  connect-timeout-ms: ${INBOX_CONNECT_TIMEOUT_MS:2000}
  read-timeout-ms: ${INBOX_READ_TIMEOUT_MS:10000}
