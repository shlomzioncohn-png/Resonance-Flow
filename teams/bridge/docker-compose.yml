version: '3.8'

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: bridge-redpanda
    command:
      - redpanda
      - start
      - --kafka-addr=internal://0.0.0.0:29092,external://0.0.0.0:9092
      - --advertise-kafka-addr=internal://redpanda:29092,external://localhost:9092
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
      - --smp=1
      - --memory=1G
      - --mode=dev-container
      - --default-log-level=info
    ports:
      - "9092:9092"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    networks:
      - resonance-net

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:latest
    container_name: bridge-redpanda-console
    ports:
      - "8090:8080"
    environment:
      - KAFKA_BROKERS=redpanda:29092
    depends_on:
      - redpanda
    networks:
      - resonance-net

  minio:
    image: minio/minio:latest
    container_name: bridge-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9091:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - resonance-net

  schema-registry:
    # Same image the shared Helm chart runs in-cluster (teams/relay/helm/resonance-flow/values.yaml)
    # - deliberately NOT Redpanda's own built-in registry, whose Protobuf behavior differs from
    # Apicurio's and could pass locally while breaking in the cluster. -mem loses its schemas on
    # every restart - set producer.auto.register.schemas=true locally, or re-register from
    # shared/proto, rather than relying on anything persisting across restarts.
    image: apicurio/apicurio-registry-mem:2.5.11.Final
    container_name: bridge-schema-registry
    environment:
      # Same as the cluster (teams/relay/helm/resonance-flow/values.yaml): ccompat lookups
      # otherwise exact-match schema text, and the Confluent serializer (use.latest.version)
      # looks the schema up by its comment-free rendering - which never matches a registered
      # shared/proto file that has comments, so every Protobuf publish fails with 40403.
      REGISTRY_CCOMPAT_USE_CANONICAL_HASH: "true"
    ports:
      # 8081/8082 are already taken by Inbox/Chain's own registries - see SCHEMA_REGISTRY_URL.
      - "8085:8080"
    networks:
      - resonance-net

networks:
  resonance-net:
    driver: bridge

volumes:
  minio-data:
  redpanda-data: