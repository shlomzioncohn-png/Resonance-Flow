server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health

spring:
  application:
    name: bridge
  sql:
    init:
      # Creates control_plane_state on startup if it doesn't exist yet (schema.sql, IF NOT
      # EXISTS) - a single static table, so a one-line script is enough; no Flyway needed.
      mode: always
      # Tolerates individual statement errors (e.g. table already exists via a races-with-self
      # redeploy) without failing startup; does NOT cover "Postgres unreachable at all" - a
      # genuinely absent/misconfigured DB still fails startup loudly, same as a missing
      # bridge.postgres.* value would. BridgeApplicationTests overrides this to "never" so its
      # full-context load doesn't require a live Postgres at all - see that test's own comment.
      continue-on-error: true
  kafka:
    # Team shared / remote environment (do not use unless agreed):
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    # Read directly by RawObjectEventKafkaConfig (raw/config/) for its dedicated Protobuf
    # producer - this block's producer.* below stays JSON and keeps serving GitHub/CRM/JIRA/
    # Media via the shared kafkaTemplate bean, per teams/relay/docs/kafka-producer-consumer-guide.md.
    properties:
      # Port 8085, not 8081/8082 - those are already taken by Inbox's and Chain's own local
      # registries. Apicurio, not Redpanda's built-in one - see .env.example for why.
      schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8085/apis/ccompat/v6}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        spring.json.add.type.headers: false
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.rnd.bridge
        spring.json.value.default.type: com.rnd.bridge.task.BridgeTaskEventDto

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:bridge-raw}

github:
  api:
    base-url: ${GITHUB_API_BASE_URL:https://api.github.com}
    token: ${GITHUB_TOKEN:}
  target:
    owner: ${GITHUB_TARGET_OWNER:KamaTechOrg}
    repo: ${GITHUB_TARGET_REPO:Resonance-Flow}
  # Page size for the issues/pulls list endpoints (GitHub max: 100)
  page-size: ${GITHUB_PAGE_SIZE:100}
  sync:
    # Set to true to enable the automatic nightly GitHub to Kafka sync
    cron:
      enabled: ${GITHUB_SYNC_CRON_ENABLED:false}
      expression: ${GITHUB_SYNC_CRON_EXPRESSION:0 0 2 * * ?}

jira:
  api:
    base-url: ${JIRA_API_BASE_URL:https://example.atlassian.net}
    token: ${JIRA_TOKEN:}
  target:
    project: ${JIRA_TARGET_PROJECT:}
  # Page size for /rest/api/2/search (startAt/maxResults pagination)
  page-size: ${JIRA_PAGE_SIZE:100}
  sync:
    # Set to true to enable the automatic nightly Jira to Kafka sync
    cron:
      enabled: ${JIRA_SYNC_CRON_ENABLED:false}
      expression: ${JIRA_SYNC_CRON_EXPRESSION:0 0 2 * * ?}

bridge:
  # The one tenant every RawObjectEvent lane sends (Email/Slack/WhatsApp/Calendar/Drive and the
  # media lane). Must be a UUID of a tenant that exists in Inbox - Mind passes it through to Inbox's
  # tasks.tenant_id. Inbox's only tenant today is System (...0001); a fixed demo UUID is still TBD.
  tenant-id: ${BRIDGE_TENANT_ID:00000000-0000-0000-0000-000000000001}
  # Backs the control-plane lane (GroupStateStore/CursorStore/CalendarEventStateStore), not
  # the rest of Bridge - no default on any of these three, same convention as HUBSPOT_TOKEN: a
  # missing value must fail startup loudly, not silently fall back to a placeholder.
  postgres:
    url: ${BRIDGE_DB_URL}
    user: ${BRIDGE_DB_USER}
    password: ${BRIDGE_DB_PASSWORD}
  # Shared by every structured lane that publishes a Task via
  # KafkaPayloadPublisher (see esti/inbox-kafka-ingestion-contract) - one
  # topic for every source, never a per-lane one.
  structured-tasks-topic: ${BRIDGE_STRUCTURED_TASKS_TOPIC:bridge.structured.tasks}
  manual-sync:
    enabled: false
  # Deployment-wide tenant for lanes whose sources carry no tenant (GitHub, Jira).
  # Inbox's tasks.tenant_id is NOT NULL; same env var as crm.organization-id per
  # Daniel's guidance - one CRM_ORGANIZATION_ID value serves every lane. Blank means
  # "not configured": mappers fall back to null (the documented contract gap for
  # local runs through LoggingPayloadPublisher).
  organization-id: ${CRM_ORGANIZATION_ID:}
  crm:
    dataset: classpath:crm/synthetic-deals.json
    # Inbox's tasks.tenant_id is NOT NULL, but HubSpot (and this
    # lane's Deal model) has no concept of it - see DealToTaskMapper's class
    # Javadoc. Set CRM_ORGANIZATION_ID for a real org; falls back to a
    # local placeholder for development so the app can start without it.
    # This key deliberately still says "organization-id", not "tenant-id" -
    # see teams/bridge/CLAUDE.md §6 (tracked alongside the Task.organizationId
    # decision, same reasoning: renaming a config key is an operational risk
    # across every deployed environment, not a wire-format concern).
    # Must stay in sync with CrmTaskValidator.LOCAL_PLACEHOLDER_TENANT_ID: a canonically-shaped
    # but obviously-fake UUID, not a free-text placeholder - CrmTaskValidator requires every
    # Task.organizationId to be UUID-shaped unconditionally (CRM-lane audit finding F5), including
    # for a no-profile local/demo run through LoggingPayloadPublisher, so the default itself has to
    # pass that check. CrmLaneConfig's kafka-profile startup check still rejects this exact value
    # by name (not just by shape), so forgetting to override it for a real deployment is caught.
    organization-id: ${CRM_ORGANIZATION_ID:00000000-0000-0000-0000-000000000000}
    # Days an open deal (PROSPECT/QUALIFIED/PROPOSAL/NEGOTIATION) may sit in the same stage before +1 urgency; <= 0 disables it.
    stalled-after-days: ${CRM_STALLED_AFTER_DAYS:14}
    sync:
      # Set to true to enable the automatic daily HubSpot to Kafka sync.
      # Off by default, same convention as github.sync.cron - an operator
      # opts in per environment, not a code change.
      cron:
        enabled: ${CRM_SYNC_CRON_ENABLED:false}
        expression: ${CRM_SYNC_CRON_EXPRESSION:0 0 3 * * ?}
  intake:
    raw-landed-topic: ${BRIDGE_RAW_LANDED_TOPIC:bridge.raw.landed}
    scoping:
      allowed-domains:
        - kamatech.org
      allowed-keywords: [deploy, deadline, meeting, pr, review, task, urgent, project]
    chat:
      session-gap-minutes: 45
      correction-delay-seconds: 60
    # Per-source fixture/real switch - see plan.md. Each source can go "real" independently;
    # "real" beans throw UnsupportedOperationException until their connector is implemented.
    # Shared by every real Google reader (Calendar/Gmail/Drive) - see intake.google.
    # GoogleCredentialsProvider. Personal Gmail account -> OAuth2 user-consent flow, not a
    # service account: client-secrets-path is the OAuth Client ID JSON from Google Cloud
    # Console (Desktop app type), tokens-directory caches the refresh token after the one-time
    # browser consent so later runs don't need a browser.
    google:
      client-secrets-path: ${BRIDGE_GOOGLE_CLIENT_SECRETS_PATH:}
      tokens-directory: ${BRIDGE_GOOGLE_TOKENS_DIR:}
    # tenant-id for every lane below (Email/Drive/Calendar/Slack/WhatsApp) comes from the single
    # bridge.tenant-id setting via BridgeTenantId (com.rnd.bridge.intake.config), injected
    # directly into each Real*SourceReader - there is deliberately no per-lane tenant-id key
    # here anymore, so there is exactly one place to change the tenant.
    email:
      mode: fixture
      sync:
        # Set to true to enable scheduled email sync via IntakeSyncJobs/SyncJobScheduler - off
        # by default, same convention as bridge.crm.sync.cron/github.sync.cron.
        cron:
          enabled: ${BRIDGE_INTAKE_EMAIL_SYNC_CRON_ENABLED:false}
          expression: ${BRIDGE_INTAKE_EMAIL_SYNC_CRON_EXPRESSION:0 */15 * * * ?}
    drive:
      mode: fixture
      sync:
        cron:
          enabled: ${BRIDGE_INTAKE_DRIVE_SYNC_CRON_ENABLED:false}
          expression: ${BRIDGE_INTAKE_DRIVE_SYNC_CRON_EXPRESSION:0 */15 * * * ?}
    calendar:
      mode: fixture
      sync:
        cron:
          enabled: ${BRIDGE_INTAKE_CALENDAR_SYNC_CRON_ENABLED:false}
          expression: ${BRIDGE_INTAKE_CALENDAR_SYNC_CRON_EXPRESSION:0 */15 * * * ?}
      # Only read when mode: real. "primary" means the calendar of whichever Google account
      # completes the OAuth consent.
      calendar-id: ${BRIDGE_CALENDAR_ID:primary}
    slack:
      mode: fixture
      # Only read when mode: real. Bot User OAuth Token (xoxb-...) from a Slack app installed
      # with channels:history/groups:history/files:read scopes - see plan.md.
      bot-token: ${BRIDGE_SLACK_BOT_TOKEN:}
      # Channel IDs (Cxxxxxxxx) the bot has been invited to - no config here means "read every
      # channel", Slack has no such mode without a much broader scope.
      channels: ${BRIDGE_SLACK_CHANNELS:}
      # Slack app's Signing Secret (Basic Information page) - verifies X-Slack-Signature on
      # inbound Events API requests. Only used by SlackEventsController, not by polling.
      signing-secret: ${BRIDGE_SLACK_SIGNING_SECRET:}
    whatsapp:
      mode: fixture
      # Only read when mode: real. See plan.md - there's no export API, so this directory is
      # filled manually from WhatsApp's own "Export Chat" feature.
      import-dir: ${BRIDGE_WHATSAPP_IMPORT_DIR:}
      # Local time zone the exporting phone was set to - WhatsApp export timestamps carry no
      # offset, so this must match the tenant, not be assumed to be UTC.
      zone-id: ${BRIDGE_WHATSAPP_ZONE_ID:Asia/Jerusalem}
  # Shared AI infrastructure (com.rnd.bridge.ai, see its README.md) - every model call in Bridge
  # goes through here. Providers hold each key once; models is the one list everyone picks
  # from; usages optionally override the default per use. Startup fails on anything that points
  # nowhere.
  ai:
    # true: Bridge refuses to start if any model below isn't marked free: true, so nothing can
    # ever be billed. The real guarantee is a provider key with no billing attached.
    free-only: true
    default-model: gemini-flash
    providers:
      gemini:
        base-url: ${BRIDGE_AI_GEMINI_BASE_URL:${BRIDGE_MEDIA_CLASSIFIER_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}}
        # Falls back to the old media-classifier variable, so an existing .env keeps working.
        api-key: ${BRIDGE_AI_GEMINI_API_KEY:${BRIDGE_MEDIA_CLASSIFIER_API_KEY:}}
        # With thinking off (reasoning-effort below) a call takes seconds; 30s still leaves room
        # for image requests and a loaded free tier, while bounding a hung call (x3 attempts).
        timeout: 30s
    models:
      gemini-flash:
        provider: gemini
        name: ${BRIDGE_AI_GEMINI_MODEL:${BRIDGE_MEDIA_CLASSIFIER_MODEL:gemini-3.6-flash}}
        images: true
        # Free tier only (a Google AI Studio key in a project with no billing).
        free: true
        # Thinking off: a short classification gains nothing from it, and with it on one call
        # measured 145s locally (Mind measured 101s on vs ~1.4s off). Each call then costs one
        # free-tier request in seconds, not minutes.
        reasoning-effort: none
        # Reply cap (max_tokens). The JSON a classification needs is ~100 tokens; a reply cut
        # off here fails loudly ("cut off at max_tokens"), it is never parsed half-done.
        max-output-tokens: 1024
    defaults:
      redact-pii: true
      # Per usage per UTC day. Gemini's free tier allows 20 requests/day per model per project
      # (measured 2026-10-20 - Google changes it, check https://ai.dev/rate-limit), shared by
      # every usage on that model, so the usages' limits below must add up to at most that.
      # Without this, one busy usage would spend the day's quota for all the others.
      daily-call-limit: 10
    usages:
      media-meeting:
        model: gemini-flash
        daily-call-limit: 10
      media-document:
        model: gemini-flash
        daily-call-limit: 10
        # Documents are sent as images - regex redaction has nothing to act on.
        redact-pii: false
    monitoring:
      # MODEL_CALL_SLOW / MODEL_CALL_EXPENSIVE thresholds (Mind uses 10s; an image request to
      # the free tier can take longer, so 15s).
      llm-max-duration: 15s
      llm-max-cost-usd: 0.02
  media:
    # Meeting/doc/audio hand-off (Esther) - local folders to read test files from, one per
    # source, not committed; set your own in .env. Shares minio.* and
    # bridge.intake.raw-landed-topic above with the Unstructured-intake lane.
    zoom-recordings-dir: ${BRIDGE_MEDIA_ZOOM_RECORDINGS_DIR:./temp/zoom}
    bbb-recordings-dir: ${BRIDGE_MEDIA_BBB_RECORDINGS_DIR:./temp/bbb}
    scanned-docs-dir: ${BRIDGE_MEDIA_SCANNED_DOCS_DIR:./temp/docs}
    tenant-id: ${bridge.tenant-id}
    # Files at or below this size never land - a conservative proxy for "empty/corrupt
    # recording", not real audio-duration filtering (that needs a codec-aware library this
    # lane doesn't depend on). Tune based on what garbage actually shows up in practice.
    min-file-size-bytes: ${BRIDGE_MEDIA_MIN_FILE_SIZE_BYTES:1024}
    # Automatic folder polling (MediaSyncJob, run by SyncJobScheduler like every other polled
    # source) - same run as POST /api/bridge/media/run. Off by default, same convention as
    # bridge.intake.*.sync.cron.
    sync:
      cron:
        enabled: ${BRIDGE_MEDIA_SYNC_CRON_ENABLED:false}
        expression: ${BRIDGE_MEDIA_SYNC_CRON_EXPRESSION:0 */5 * * * ?}
    # Sets each item's scope_decision + classification (see media.classification). Off by
    # default: every item goes out INCLUDED and unclassified, as before. On with no api-key:
    # deterministic rules only (too-short meeting, single participant, blank page).
    classification:
      enabled: ${BRIDGE_MEDIA_CLASSIFICATION_ENABLED:false}
      # EXCLUDED only when the category is listed below AND its confidence reaches this;
      # anything less confident is still attached, but stays INCLUDED.
      min-confidence-to-exclude: ${BRIDGE_MEDIA_CLASSIFICATION_MIN_CONFIDENCE:0.6}
      min-meeting-duration: ${BRIDGE_MEDIA_CLASSIFICATION_MIN_MEETING_DURATION:30s}
      transcript-excerpt-chars: 4000
      excluded-meeting-categories: TEST,SOCIAL
      excluded-document-categories: BLANK,ADVERTISEMENT
      documents:
        # Pages are rendered one at a time; the scan stops once pages-to-send non-blank pages
        # are found, or after max-pages-to-scan pages. BLANK is only decided when every page
        # was checked. Formats: whatever a PagedDocumentReader supports (images + PDF).
        max-pages-to-scan: 5
        pages-to-send: 2
        # Hostile-file guards, checked before any parsing/rendering: a larger file is never
        # opened; a page bigger than this (width x height once rendered, read from its header)
        # is never rendered - a decompression bomb would otherwise exhaust the heap. 25 MP is
        # far above any real scan (A4 at 300 DPI is ~8.7 MP).
        max-file-size-bytes: 26214400
        max-page-pixels: 25000000
      # Bump on every prompt change in ModelMediaClassifier, so results stay comparable.
      # v3: the text sent to the model is PII-redacted (bridge.ai), so the input changed.
      # v4: content-is-data rule against prompt injection; transcript fenced in <transcript>.
      # v5: Hebrew/English transcripts, concrete TEST cues, opening-minutes caution, a high bar
      # for TEST/SOCIAL confidence (they are excluded), category kept separate from quality.
      # v6: document categories defined one per line, Hebrew scans, a high bar for ADVERTISEMENT,
      # scan-specific quality and sensitivity examples.
      prompt-version: v6
      # Which model, which key, fallback and limits: bridge.ai.usages.media-meeting /
      # media-document below (the shared AI infrastructure), not here.
    zoom:
      # Not consumed by MediaIntakeOrchestrator yet - see ZoomCloudRecordingClient's javadoc
      # for why (no meetingId source). "real" bean is a throw-stub like bridge.intake.*.mode's -
      # see RealZoomCloudRecordingClient's javadoc for what implementing it actually needs
      # (Server-to-Server OAuth app credentials, added here once that work starts).
      mode: fixture

llm:
  enrichment:
    # Master switch for the rule-based task enrichment engine.
    enabled: ${LLM_ENRICHMENT_ENABLED:false}
    # Only these source types are enriched; all others are skipped entirely.
    supported-sources: ${LLM_ENRICHMENT_SUPPORTED_SOURCES:GITHUB_ISSUE,JIRA_ISSUE}
    # Keyword -> urgency level (1..5). Overrides the built-in defaults when set.
    urgency-keywords:
      blocker: 5
      critical: 5
      asap: 5
      urgent: 5
      "production down": 5
      "high priority": 4
      important: 4
      "needed soon": 4
      medium: 3
      todo: 3
      needed: 3
      low: 1
      whenever: 1
      "nice to have": 1
  consumer:
    # Separate switch for the automatic Kafka enrichment channel.
    enabled: ${LLM_CONSUMER_ENABLED:false}
    input-topic: ${LLM_CONSUMER_INPUT_TOPIC:bridge.tasks.to-enrich}
    group-id: ${LLM_CONSUMER_GROUP_ID:bridge-llm-enricher}
