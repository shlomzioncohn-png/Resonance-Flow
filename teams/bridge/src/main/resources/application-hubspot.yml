bridge:
  crm:
    hubspot:
      # Active alongside "salesforce" now (additive CRM profiles, team lead decision 2026-10-19) -
      # this file's tunables only ever apply to the hubspot source; salesforce's own live entirely
      # in application-salesforce.yml. sourceRef "crm:hubspot:<id>" keeps HubSpot deals distinct
      # from Salesforce's "crm:salesforce:<id>" even if the same raw id exists in both.
      base-url: https://api.hubspot.com
      # Backed by the HUBSPOT_TOKEN environment variable - never given a
      # default here, so a missing token fails startup loudly instead of
      # this repository silently making unauthenticated requests.
      token: ${HUBSPOT_TOKEN}
      # HubSpot caps requests that include propertiesWithHistory at 50
      # objects per page (confirmed live: a limit above 50 returns a 400
      # VALIDATION_ERROR, "You can only request at most 50 objects in one
      # request for properties with history").
      page-size: 50
      max-retries: 5
      initial-backoff-millis: 500
      max-backoff-millis: 8000
      # A server that accepts the connection and then never responds gives
      # the retry logic above nothing to react to - no status code, no
      # exception - unless the request itself gives up first. connect-timeout
      # bounds how long establishing the TCP connection can take; read-timeout
      # bounds how long we wait for a response once sent. Both are generous
      # (a v3 objects/deals page can be slow on a large portal) but finite.
      connect-timeout-millis: 5000
      read-timeout-millis: 15000
      # Open-stage probability (0-1) -> DealStage bands - Bridge's own policy, not a HubSpot
      # convention. Deliberately NOT Salesforce's 20/50/80/99 (application-salesforce.yml):
      # HubSpot's own default pipeline's "Decision Maker Bought-In" stage sits at probability 0.8,
      # which needs to land in NEGOTIATION (matching today's label-based mapping) rather than
      # PROPOSAL, so proposal-max is 70 here, not 80. Each -max is the inclusive top of its band
      # (after converting probability to a 0-99 percent); validated at startup to be strictly
      # increasing and to partition 0-99 with no gap, no overlap (HubSpotStageMapping's
      # constructor, via the shared StageProbabilityBands) - a misconfiguration fails loudly
      # instead of silently misclassifying every open deal.
      stage-bands:
        prospect-max: 20
        qualified-max: 50
        proposal-max: 70
        negotiation-max: 99
      # If the fraction of deals skipped while reading (skippedAtRead / deals actually read) in one
      # snapshot() call exceeds this ratio, the whole sync fails instead of publishing a partial
      # snapshot - see HubSpotDealRepository's class Javadoc. Must be > 0 and <= 1; validated at
      # startup. HubSpot-only for now (Salesforce could get the same guard later).
      max-skipped-ratio: 0.5
