syntax = "proto3";

package com.rnd.bridge.shared.unstructured.dto;

option java_package = "com.rnd.bridge.shared.unstructured.dto";
option java_multiple_files = true;

import "google/protobuf/timestamp.proto";

// kafkaTopic: bridge.raw.landed
// Reconciled against the agreed Bridge/MIND RawObjectEvent contract
// (teams/bridge/src/main/java/com/rnd/bridge/raw/model/RawObjectEvent.java). Fields 1-13 and
// every existing enum value/number are unchanged from the original draft - only additive
// changes (new fields 14-19, new enum values appended at new numbers) were made, so this
// schema stays FULL-compatible with whatever was previously registered under
// bridge.raw.landed-value.

message RawObjectEvent {
  string schema_version = 1;
  string object_key = 2;
  SourceType source_type = 3;
  string tenant_id = 4;
  google.protobuf.Timestamp ingested_at = 5;
  ScopeDecision scope_decision = 6;
  string content_hash = 7;
  optional Modality modality = 8;
  repeated string participants = 9;
  string content_type = 10;
  optional int64 size_bytes = 11;
  optional string transcript_object_key = 12; // Populated later, once transcription completes.
  google.protobuf.Timestamp source_timestamp = 13;
  string correlation_id = 14;
  int32 attachment_index = 15;
  int32 attachment_count = 16;
  int32 revision = 17;
  ChangeType change_type = 18;
  int32 change_significance_score = 19;
}

enum SourceType {
  SOURCE_TYPE_UNSPECIFIED = 0;
  EMAIL = 1;
  SLACK = 2;
  WHATSAPP = 3;
  DRIVE = 4;
  CALENDAR = 5;
  MEETING = 6;
  SOURCE_TYPE_SCANNED_DOC = 7; // prefixed - plain SCANNED_DOC collides with Modality.SCANNED_DOC
                               // (proto3 enum values are siblings of the package, not their enum)
  DOC = 8;
}

enum ScopeDecision {
  SCOPE_DECISION_UNSPECIFIED = 0;
  INCLUDED = 1;
  EXCLUDED = 2;
}

enum Modality {
  MODALITY_UNSPECIFIED = 0;
  AUDIO = 1;
  SCANNED_DOC = 2;
  TEXT = 3;
}

enum ChangeType {
  CHANGE_TYPE_UNSPECIFIED = 0;
  UPSERT = 1;
  DELETE_REVIEW = 2;
}
