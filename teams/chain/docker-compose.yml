services:
  chain:
    build: .
    container_name: chain-service
    ports:
      - "${SERVER_PORT:-8081}:8081"
    environment:
      - SERVER_PORT=${SERVER_PORT:-8081}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-local}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-localhost:9092}
      # No local Apicurio/schema-registry container here yet - task.created/task.updated/
      # task.dependencies.proposed consumption will fail without one reachable at this URL.
      - SCHEMA_REGISTRY_URL=${SCHEMA_REGISTRY_URL:-http://localhost:8082/apis/ccompat/v6}
