syntax = "proto3";

package com.rnd.inbox.event;

option java_package = "com.rnd.inbox.event";
option java_multiple_files = true;

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

// kafkaTopic: task.created
// DRAFT for review - closes out issue #225 (Relay<->Inbox task.created contract, part of
// RELAY<->INBOX integration issue #100). Reviewed by Inbox directly against their real code
// (inbox-team branch: Task entity, TaskCreatedPayload, shared/database/migrations) - this
// version reflects that review, not just their earlier prose answer.
//
// id/title/description keep the exact field numbers, names and (for description) the
// non-optional declaration already registered for task.created-value - the schema-registry FULL
// compatibility check (teams/relay/ci/check-all-schemas.sh) compares against that registered
// version, and protobuf compatibility is governed by field number/type, not by field name or
// text order, so anything already registered must stay put. Every other field is new (never
// registered), so free to name/type/renumber as needed.
//
// tenant_id (was organization_id in the first draft): CONFIRMED FINAL by Inbox - the rename is
// merged on their side (PR #255, commit 9684b8e, V7__rename_organization_to_tenant.sql -
// organizations -> tenants, organization_id -> tenant_id on every table). Note this migration
// lives on inbox-team, not main (main doesn't have shared/ at all yet) - don't be surprised if
// it's not visible there.
//
// project_id: optional - confirmed nullable in migration (tasks.project_id has no NOT NULL) and
// in Task.java (`@JoinColumn(name = "project_id", nullable = true)`).
//
// created_by: optional - confirmed nullable in Task.java (`@JoinColumn(name = "created_by",
// nullable = true)`) and TaskCreatedPayload.from() explicitly null-checks it.
//
// effort_estimate_minutes: int32, not double - Task.java has this as `Integer`, DB column is
// INTEGER.
//
// confidence / effort_estimate_confidence: float, not double - Task.java has both as `Float`,
// DB columns are REAL.
//
// role_context: now a proper enum (TaskRoleContext), not a free string - V1 migration defines
// task_role_context as a Postgres enum type, and Task.java uses the TaskRoleContext Java enum.
// The original draft's `optional string role_context` was wrong.
//
// metadata (field 20): added because TaskCreatedPayload now has 20 fields, not 19 -
// shared/database/migrations/V6__add_tasks_metadata.sql added tasks.metadata (JSONB, nullable),
// already merged. Uses google.protobuf.Struct (arbitrary JSON-shaped data), not
// map<string,string>, since the column is free-form JSONB, not flat key/value strings.
//
// Enum value lists (SourceType, TaskTier, TaskStatus, ExtractionProvenance, TaskRoleContext) are
// now filled in for real, not left at UNSPECIFIED-only as in the previous revision (per Ayala's
// review comment on that revision: add values only once confirmed, since removing a wrong guess
// after registration breaks FULL compatibility, but adding is always safe). Inbox confirmed these
// are frozen Postgres enum types from the already-applied V1 migration
// (shared/database/migrations/V1__init_schema.sql), matched 1:1 against Inbox's own Java enum
// classes under teams/inbox/src/main/java/com/rnd/inbox/model/enums/ - not guesses.
//
// SourceType.DRIVE: reversed from the previous revision's resolution. That revision treated it as
// an unused leftover from an unrelated ML-fields PR (#219) and said Inbox would remove it. Since
// then, MIND confirmed directly that they do send sourceType=DRIVE for real (source: Google
// Drive), so there's now an actual producer for it, not just a stray enum value. Added as
// SOURCE_TYPE_DRIVE = 12 - a pure addition, safe under FULL compatibility (nothing already
// registered changes). Inbox owns the matching Postgres enum migration on their side
// (shared/database/migrations) - not part of this schema change.
//
// Of TaskCreatedPayload's fields, suggested_owner_user_id and suggested_owner_confidence are
// intentionally NOT included here - Inbox confirmed those are filled in later by MIND via
// task.updated, not present at creation time (and stay permanently empty for tasks from
// structured sources like GitHub that already have a definite assignee).
//
// correlation_id is intentionally NOT a field here - CONFIRMED FINAL by Inbox: stays a Kafka
// header (alongside event_id/event_type/timestamp/source_service), same as today. Their outbox
// table already keeps correlation_id as its own column, separate from the JSONB payload
// (shared/database/migrations/V3__add_outbox_table.sql), consistent with this. Also a standing
// rule on Inbox's side: correlation_id is a technical tracing field, not a business attribute,
// and is never exposed as a product field - headers are Kafka-level, not schema-level, so this is
// unaffected by the move to Protobuf.

message TaskCreatedEvent {
  string id = 1;                                   // UUID as string. Kept as "id" (not renamed to task_id) - already registered under this name/number.
  string title = 2;
  string description = 3;                          // Kept non-optional, matching what's already registered.
  string tenant_id = 4;                             // UUID as string. Confirmed final name - see note above.
  optional string project_id = 5;                   // UUID as string. Nullable - confirmed (migration + entity).
  SourceType source_type = 6;
  string source_ref = 7;
  bool is_available = 8;                            // Chain-computed, materialized here per root CLAUDE.md - not computed by Inbox.
  optional TaskTier tier = 9;                        // Nullable until MIND classification (confirmed).
  optional TaskRoleContext role_context = 10;        // Nullable until MIND classification (confirmed). Enum, not string - see note above.
  optional int32 urgency = 11;                       // 1..5 per DB check constraint (confirmed by Inbox).
  optional int32 effort_estimate_minutes = 12;       // int32, not double - see note above.
  optional google.protobuf.Timestamp deadline = 13;
  TaskStatus status = 14;
  ExtractionProvenance extraction_provenance = 15;
  // Nullable in general, but required (non-null) when extraction_provenance =
  // EXTRACTION_PROVENANCE_ML_INFERRED - a real DB constraint per Inbox, enforced in application
  // code by Inbox and any consumer that cares, not at the schema level (confirmed, no conditional
  // constraint in the .proto itself).
  optional float confidence = 16;                    // float, not double - see note above.
  optional float effort_estimate_confidence = 17;    // float, not double - see note above.
  optional string created_by = 18;                   // UUID as string. Nullable - see note above.
  google.protobuf.Timestamp created_at = 19;
  optional google.protobuf.Struct metadata = 20;     // Free-form JSONB - see note above.
  optional string owner_id = 21;                     // UUID as string.
}

enum SourceType {
  SOURCE_TYPE_UNSPECIFIED = 0;
  SOURCE_TYPE_GITHUB_ISSUE = 1;
  SOURCE_TYPE_GITHUB_PR = 2;
  SOURCE_TYPE_CRM_DEAL = 3;
  SOURCE_TYPE_EMAIL = 4;
  SOURCE_TYPE_SLACK = 5;
  SOURCE_TYPE_WHATSAPP = 6;
  SOURCE_TYPE_MEETING = 7;
  SOURCE_TYPE_DOC = 8;
  SOURCE_TYPE_SCANNED_DOC = 9;
  SOURCE_TYPE_CALENDAR = 10;
  SOURCE_TYPE_MANUAL = 11;
  SOURCE_TYPE_DRIVE = 12;
}

enum TaskTier {
  TASK_TIER_UNSPECIFIED = 0;
  TASK_TIER_OPERATIONAL = 1;
  TASK_TIER_TACTICAL = 2;
  TASK_TIER_STRATEGIC = 3;
}

enum TaskRoleContext {
  TASK_ROLE_CONTEXT_UNSPECIFIED = 0;
  TASK_ROLE_CONTEXT_DEVELOPER = 1;
  TASK_ROLE_CONTEXT_MANAGER = 2;
  TASK_ROLE_CONTEXT_HIGHER_MANAGER = 3;
  TASK_ROLE_CONTEXT_FIELD_ENGINEER = 4;
  TASK_ROLE_CONTEXT_SALESPERSON = 5;
  TASK_ROLE_CONTEXT_CEO = 6;
}

enum TaskStatus {
  TASK_STATUS_UNSPECIFIED = 0;
  TASK_STATUS_NEW = 1;
  TASK_STATUS_IN_REVIEW = 2;
  TASK_STATUS_APPROVED = 3;
  TASK_STATUS_IN_PROGRESS = 4;
  TASK_STATUS_SNOOZED = 5;
  TASK_STATUS_DONE = 6;
  TASK_STATUS_REJECTED = 7;
  TASK_STATUS_CANCELLED = 8;
}

enum ExtractionProvenance {
  EXTRACTION_PROVENANCE_UNSPECIFIED = 0;
  EXTRACTION_PROVENANCE_ETL = 1;
  EXTRACTION_PROVENANCE_ML_INFERRED = 2;
  EXTRACTION_PROVENANCE_MANUAL = 3;
}
