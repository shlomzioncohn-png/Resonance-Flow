syntax = "proto3";

package com.rnd.mind.event;

option java_package = "com.rnd.mind.event";
option java_multiple_files = true;

// kafkaTopic: task.dependencies.proposed
//
// WORKING DRAFT, not an officially registered schema - no .proto file for this topic exists yet
// anywhere in teams/relay/src/main/proto (Relay's registered source of truth) or
// teams/relay/ci/schema-subjects.tsv. Confirmed as Protobuf (not JSON) directly by the team lead,
// consistent with the org-wide Kafka wire-format decision and with Mind's own confirmation (in
// the cross-team "final-signing-of-contracts" thread) that they are moving off Pydantic/JSON to
// Protobuf for their published events.
//
// Shape confirmed directly from Mind's real draft (relayed by Relay/Avigail) - supersedes an
// earlier, incorrect guess this file made (a flat repeated string), based on prose in
// Gong_Technical_Spec_EN_with_Flows.md that turned out not to match what Mind actually sends.
// Mind's draft (JSON, for reference - wire format is still Protobuf per above):
//   { "task_id": "uuid", "dependencies": [ { "depends_on_task_id": "uuid", "confidence": 0.0 } ] }
// event_id is NOT present in Mind's draft, contradicting the team lead's earlier statement that
// Mind events carry one - actively being worked (getting Mind to add it), not yet resolved as of
// this writing. Kept as a field here since the claim-based idempotency in
// DependencyProposedEventHandler still depends on it; if it turns out not to materialize, that
// handler needs a different idempotency strategy (see its own Javadoc for a fallback: addDependency
// is already naturally idempotent per-edge, independent of any event_id).
//
// confidence is received but has no effect on Chain's side (confirmed) - not a threshold, not
// stored, not a gating state. Every entry in `dependencies` is applied unconditionally.
//
// Follow-up, tracked outside #271: get this reviewed and registered by Relay in
// teams/relay/ci/schema-subjects.tsv once their process can take it - this file should then be
// replaced with whatever they formally register, not kept as the source of truth long-term.
message DependencyProposedEvent {
  string event_id = 1;                  // UUID as string - see the event_id note above: not yet
                                         // confirmed to actually be sent.
  string task_id = 2;                   // UUID as string - the task the dependencies are on.
  repeated Dependency dependencies = 3;  // the tasks task_id depends on, plus Mind's confidence
                                         // for each - sent as the full, final set per delivery.
}

message Dependency {
  string depends_on_task_id = 1;  // UUID as string.
  float confidence = 2;           // received, ignored - see class-level note above.
}
