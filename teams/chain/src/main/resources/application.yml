server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health

spring:
  application:
    name: chain
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  # Placeholder in-memory DB so a DataSource/PlatformTransactionManager exists
  # and @Transactional in TaskEligibilityService isn't left without a manager.
  # No JPA entities use this yet - real data still lives in the in-memory
  # TaskRepository/TaskDependencyRepository. Replace with the real DB config
  # once the team lead's decision lands - see teams/chain/CLAUDE.md.
  datasource:
    url: jdbc:h2:mem:chain;DB_CLOSE_DELAY=-1

chain:
  kafka:
    topics:
      task.scheduling.updated: ${CHAIN_SCHEDULING_UPDATED_TOPIC:task.scheduling.updated}
      task-created: ${TASK_CREATED_TOPIC:task.created}
      task-updated: ${TASK_UPDATED_TOPIC:task.updated}
      dependencies-proposed: ${DEPENDENCIES_PROPOSED_TOPIC:task.dependencies.proposed}
    # One shared group for the whole service, matching Inbox's "inbox-service"
    # convention - set explicitly rather than left to ${spring.application.name}
    # ("chain"), which TaskCreatedEventHandler/TaskUpdatedEventHandler/
    # DependencyProposedEventHandler's @KafkaListener groupId also reference directly.
    consumer-group-id: ${KAFKA_CONSUMER_GROUP_ID:chain-service}
    # Schema Registry (Apicurio, ccompat API) - needed because task.created/task.updated/
    # task.dependencies.proposed are all Protobuf, validated against it.
    schema-registry-url: ${SCHEMA_REGISTRY_URL:http://localhost:8081/apis/ccompat/v6}
    retry:
      # Explicit on purpose, matching ChainKafkaErrorHandlingConfig's
      # previously-hardcoded FixedBackOff(2000L, 2L) exactly - values here
      # can be tuned per environment without a code change.
      max-attempts: 2
      interval-ms: 2000
  events:
    # Explicit on purpose, even though "in-memory" is also the default:
    # InMemoryProcessedEventStore only activates for this exact value, so
    # an environment that meant to run a persistent store but forgot to
    # set this fails fast instead of silently falling back to it.
    processed-store: in-memory
