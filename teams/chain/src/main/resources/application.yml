server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health

spring:
  application:
    name: chain
  # Placeholder in-memory DB so a DataSource/PlatformTransactionManager exists
  # and @Transactional in TaskEligibilityService isn't left without a manager.
  # No JPA entities use this yet - real data still lives in the in-memory
  # TaskRepository/TaskDependencyRepository. Replace with the real DB config
  # once that migration actually happens (decision already resolved - see teams/chain/CLAUDE.md and PLAN.md's Phase 3).
  datasource:
    url: jdbc:h2:mem:chain;DB_CLOSE_DELAY=-1
