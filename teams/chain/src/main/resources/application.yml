server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health

spring:
  application:
    name: chain
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  # Real Postgres datasource (issue #378) - a dedicated Chain database/user, not Inbox's
  # resonance_flow. Defaults below are placeholders pending DevOps actually provisioning the
  # DB/user (see teams/chain/CLAUDE.md) - Task/TaskDependency still live in the in-memory
  # TaskRepository/TaskDependencyRepository until #377 lands, so only the Constraint migration/
  # repository actually uses this connection today.
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:chain}
    username: ${DB_USER:chain_user}
    password: ${DB_PASSWORD:chain_password}

chain:
  kafka:
    topics:
      task.scheduling.updated: task.scheduling.updated
    # Left unset on purpose: ChainEventConsumer stays disabled
    # (@ConditionalOnProperty) until the first approved cross-team
    # contract exists and a real topic is configured here.
    # consumed-topics: <topic-name>
    consumer-group-id: ${spring.application.name}
    retry:
      # Explicit on purpose, matching ChainKafkaErrorHandlingConfig's
      # previously-hardcoded FixedBackOff(2000L, 2L) exactly - values here
      # can be tuned per environment without a code change.
      max-attempts: 2
      interval-ms: 2000
  events:
    # Explicit on purpose, even though "in-memory" is also the default:
    # InMemoryProcessedEventStore only activates for this exact value, so
    # an environment that meant to run a persistent store but forgot to
    # set this fails fast instead of silently falling back to it.
    processed-store: in-memory
