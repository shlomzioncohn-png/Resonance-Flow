server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health

spring:
  application:
    name: chain
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  datasource:
    # Own database + own DB user (not the shared postgres superuser or Inbox's resonance_flow
    # database) - matches PR #417's Helm wiring. No currentSchema: chain owns this whole
    # database, so its tables live in the database's own default (public) schema.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:chain}?stringtype=unspecified
    username: ${DB_USER:chain}
    password: ${DB_PASSWORD:chain}
  jpa:
    hibernate:
      ddl-auto: validate

chain:
  kafka:
    topics:
      scheduling-updated: ${CHAIN_SCHEDULING_UPDATED_TOPIC:task.scheduling.updated}
      task-updated: ${TASK_UPDATED_TOPIC:task.updated}
      task-completed: ${TASK_COMPLETED_TOPIC:task.completed}
      dependencies-proposed: ${DEPENDENCIES_PROPOSED_TOPIC:task.dependencies.proposed}
    # One shared group for the whole service, matching Inbox's "inbox-service"
    # convention - set explicitly rather than left to ${spring.application.name}
    # ("chain"), which TaskUpdatedEventHandler/
    # DependencyProposedEventHandler's @KafkaListener groupId also reference directly.
    consumer-group-id: ${KAFKA_CONSUMER_GROUP_ID:chain-service}
    # Schema Registry (Apicurio, ccompat API) - needed because task.updated/
    # task.dependencies.proposed are all Protobuf, validated against it.
    schema-registry-url: ${SCHEMA_REGISTRY_URL:http://localhost:8082/apis/ccompat/v6}
    # chain.kafka.retry.* (the old blocking FixedBackOff policy) was removed along with
    # ChainKafkaErrorHandlingConfig/ChainKafkaRetryProperties - retry/backoff for each handler is
    # now configured directly on its own @RetryableTopic annotation instead of one shared policy.
