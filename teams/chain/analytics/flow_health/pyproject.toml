[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flow-health"
version = "0.1.0"
description = "Dependency-flow health analysis for Chain: synthetic history generator (and, later, the anomaly model)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []  # the generator is stdlib-only on purpose; analysis code needs the `analysis` extra

[project.optional-dependencies]
dev = ["pytest>=8"]
publish = ["psycopg[binary]>=3.2"]  # only `python -m flow_health.publish` talks to a database
analysis = ["pandas>=2.2", "scikit-learn>=1.5", "pyyaml>=6"]  # features, clustering and detectors; the generator stays stdlib-only

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flow_health = ["features/feature_spec.md", "detectors/config.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
