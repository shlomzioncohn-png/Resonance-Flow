[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chain-health"
version = "0.1.0"
description = "Dependency-flow health analysis for Chain: synthetic history generator (and, later, the anomaly model)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []  # the generator is stdlib-only on purpose

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
