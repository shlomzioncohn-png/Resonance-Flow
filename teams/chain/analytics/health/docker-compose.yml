# Throwaway Postgres for the synthetic history: never the shared Chain database.
# Ephemeral on purpose (no volume); `docker compose down` throws the data away.
services:
  health-db:
    image: postgres:16
    container_name: chain-health-db
    environment:
      POSTGRES_DB: chain_health
      POSTGRES_USER: health
      POSTGRES_PASSWORD: health
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U health -d chain_health"]
      interval: 2s
      timeout: 3s
      retries: 20
