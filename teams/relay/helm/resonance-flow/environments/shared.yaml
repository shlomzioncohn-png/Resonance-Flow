ingress:
  # Stays off until the host is known: an enabled Ingress without ingress.host
  # fails the render.
  enabled: false
  # The Traefik controller from teams/relay/argocd/apps/traefik.yaml.
  className: traefik
  # TODO: the public host, e.g. lens.<domain>.
  host: ""
  # TLS (owned by whoever handles the certificate): the Secret holding the cert,
  # plus cert-manager annotations if it issues it.
  tlsSecretName: ""
  annotations: {}
kafka:
  metrics:
    jmx:
      enabled: true
      image:
        registry: docker.io
        repository: bitnamilegacy/jmx-exporter
postgresql:
  metrics:
    enabled: true
minio:
  metrics:
    enabled: true
