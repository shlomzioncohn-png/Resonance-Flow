components:
  mind:
    enabled: true
    kafkaSasl: false
  schema-registry:
    enabled: true
kafka:
  enabled: true
  image:
    tag: 4.0.0-debian-12-r10
  controller:
    persistence:
      enabled: false
  listeners:
    client:
      protocol: PLAINTEXT
    controller:
      protocol: PLAINTEXT
    interbroker:
      protocol: PLAINTEXT
minio:
  enabled: true
# pgvector (official vector.so overlaid on Bitnami's, #490) for the vector-store tests.
postgresql:
  enabled: true
