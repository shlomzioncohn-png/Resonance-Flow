components:
  bridge:
    enabled: true
    config:
      spring:
        config:
          import: "configtree:/etc/resonance-flow/secrets/minio/"
    secretFiles:
      - name: minio-credentials
        secretName: bridge-minio
        mountPath: /etc/resonance-flow/secrets/minio
        items:
          - key: root-user
            path: minio.access-key
          - key: root-password
            path: minio.secret-key
  notification-delivery:
    enabled: false
  mind:
    enabled: false
  lens-bff:
    enabled: false
  lens-frontend:
    enabled: false
  chain:
    enabled: false
  inbox:
    enabled: false
  lens-gateway:
    enabled: false
  schema-registry:
    enabled: false

kafka:
  enabled: true
minio:
  enabled: true
postgresql:
  enabled: false
