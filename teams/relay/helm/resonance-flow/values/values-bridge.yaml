# CI applies an all-components-off overlay first (setup-service-infra), so only
# list what this service needs enabled - everything else is already off.
components:
  bridge:
    enabled: true
    config:
      spring:
        config:
          import: "configtree:/etc/resonance-flow/secrets/minio/"
        volumeMounts:
        - name: minio-credentials
        mountPath: /etc/resonance-flow/secrets/minio
        readOnly: true
    volumes:
      - name: minio-credentials
        secret:
          secretName: bridge-minio
          items:
            - key: root-user
              path: minio.access-key
            - key: root-password
              path: minio.secret-key
kafka:
  enabled: true
minio:
  enabled: true
postgresql:
  enabled: false
