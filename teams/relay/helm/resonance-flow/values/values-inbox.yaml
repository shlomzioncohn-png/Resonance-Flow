components:
  inbox:
    enabled: true
  mind:
    enabled: false
  lens-bff:
    enabled: false
  bridge:
    enabled: false
  lens-frontend:
    enabled: false
  chain:
    enabled: false
  lens-gateway:
    enabled: false

# inbox needs Kafka (event consumers) and Postgres (its own datastore);
# Minio is only used by mind/bridge, so it stays off for an inbox-only install.
kafka:
  enabled: true
minio:
  enabled: false
postgresql:
  enabled: true
