components:
  inbox:
    enabled: true
    replicaCount: 1
    image:
      repository: "ghcr.io/kamatechorg/resonance-flow/inbox"
      pullPolicy: IfNotPresent
      tag: "placeholder"
    containerPort: 8080
    service:
      type: ClusterIP
      port: 80
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    startupProbe:
      httpGet:
        path: /health
        port: http
      periodSeconds: 5
      failureThreshold: 40
    livenessProbe:
      httpGet:
        path: /health
        port: http
      periodSeconds: 10
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /health
        port: http
      periodSeconds: 5
      failureThreshold: 3
    env: {}
    dependencies:
      - name: postgres
        host: postgres.postgres.svc.cluster.local
        port: 5432
    config:
      data:
        datasource:
          host: postgres.postgres.svc.cluster.local
          port: 5432
          database: resonance_flow
          username: postgres
          password: postgres
        kafka:
          bootstrapServers: kafka.kafka.svc.cluster.local:9092
          consumerGroupId: inbox-service
          topics:
            bridgeStructuredTasks: bridge.structured.tasks
            chainSchedulingUpdated: task.scheduling.updated
            mindTaskCreationRequested: task.creation.requested
  mind:
    enabled: false
  lens-bff:
    enabled: false
  bridge:
    enabled: false
  lens-frontend:
    enabled: false
  chain:
    enabled: false
  lens-gateway:
    enabled: false

# inbox needs Kafka (event consumers) and Postgres (its own datastore);
# Minio is only used by mind/bridge, so it stays off for an inbox-only install.
kafka:
  enabled: true
minio:
  enabled: false
postgresql:
  enabled: true
