{{/* kafka-exporter's SASL login, from kafka.sasl.client - see README.md "Metrics scraping". */}}
{{- if (index .Values "kafka-exporter").enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "resonance-flow.fullname" . }}-kafka-exporter-sasl
  labels:
    {{- include "resonance-flow.labels" . | nindent 4 }}
    app.kubernetes.io/component: kafka-exporter
type: Opaque
data:
  username: {{ first .Values.kafka.sasl.client.users | b64enc | quote }}
  password: {{ first .Values.kafka.sasl.client.passwords | b64enc | quote }}
{{- end }}
