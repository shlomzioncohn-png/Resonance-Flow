{{/* kafka-exporter's SASL username, from kafka.sasl.client - see README.md "Metrics scraping".
The password isn't here: kafka-exporter reads it from resonance-flow-kafka-sasl-credentials,
which the kafka-sasl hook creates at install time (values.yaml, kafka-exporter.env). */}}
{{- if (index .Values "kafka-exporter").enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "resonance-flow.fullname" . }}-kafka-exporter-sasl
  labels:
    {{- include "resonance-flow.labels" . | nindent 4 }}
    app.kubernetes.io/component: kafka-exporter
type: Opaque
data:
  username: {{ first .Values.kafka.sasl.client.users | b64enc | quote }}
{{- end }}
