{{- $component := .Values.components.inbox }}
{{- if $component.enabled }}
{{- with $component.config }}
{{- $cfg := .data }}
---
apiVersion: v1
kind: ConfigMap

metadata:
  name: {{ include "resonance-flow.fullname" $ }}-inbox-config
  labels:
    {{- include "resonance-flow.labels" $ | nindent 4 }}
    app.kubernetes.io/component: inbox

data:
  config.yaml: |
    server:
      port: {{ $component.containerPort }}
    spring:
      application:
        name: inbox
      datasource:
        url: "jdbc:postgresql://{{ $cfg.datasource.host }}:{{ $cfg.datasource.port }}/{{ $cfg.datasource.database }}?stringtype=unspecified"
        username: {{ $cfg.datasource.username | quote }}
        password: {{ $cfg.datasource.password | quote }}
      flyway:
        locations: "filesystem:../../shared/database/migrations"
        baseline-on-migrate: true
      kafka:
        bootstrap-servers: {{ $cfg.kafka.bootstrapServers | quote }}
        consumer:
          group-id: {{ $cfg.kafka.consumerGroupId | quote }}
          auto-offset-reset: earliest
          enable-auto-commit: false
          key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
          value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
        producer:
          key-serializer: org.apache.kafka.common.serialization.StringSerializer
          value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    inbox:
      kafka:
        topics:
          bridge-structured-tasks: {{ $cfg.kafka.topics.bridgeStructuredTasks | quote }}
          chain-scheduling-updated: {{ $cfg.kafka.topics.chainSchedulingUpdated | quote }}
          mind-task-creation-requested: {{ $cfg.kafka.topics.mindTaskCreationRequested | quote }}
        retry:
          max-attempts: 3
          initial-backoff-ms: 500
          multiplier: 2.0
          max-backoff-ms: 10000
    kafka:
      producer:
        retry:
          max-attempts: 3
          initial-backoff-ms: 200
          backoff-multiplier: 2.0
          max-backoff-ms: 5000
    outbox:
      worker:
        poll-interval-ms: 5000
        batch-size: 20
        max-retries: 3
        backoff-base-seconds: 10
        backoff-max-seconds: 120
      cleanup:
        cron: "0 0 3 * * *"
        published-retention-days: 7
        failed-retention-days: 30
    logging:
      file:
        name: logs/inbox.log
      logback:
        rollingpolicy:
          max-file-size: 10MB
          max-history: 14
          total-size-cap: 500MB
{{- end }}
{{- end }}
