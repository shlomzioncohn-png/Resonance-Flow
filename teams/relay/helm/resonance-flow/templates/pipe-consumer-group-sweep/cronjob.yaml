{{- if .Values.pipeConsumerGroupSweep.enabled }}
{{- $sweep := .Values.pipeConsumerGroupSweep }}
{{- /* CronJob names are capped at 52 chars by Kubernetes (stricter than the
   chart's normal 63-char fullname truncation) - trunc the release/component
   prefix so the fixed "-pipe-consumer-group-sweep" suffix (26 chars) always
   fits, regardless of how long an individual component's name is. */ -}}
{{- $sweepName := printf "%s-pipe-consumer-group-sweep" (include "resonance-flow.fullname" $ | trunc 25 | trimSuffix "-") }}
apiVersion: batch/v1
kind: CronJob

metadata:
  name: {{ $sweepName }}
  labels:
    {{- include "resonance-flow.labels" $ | nindent 4 }}
    app.kubernetes.io/component: pipe-consumer-group-sweep

spec:
  schedule: {{ $sweep.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ $sweep.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ $sweep.failedJobsHistoryLimit }}

  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            {{- include "resonance-flow.selectorLabels" $ | nindent 12 }}
            app.kubernetes.io/component: pipe-consumer-group-sweep

        spec:
          restartPolicy: Never
          containers:
            - name: sweep
              image: "{{ $sweep.image.repository }}:{{ $sweep.image.tag }}"
              command: ["/bin/sh", "/scripts/sweep.sh"]

              env:
                - name: KAFKA_BOOTSTRAP_SERVERS
                  value: {{ printf "%s:%s" (include "resonance-flow.dependencyHostByName" (dict "root" $ "deps" $.Values.dependencies "name" "kafka")) (include "resonance-flow.dependencyPort" (dict "deps" $.Values.dependencies "name" "kafka")) | quote }}
                - name: KAFKA_SASL_JAAS_CONFIG
                  value: {{ include "resonance-flow.kafkaSaslJaasConfig" $ | quote }}
                - name: GROUP_PATTERN
                  value: {{ $sweep.groupPattern | quote }}

              volumeMounts:
                - name: sweep-script
                  mountPath: /scripts

              {{- with $sweep.resources }}
              resources:
                {{- toYaml . | nindent 16 }}
              {{- end }}

          volumes:
            - name: sweep-script
              configMap:
                name: {{ $sweepName }}
                defaultMode: 0755
{{- end }}
