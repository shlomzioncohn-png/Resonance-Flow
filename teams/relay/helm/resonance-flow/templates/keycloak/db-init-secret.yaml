{{- /*
Rendered whenever postgresql is, not only with keycloak: postgresql.primary.initdb.scriptsSecret
always points here, so a missing Secret would leave the Postgres pod stuck in ContainerCreating
(e.g. inbox's CI, which runs Postgres without Keycloak). Without Keycloak it just creates an
unused empty database.
*/}}
{{- if .Values.postgresql.enabled }}
{{- $db := .Values.keycloak.externalDatabase }}
---
apiVersion: v1
kind: Secret

metadata:
  # Referenced by postgresql.primary.initdb.scriptsSecret in values.yaml.
  name: {{ .Release.Name }}-keycloak-db-init
  labels:
    {{- include "resonance-flow.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak

# Run by the postgresql subchart on first boot only (empty data dir) - with
# persistence disabled that's every Postgres restart. Rendered from
# keycloak.externalDatabase so Keycloak's credentials are set in one place.
type: Opaque
stringData:
  keycloak.sql: |
    CREATE USER {{ $db.user }} WITH PASSWORD '{{ $db.password }}';
    CREATE DATABASE {{ $db.database }} OWNER {{ $db.user }};
{{- end }}
