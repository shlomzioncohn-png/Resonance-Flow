{{/* Kafka/PostgreSQL/MinIO/kafka-exporter - see README.md "Metrics scraping". */}}
{{- if .Capabilities.APIVersions.Has "monitoring.coreos.com/v1/ServiceMonitor" }}
{{- $monitors := list }}
{{- if and .Values.kafka.enabled .Values.kafka.metrics.jmx.enabled }}
{{- $monitors = append $monitors (dict "name" "kafka" "selector" (dict "app.kubernetes.io/instance" .Release.Name "app.kubernetes.io/name" "kafka" "app.kubernetes.io/component" "metrics") "port" "http-metrics" "paths" (list "/metrics")) }}
{{- end }}
{{- if and .Values.postgresql.enabled .Values.postgresql.metrics.enabled }}
{{- $monitors = append $monitors (dict "name" "postgresql" "selector" (dict "app.kubernetes.io/instance" .Release.Name "app.kubernetes.io/name" "postgresql" "app.kubernetes.io/component" "metrics") "port" "http-metrics" "paths" (list "/metrics")) }}
{{- end }}
{{- if and .Values.minio.enabled .Values.minio.metrics.enabled }}
{{- $monitors = append $monitors (dict "name" "minio" "selector" (dict "app.kubernetes.io/instance" .Release.Name "app.kubernetes.io/name" "minio" "app.kubernetes.io/component" "minio") "port" "tcp-api" "paths" (list "/minio/v2/metrics/cluster" "/minio/v2/metrics/node" "/minio/v2/metrics/bucket")) }}
{{- end }}
{{- /* The exporter chart labels its Service app/release, not app.kubernetes.io/*. */}}
{{- if (index .Values "kafka-exporter").enabled }}
{{- $monitors = append $monitors (dict "name" "kafka-exporter" "selector" (dict "app" "kafka-exporter" "release" .Release.Name) "port" "exporter-port" "paths" (list "/metrics")) }}
{{- end }}
{{- range $m := $monitors }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor

metadata:
  name: {{ include "resonance-flow.fullname" $ }}-{{ $m.name }}-metrics
  labels:
    {{- include "resonance-flow.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $m.name }}

spec:
  selector:
    matchLabels:
      {{- toYaml $m.selector | nindent 6 }}

  endpoints:
    {{- range $path := $m.paths }}
    - port: {{ $m.port }}
      path: {{ $path }}
      interval: 30s
      relabelings:
        - targetLabel: component
          replacement: {{ $m.name }}
        - targetLabel: team
          replacement: relay
    {{- end }}
{{- end }}
{{- end }}
