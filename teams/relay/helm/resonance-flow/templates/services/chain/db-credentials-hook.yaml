{{- /*
Creates chain-db-credentials once, before Postgres starts. A hook, not a
templated Secret: ArgoCD renders offline, so the chart can't see an existing
password and would regenerate it on every sync. ArgoCD runs Helm
pre-install/pre-upgrade hooks as PreSync. Gated like chain-db-init: Postgres
initdb needs it even on CI's first, Chain-disabled install.
*/ -}}
{{- if .Values.postgresql.enabled }}
{{- $name := printf "%s-chain-db-credentials-init" (include "resonance-flow.fullname" .) }}
{{- $secretName := printf "%s-chain-db-credentials" (include "resonance-flow.fullname" .) }}
---
apiVersion: v1
kind: ServiceAccount

metadata:
  name: {{ $name }}
  labels:
    {{- include "resonance-flow.labels" . | nindent 4 }}
    app.kubernetes.io/component: chain
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role

metadata:
  name: {{ $name }}
  labels:
    {{- include "resonance-flow.labels" . | nindent 4 }}
    app.kubernetes.io/component: chain
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded

# create only - no get/update, so the Job can never read or overwrite a live password.
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding

metadata:
  name: {{ $name }}
  labels:
    {{- include "resonance-flow.labels" . | nindent 4 }}
    app.kubernetes.io/component: chain
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job

metadata:
  name: {{ $name }}
  labels:
    {{- include "resonance-flow.labels" . | nindent 4 }}
    app.kubernetes.io/component: chain
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded

spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        {{- include "resonance-flow.selectorLabels" . | nindent 8 }}
        # Not "chain": that would match Chain's Service/Deployment selectors.
        app.kubernetes.io/component: chain-db-credentials-init
    spec:
      serviceAccountName: {{ $name }}
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        # The image's curl_user, numeric - runAsNonRoot can't verify a named user.
        runAsUser: 100
        runAsGroup: 101
      containers:
        - name: create-secret
          image: curlimages/curl:8.11.1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command:
            - sh
            - -c
            - |
              set -eu
              SA=/var/run/secrets/kubernetes.io/serviceaccount
              PASSWORD="$(tr -dc 'A-Za-z0-9' </dev/urandom | head -c 32)"
              # POST is create-if-absent: 409 means it already exists and is left untouched.
              CODE=$(curl -sS -o /tmp/response -w '%{http_code}' \
                --cacert "$SA/ca.crt" \
                -H "Authorization: Bearer $(cat "$SA/token")" \
                -H "Content-Type: application/json" \
                -X POST "https://kubernetes.default.svc/api/v1/namespaces/{{ .Release.Namespace }}/secrets" \
                -d "{\"apiVersion\":\"v1\",\"kind\":\"Secret\",\"metadata\":{\"name\":\"{{ $secretName }}\"},\"type\":\"Opaque\",\"stringData\":{\"password\":\"$PASSWORD\"}}")
              case "$CODE" in
                201) echo "Created {{ $secretName }}" ;;
                409) echo "{{ $secretName }} already exists - left as is" ;;
                *) echo "Unexpected HTTP $CODE creating {{ $secretName }}:" >&2; cat /tmp/response >&2; exit 1 ;;
              esac
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
{{- end }}
