{{- $component := .Values.components.chain }}
{{- if $component.enabled }}
{{- with $component.config }}
{{- $cfg := .data }}
---
{{ include "resonance-flow.configMapHeader" (dict "root" $ "component" "chain") }}

data:
  config.yaml: |
    server:
      port: {{ $component.containerPort }}
    spring:
      config:
        # Binds the chain-db-credentials Secret's "password" file to the ${password}
        # placeholder below - the Secret is mounted as a file, not passed as an env var.
        import: "optional:configtree:/etc/resonance-flow/secrets/chain-db/"
      application:
        name: chain
      datasource:
        # Same host/port helpers as the wait-for-postgresql initContainer.
        url: "jdbc:postgresql://{{ include "resonance-flow.dependencyAddress" (dict "root" $ "deps" $component.dependencies "name" "postgresql") }}/{{ $cfg.datasource.database }}?stringtype=unspecified"
        username: {{ $cfg.datasource.username | quote }}
        password: "${password}"
      kafka:
        {{- include "resonance-flow.springKafkaBase" (dict "root" $) | nindent 8 }}
        {{- include "resonance-flow.springKafkaConsumerDefaults" (dict "groupId" $cfg.kafka.consumerGroupId) | nindent 8 }}
        producer:
          key-serializer: org.apache.kafka.common.serialization.StringSerializer
          value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    chain:
      kafka:
        # Map keys are the literal eventType strings KafkaEventPublisher.resolveTopic()
        # looks up (see KafkaEventPublisherTest) - must be dot-case, matching
        # application.yml's local default, not kebab-case.
        topics:
          task.dependencies.proposed: {{ $cfg.kafka.topics.taskDependenciesProposed | quote }}
          # task.dependencies.removed omitted - see values.yaml note (removeDependency is REST-only, not Kafka)
          task.status.updated: {{ $cfg.kafka.topics.taskStatusUpdated | quote }}
          task.scheduling.updated: {{ $cfg.kafka.topics.taskSchedulingUpdated | quote }}
    logging:
      file:
        name: logs/chain.log
{{- end }}
{{- end }}

# Helm never creates or touches chain-db-credentials' data - it can't tell a
# live password from none under an offline render, so writing here risks
# overwriting or deleting the real value. Provided externally; referenced by
# name only, here and in values.yaml's postgresql.primary.extraVolumes.
