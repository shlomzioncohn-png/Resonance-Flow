{{- $component := .Values.components.chain }}
{{- if $component.enabled }}
{{- with $component.config }}
{{- $cfg := .data }}
---
{{ include "resonance-flow.configMapHeader" (dict "root" $ "component" "chain") }}

data:
  config.yaml: |
    server:
      port: {{ $component.containerPort }}
    spring:
      config:
        # Binds the chain-db-credentials Secret's "password" file to the ${password}
        # placeholder below - the Secret is mounted as a file, not passed as an env var.
        import: "optional:configtree:/etc/resonance-flow/secrets/chain-db/"
      application:
        name: chain
      datasource:
        # Same host/port helpers as the wait-for-postgresql initContainer.
        url: "jdbc:postgresql://{{ include "resonance-flow.dependencyHostByName" (dict "root" $ "deps" $component.dependencies "name" "postgresql") }}:{{ include "resonance-flow.dependencyPort" (dict "deps" $component.dependencies "name" "postgresql") }}/{{ $cfg.datasource.database }}?stringtype=unspecified"
        username: {{ $cfg.datasource.username | quote }}
        password: "${password}"
      kafka:
        {{- include "resonance-flow.springKafkaBase" (dict "root" $) | nindent 8 }}
        {{- include "resonance-flow.springKafkaConsumerDefaults" (dict "groupId" $cfg.kafka.consumerGroupId) | nindent 8 }}
        producer:
          key-serializer: org.apache.kafka.common.serialization.StringSerializer
          value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    chain:
      kafka:
        # Map keys are the literal eventType strings KafkaEventPublisher.resolveTopic()
        # looks up (see KafkaEventPublisherTest) - must be dot-case, matching
        # application.yml's local default, not kebab-case.
        topics:
          task.dependencies.proposed: {{ $cfg.kafka.topics.taskDependenciesProposed | quote }}
          # task.dependencies.removed omitted - see values.yaml note (removeDependency is REST-only, not Kafka)
          task.status.updated: {{ $cfg.kafka.topics.taskStatusUpdated | quote }}
          task.scheduling.updated: {{ $cfg.kafka.topics.taskSchedulingUpdated | quote }}
    logging:
      file:
        name: logs/chain.log
{{- end }}
{{- end }}

{{- if .Values.postgresql.enabled }}
{{- $datasource := $component.config.data.datasource }}
---
apiVersion: v1
kind: ConfigMap

metadata:
  name: {{ include "resonance-flow.fullname" $ }}-chain-db-init
  labels:
    {{- include "resonance-flow.labels" $ | nindent 4 }}
    app.kubernetes.io/component: chain

data:
  create-chain-database.sh: |
    #!/bin/bash
    set -euo pipefail
    if [ -n "${POSTGRES_PASSWORD_FILE:-}" ]; then
      export PGPASSWORD="$(cat "$POSTGRES_PASSWORD_FILE")"
    else
      export PGPASSWORD="$POSTGRES_PASSWORD"
    fi
    psql -v ON_ERROR_STOP=1 --username postgres <<-EOSQL
      CREATE USER {{ $datasource.username }} WITH PASSWORD '${CHAIN_DB_PASSWORD}';
      CREATE DATABASE {{ $datasource.database }} OWNER {{ $datasource.username }};
    EOSQL

---
apiVersion: v1
kind: Secret

metadata:
  name: {{ include "resonance-flow.fullname" $ }}-chain-db-credentials
  # Both annotations are unconditional - they must apply even when
  # createDbPassword is false below, otherwise this Secret would be pruned the
  # moment a sync/reinstall runs with the flag off, taking the live password
  # with it. resource-policy:keep covers plain `helm upgrade --install` (e.g.
  # setup-service-infra's kind-cluster deploy); ArgoCD does NOT honor that
  # annotation for its own pruning (argoproj/argo-cd#17819/#11227, still open
  # upstream), so Prune=false/Delete=false is required separately for the
  # ArgoCD path.
  annotations:
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  labels:
    {{- include "resonance-flow.labels" $ | nindent 4 }}
    app.kubernetes.io/component: chain

# lookup can't tell an existing password from a first install under ArgoCD (it
# renders via `helm template`, never against the live cluster) - so instead of
# generating on every render, components.chain.createDbPassword gates
# randAlphaNum: true only for a genuinely fresh install (every CI kind cluster
# is one), flipped to false in values once a real cluster has bootstrapped so
# later syncs stop rendering a new password at all. The Application's
# ignoreDifferences + RespectIgnoreDifferences=true on this Secret's
# data.password (see argocd/apps/resonance-flow.yaml) still matters even with
# the flag off, since omitting the key here is itself a diff from the live
# Secret's existing data.password.
type: Opaque
data:
  {{- if $component.createDbPassword }}
  password: {{ randAlphaNum 24 | b64enc }}
  {{- end }}
{{- end }}
