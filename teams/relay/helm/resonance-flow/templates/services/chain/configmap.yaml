{{- $component := .Values.components.chain }}
{{- if $component.enabled }}
{{- with $component.config }}
{{- $cfg := .data }}
---
apiVersion: v1
kind: ConfigMap

metadata:
  name: {{ include "resonance-flow.fullname" $ }}-chain-config
  labels:
    {{- include "resonance-flow.labels" $ | nindent 4 }}
    app.kubernetes.io/component: chain

data:
  config.yaml: |
    server:
      port: {{ $component.containerPort }}
    spring:
      application:
        name: chain
      datasource:
        # Same host/port helpers as the wait-for-postgresql initContainer.
        url: "jdbc:postgresql://{{ include "resonance-flow.dependencyHostByName" (dict "root" $ "deps" $component.dependencies "name" "postgresql") }}:{{ include "resonance-flow.dependencyPort" (dict "deps" $component.dependencies "name" "postgresql") }}/{{ $cfg.datasource.database }}?stringtype=unspecified"
        username: {{ $cfg.datasource.username | quote }}
        password: {{ $cfg.datasource.password | quote }}
    # Kafka pending confirmation from the Chain team on what it consumes/produces (#384).
    logging:
      file:
        name: logs/chain.log
{{- end }}
{{- end }}
