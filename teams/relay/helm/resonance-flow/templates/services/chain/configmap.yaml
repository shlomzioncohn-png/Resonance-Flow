{{- $component := .Values.components.chain }}
{{- if $component.enabled }}
{{- with $component.config }}
{{- $cfg := .data }}
---
apiVersion: v1
kind: ConfigMap

metadata:
  name: {{ include "resonance-flow.fullname" $ }}-chain-config
  labels:
    {{- include "resonance-flow.labels" $ | nindent 4 }}
    app.kubernetes.io/component: chain

data:
  config.yaml: |
    server:
      port: {{ $component.containerPort }}
    spring:
      application:
        name: chain
      datasource:
        # Same host/port helpers as the wait-for-postgresql initContainer.
        url: "jdbc:postgresql://{{ include "resonance-flow.dependencyHostByName" (dict "root" $ "deps" $component.dependencies "name" "postgresql") }}:{{ include "resonance-flow.dependencyPort" (dict "deps" $component.dependencies "name" "postgresql") }}/{{ $cfg.datasource.database }}?stringtype=unspecified"
        username: {{ $cfg.datasource.username | quote }}
        password: "${DB_PASSWORD}"
      kafka:
        bootstrap-servers: {{ printf "%s:%s" (include "resonance-flow.dependencyHostByName" (dict "root" $ "deps" $.Values.dependencies "name" "kafka")) (include "resonance-flow.dependencyPort" (dict "deps" $.Values.dependencies "name" "kafka")) | quote }}
        security:
          protocol: SASL_PLAINTEXT
        properties:
          sasl.mechanism: "PLAIN"
          sasl.jaas.config: {{ include "resonance-flow.kafkaSaslJaasConfig" $ | quote }}
        consumer:
          group-id: {{ $cfg.kafka.consumerGroupId | quote }}
          auto-offset-reset: earliest
          enable-auto-commit: false
          key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
          value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
        producer:
          key-serializer: org.apache.kafka.common.serialization.StringSerializer
          value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    chain:
      kafka:
        topics:
          task-dependencies-proposed: {{ $cfg.kafka.topics.taskDependenciesProposed | quote }}
          task-dependencies-removed: {{ $cfg.kafka.topics.taskDependenciesRemoved | quote }}
          task-status-updated: {{ $cfg.kafka.topics.taskStatusUpdated | quote }}
          task-scheduling-updated: {{ $cfg.kafka.topics.taskSchedulingUpdated | quote }}
    logging:
      file:
        name: logs/chain.log

---
apiVersion: v1
kind: ConfigMap

metadata:
  name: chain-db-init
  labels:
    {{- include "resonance-flow.labels" $ | nindent 4 }}
    app.kubernetes.io/component: chain

data:
  create-chain-database.sh: |
    #!/bin/bash
    set -euo pipefail
    psql -v ON_ERROR_STOP=1 --username postgres <<-EOSQL
      CREATE USER {{ $cfg.datasource.username }} WITH PASSWORD '${CHAIN_DB_PASSWORD}';
      CREATE DATABASE {{ $cfg.datasource.database }} OWNER {{ $cfg.datasource.username }};
    EOSQL

---
{{- $secretName := "chain-db-credentials" }}
{{- $existingSecret := lookup "v1" "Secret" $.Release.Namespace $secretName }}
apiVersion: v1
kind: Secret

metadata:
  name: {{ $secretName }}
  labels:
    {{- include "resonance-flow.labels" $ | nindent 4 }}
    app.kubernetes.io/component: chain

type: Opaque
data:
  password: {{ if $existingSecret }}{{ index $existingSecret.data "password" }}{{ else }}{{ randAlphaNum 24 | b64enc }}{{ end }}
{{- end }}
{{- end }}
