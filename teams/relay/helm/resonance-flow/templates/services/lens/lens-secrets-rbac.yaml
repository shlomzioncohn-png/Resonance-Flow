{{- /*
Shared RBAC for LENS's Secret-creating hook Jobs (lens-gateway-jwt, lens-admin) -
one ServiceAccount/Role/RoleBinding instead of one pair per hook.
*/ -}}
{{- if or (index .Values.components "lens-gateway").enabled (or (index .Values.components "lens-bff").enabled .Values.components.inbox.enabled) }}
{{- $name := printf "%s-lens-secrets-init" (include "resonance-flow.fullname" .) }}
{{- $jwtSecretName := printf "%s-lens-gateway-jwt" (include "resonance-flow.fullname" .) }}
{{- $adminSecretName := printf "%s-lens-admin" (include "resonance-flow.fullname" .) }}
---
apiVersion: v1
kind: ServiceAccount

metadata:
  name: {{ $name }}
  labels:
    {{- include "resonance-flow.labels" . | nindent 4 }}
    app.kubernetes.io/component: lens-gateway
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role

metadata:
  name: {{ $name }}
  labels:
    {{- include "resonance-flow.labels" . | nindent 4 }}
    app.kubernetes.io/component: lens-gateway
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded

rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "delete"]
    resourceNames:
      - {{ $jwtSecretName }}
      - {{ $adminSecretName }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding

metadata:
  name: {{ $name }}
  labels:
    {{- include "resonance-flow.labels" . | nindent 4 }}
    app.kubernetes.io/component: lens-gateway
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
{{- end }}
