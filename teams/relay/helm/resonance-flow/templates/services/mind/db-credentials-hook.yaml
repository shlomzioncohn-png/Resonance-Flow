{{- if .Values.postgresql.enabled }}
{{- include "resonance-flow.dbCredentialsHook" (dict "root" $ "component" "mind" "selfHeal" true "extraScriptTemplate" "resonance-flow.mind.appSecretScript" "extraSelfHealSecretName" (printf "%s-mind-secret" (include "resonance-flow.fullname" $))) }}
{{- end }}

{{- define "resonance-flow.mind.appSecretScript" -}}
{{- $appSecretName := printf "%s-mind-secret" (include "resonance-flow.fullname" .) }}
{{- if .Values.components.mind.kafkaSasl }}
SECRETS_YAML="$(printf 'llm:\n  api_key: "{{ .Values.components.mind.llmApiKey }}"\nvector_store:\n  password: "%s"\nobject_storage:\n  access_key: "{{ .Values.minio.auth.rootUser }}"\n  secret_key: "{{ .Values.minio.auth.rootPassword }}"\nkafka:\n  sasl:\n    mechanism: PLAIN\n    username: "{{ first .Values.kafka.sasl.client.users }}"\n    password: "{{ first .Values.kafka.sasl.client.passwords }}"\n' "$PASSWORD")"
{{- else }}
SECRETS_YAML="$(printf 'llm:\n  api_key: "{{ .Values.components.mind.llmApiKey }}"\nvector_store:\n  password: "%s"\nobject_storage:\n  access_key: "{{ .Values.minio.auth.rootUser }}"\n  secret_key: "{{ .Values.minio.auth.rootPassword }}"\n' "$PASSWORD")"
{{- end }}
ESCAPED="$(printf '%s' "$SECRETS_YAML" | sed 's/"/\\"/g' | awk 'BEGIN{ORS="\\n"} {print}')"
APP_BODY="{\"apiVersion\":\"v1\",\"kind\":\"Secret\",\"metadata\":{\"name\":\"{{ $appSecretName }}\"},\"type\":\"Opaque\",\"stringData\":{\"secrets.yaml\":\"$ESCAPED\"}}"
CODE=$(create "$APP_BODY")
case "$CODE" in
  201) echo "Created {{ $appSecretName }}" ;;
  409)
    GET_CODE=$(curl -sS -o /tmp/app-get-response.json -w '%{http_code}' \
      --cacert "$SA/ca.crt" \
      -H "Authorization: Bearer $(cat "$SA/token")" \
      -X GET "$API/{{ $appSecretName }}?pretty=false")
    if [ "$GET_CODE" != "200" ]; then
      echo "Unexpected HTTP $GET_CODE reading {{ $appSecretName }}:" >&2
      cat /tmp/app-get-response.json >&2
      exit 1
    fi
    EXISTING_SECRETS_YAML_B64="$(sed -n 's/.*"secrets\.yaml": *"\([^"]*\)".*/\1/p' /tmp/app-get-response.json)"
    EXISTING_PASSWORD="$(printf '%s' "$EXISTING_SECRETS_YAML_B64" | base64 -d | sed -n 's/^  password: "\([^"]*\)"$/\1/p')"
    if [ "$EXISTING_PASSWORD" = "$PASSWORD" ]; then
      echo "{{ $appSecretName }} already exists and matches the current password - left as is"
    else
      echo "{{ $appSecretName }} exists but its password is missing or stale - recreating it" >&2
      DELETE_CODE=$(curl -sS -o /tmp/app-delete-response -w '%{http_code}' \
        --cacert "$SA/ca.crt" \
        -H "Authorization: Bearer $(cat "$SA/token")" \
        -X DELETE "$API/{{ $appSecretName }}")
      case "$DELETE_CODE" in
        200|202) ;;
        *) echo "Unexpected HTTP $DELETE_CODE deleting the broken {{ $appSecretName }}:" >&2; cat /tmp/app-delete-response >&2; exit 1 ;;
      esac
      RECREATE_CODE=$(create "$APP_BODY")
      if [ "$RECREATE_CODE" != "201" ]; then
        echo "Unexpected HTTP $RECREATE_CODE recreating {{ $appSecretName }}:" >&2
        cat /tmp/response >&2
        exit 1
      fi
      echo "Recreated {{ $appSecretName }} with fresh secrets.yaml"
    fi
    ;;
  *) echo "Unexpected HTTP $CODE creating {{ $appSecretName }}:" >&2; cat /tmp/response >&2; exit 1 ;;
esac
{{- end -}}
