{{- if .Values.postgresql.enabled }}
{{- $name := printf "%s-mind-db-credentials-init" (include "resonance-flow.fullname" .) }}
{{- $secretName := printf "%s-mind-db-credentials" (include "resonance-flow.fullname" .) }}
{{- $appSecretName := printf "%s-mind-secret" (include "resonance-flow.fullname" .) }}
---
apiVersion: v1
kind: ServiceAccount

metadata:
  name: {{ $name }}
  labels:
    {{- include "resonance-flow.labels" . | nindent 4 }}
    app.kubernetes.io/component: mind
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role

metadata:
  name: {{ $name }}
  labels:
    {{- include "resonance-flow.labels" . | nindent 4 }}
    app.kubernetes.io/component: mind
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded

rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "delete"]
    resourceNames:
      - {{ $secretName }}
      - {{ $appSecretName }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding

metadata:
  name: {{ $name }}
  labels:
    {{- include "resonance-flow.labels" . | nindent 4 }}
    app.kubernetes.io/component: mind
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job

metadata:
  name: {{ $name }}
  labels:
    {{- include "resonance-flow.labels" . | nindent 4 }}
    app.kubernetes.io/component: mind
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded

spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        {{- include "resonance-flow.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mind-db-credentials-init
    spec:
      serviceAccountName: {{ $name }}
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
      containers:
        - name: create-secret
          image: curlimages/curl:8.11.1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command:
            - sh
            - -c
            - |
              set -eu
              SA=/var/run/secrets/kubernetes.io/serviceaccount
              API="https://kubernetes.default.svc/api/v1/namespaces/{{ .Release.Namespace }}/secrets"
              PASSWORD="$(tr -dc 'A-Za-z0-9' </dev/urandom | head -c 32)"
              if [ -z "$PASSWORD" ]; then
                echo "Generated an empty password, refusing to continue" >&2
                exit 1
              fi
              create() {
                curl -sS -o /tmp/response -w '%{http_code}' \
                  --cacert "$SA/ca.crt" \
                  -H "Authorization: Bearer $(cat "$SA/token")" \
                  -H "Content-Type: application/json" \
                  -X POST "$API" -d "$1"
              }
              DB_BODY="{\"apiVersion\":\"v1\",\"kind\":\"Secret\",\"metadata\":{\"name\":\"{{ $secretName }}\"},\"type\":\"Opaque\",\"stringData\":{\"password\":\"$PASSWORD\"}}"
              CODE=$(create "$DB_BODY")
              case "$CODE" in
                201) echo "Created {{ $secretName }}" ;;
                409)
                  GET_CODE=$(curl -sS -o /tmp/get-response.json -w '%{http_code}' \
                    --cacert "$SA/ca.crt" \
                    -H "Authorization: Bearer $(cat "$SA/token")" \
                    -X GET "$API/{{ $secretName }}?pretty=false")
                  if [ "$GET_CODE" != "200" ]; then
                    echo "Unexpected HTTP $GET_CODE reading {{ $secretName }}:" >&2
                    cat /tmp/get-response.json >&2
                    exit 1
                  fi
                  EXISTING_PASSWORD="$(sed -n 's/.*"password": *"\([^"]*\)".*/\1/p' /tmp/get-response.json | base64 -d)"
                  if [ -n "$EXISTING_PASSWORD" ]; then
                    PASSWORD="$EXISTING_PASSWORD"
                    echo "{{ $secretName }} already exists and looks valid - reusing its password"
                  else
                    echo "{{ $secretName }} exists but its password is empty - recreating it" >&2
                    DELETE_CODE=$(curl -sS -o /tmp/delete-response -w '%{http_code}' \
                      --cacert "$SA/ca.crt" \
                      -H "Authorization: Bearer $(cat "$SA/token")" \
                      -X DELETE "$API/{{ $secretName }}")
                    case "$DELETE_CODE" in
                      200|202) ;;
                      *) echo "Unexpected HTTP $DELETE_CODE deleting the broken {{ $secretName }}:" >&2; cat /tmp/delete-response >&2; exit 1 ;;
                    esac
                    RECREATE_CODE=$(create "$DB_BODY")
                    if [ "$RECREATE_CODE" != "201" ]; then
                      echo "Unexpected HTTP $RECREATE_CODE recreating {{ $secretName }}:" >&2
                      cat /tmp/response >&2
                      exit 1
                    fi
                    echo "Recreated {{ $secretName }} with a new password"
                  fi
                  ;;
                *) echo "Unexpected HTTP $CODE creating {{ $secretName }}:" >&2; cat /tmp/response >&2; exit 1 ;;
              esac
              {{- if .Values.components.mind.kafkaSasl }}
              SECRETS_YAML="$(printf 'llm:\n  api_key: "{{ .Values.components.mind.llmApiKey }}"\nvector_store:\n  password: "%s"\nkafka:\n  sasl:\n    mechanism: PLAIN\n    username: "{{ first .Values.kafka.sasl.client.users }}"\n    password: "{{ first .Values.kafka.sasl.client.passwords }}"\n' "$PASSWORD")"
              {{- else }}
              SECRETS_YAML="$(printf 'llm:\n  api_key: "{{ .Values.components.mind.llmApiKey }}"\nvector_store:\n  password: "%s"\n' "$PASSWORD")"
              {{- end }}
              ESCAPED="$(printf '%s' "$SECRETS_YAML" | sed 's/"/\\"/g' | awk 'BEGIN{ORS="\\n"} {print}')"
              APP_BODY="{\"apiVersion\":\"v1\",\"kind\":\"Secret\",\"metadata\":{\"name\":\"{{ $appSecretName }}\"},\"type\":\"Opaque\",\"stringData\":{\"secrets.yaml\":\"$ESCAPED\"}}"
              CODE=$(create "$APP_BODY")
              case "$CODE" in
                201) echo "Created {{ $appSecretName }}" ;;
                409)
                  GET_CODE=$(curl -sS -o /tmp/app-get-response.json -w '%{http_code}' \
                    --cacert "$SA/ca.crt" \
                    -H "Authorization: Bearer $(cat "$SA/token")" \
                    -X GET "$API/{{ $appSecretName }}?pretty=false")
                  if [ "$GET_CODE" != "200" ]; then
                    echo "Unexpected HTTP $GET_CODE reading {{ $appSecretName }}:" >&2
                    cat /tmp/app-get-response.json >&2
                    exit 1
                  fi
                  EXISTING_SECRETS_YAML_B64="$(sed -n 's/.*"secrets\.yaml": *"\([^"]*\)".*/\1/p' /tmp/app-get-response.json)"
                  EXISTING_PASSWORD="$(printf '%s' "$EXISTING_SECRETS_YAML_B64" | base64 -d | sed -n 's/^  password: "\([^"]*\)"$/\1/p')"
                  if [ "$EXISTING_PASSWORD" = "$PASSWORD" ]; then
                    echo "{{ $appSecretName }} already exists and matches the current password - left as is"
                  else
                    echo "{{ $appSecretName }} exists but its password is missing or stale - recreating it" >&2
                    DELETE_CODE=$(curl -sS -o /tmp/app-delete-response -w '%{http_code}' \
                      --cacert "$SA/ca.crt" \
                      -H "Authorization: Bearer $(cat "$SA/token")" \
                      -X DELETE "$API/{{ $appSecretName }}")
                    case "$DELETE_CODE" in
                      200|202) ;;
                      *) echo "Unexpected HTTP $DELETE_CODE deleting the broken {{ $appSecretName }}:" >&2; cat /tmp/app-delete-response >&2; exit 1 ;;
                    esac
                    RECREATE_CODE=$(create "$APP_BODY")
                    if [ "$RECREATE_CODE" != "201" ]; then
                      echo "Unexpected HTTP $RECREATE_CODE recreating {{ $appSecretName }}:" >&2
                      cat /tmp/response >&2
                      exit 1
                    fi
                    echo "Recreated {{ $appSecretName }} with fresh secrets.yaml"
                  fi
                  ;;
                *) echo "Unexpected HTTP $CODE creating {{ $appSecretName }}:" >&2; cat /tmp/response >&2; exit 1 ;;
              esac
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
{{- end }}
