{{- /*
Creates MIND's DB credentials and app Secret once, before Postgres starts. Same
pattern as Chain's db-credentials-hook.yaml - see that file for why this is a
hook and not a templated Secret.
*/ -}}
{{- if .Values.postgresql.enabled }}
{{- $name := printf "%s-mind-secrets-init" (include "resonance-flow.fullname" .) }}
{{- $dbSecretName := printf "%s-mind-db-credentials" (include "resonance-flow.fullname" .) }}
{{- $appSecretName := printf "%s-mind-secret" (include "resonance-flow.fullname" .) }}
---
apiVersion: v1
kind: ServiceAccount

metadata:
  name: {{ $name }}
  labels:
    {{- include "resonance-flow.labels" . | nindent 4 }}
    app.kubernetes.io/component: mind
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role

metadata:
  name: {{ $name }}
  labels:
    {{- include "resonance-flow.labels" . | nindent 4 }}
    app.kubernetes.io/component: mind
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded

# create only - no get/update, so the Job can never read or overwrite a live password.
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding

metadata:
  name: {{ $name }}
  labels:
    {{- include "resonance-flow.labels" . | nindent 4 }}
    app.kubernetes.io/component: mind
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job

metadata:
  name: {{ $name }}
  labels:
    {{- include "resonance-flow.labels" . | nindent 4 }}
    app.kubernetes.io/component: mind
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded

spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        {{- include "resonance-flow.selectorLabels" . | nindent 8 }}
        # Not "mind": that would match MIND's Service/Deployment selectors.
        app.kubernetes.io/component: mind-secrets-init
    spec:
      serviceAccountName: {{ $name }}
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        # The image's curl_user, numeric - runAsNonRoot can't verify a named user.
        runAsUser: 100
        runAsGroup: 101
      containers:
        - name: create-secrets
          image: curlimages/curl:8.11.1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command:
            - sh
            - -c
            - |
              set -eu
              SA=/var/run/secrets/kubernetes.io/serviceaccount
              API="https://kubernetes.default.svc/api/v1/namespaces/{{ .Release.Namespace }}/secrets"
              PASSWORD="$(tr -dc 'A-Za-z0-9' </dev/urandom | head -c 32)"
              create() {
                curl -sS -o /tmp/response -w '%{http_code}' \
                  --cacert "$SA/ca.crt" \
                  -H "Authorization: Bearer $(cat "$SA/token")" \
                  -H "Content-Type: application/json" \
                  -X POST "$API" -d "$1"
              }
              DB_BODY="{\"apiVersion\":\"v1\",\"kind\":\"Secret\",\"metadata\":{\"name\":\"{{ $dbSecretName }}\"},\"type\":\"Opaque\",\"stringData\":{\"password\":\"$PASSWORD\"}}"
              CODE=$(create "$DB_BODY")
              case "$CODE" in
                201) echo "Created {{ $dbSecretName }}" ;;
                409) echo "{{ $dbSecretName }} already exists - left as is, app Secret not touched" ; exit 0 ;;
                *) echo "Unexpected HTTP $CODE creating {{ $dbSecretName }}:" >&2; cat /tmp/response >&2; exit 1 ;;
              esac
              SECRETS_YAML="$(printf 'llm:\n  api_key: ""\nvector_store:\n  password: "%s"\nobject_storage:\n  access_key: ""\n  secret_key: ""\nkafka:\n  sasl:\n    mechanism: PLAIN\n    username: "{{ first .Values.kafka.sasl.client.users }}"\n    password: "{{ first .Values.kafka.sasl.client.passwords }}"\n' "$PASSWORD")"
              ESCAPED="$(printf '%s' "$SECRETS_YAML" | sed 's/"/\\"/g' | awk 'BEGIN{ORS="\\n"} {print}')"
              APP_BODY="{\"apiVersion\":\"v1\",\"kind\":\"Secret\",\"metadata\":{\"name\":\"{{ $appSecretName }}\"},\"type\":\"Opaque\",\"stringData\":{\"secrets.yaml\":\"$ESCAPED\"}}"
              CODE=$(create "$APP_BODY")
              case "$CODE" in
                201) echo "Created {{ $appSecretName }}" ;;
                *) echo "Unexpected HTTP $CODE creating {{ $appSecretName }}:" >&2; cat /tmp/response >&2; exit 1 ;;
              esac
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
{{- end }}
