{{- $component := .Values.components.mind }}
{{- if and $component.enabled $component.secret $component.secret.create }}
{{- $d := $component.secret.data | default dict }}
---
apiVersion: v1
kind: Secret

metadata:
  name: {{ include "resonance-flow.fullname" $ }}-mind-secret
  labels:
    {{- include "resonance-flow.labels" $ | nindent 4 }}
    app.kubernetes.io/component: mind

# Rendered only for local testing (components.mind.secret.create). Elsewhere the
# Secret is created outside the chart; the Deployment mounts it at
# /etc/resonance-flow/secret/ (SECRETS_FILE_PATH) either way.
type: Opaque
stringData:
  secrets.yaml: |
    llm:
      api_key: {{ $d.llm_api_key | default "" | quote }}
    vector_store:
      password: {{ $d.vector_store_password | default "" | quote }}
    object_storage:
      access_key: {{ $d.object_storage_access_key | default "" | quote }}
      secret_key: {{ $d.object_storage_secret_key | default "" | quote }}
{{- end }}
