{{- $component := .Values.components.mind }}
{{- if $component.enabled }}
{{- with $component.config }}
{{- $cfg := . }}
---
{{ include "resonance-flow.configMapHeader" (dict "root" $ "component" "mind") }}

data:
  config.yaml: |
    vector_store:
      # Same host/port helpers as the wait-for-postgresql initContainer. Bare
      # host:port, not a URL - mind.config.py builds the DSN from this plus
      # .user/.db/.password (see teams/mind/src/mind/config.py).
      url: {{ printf "%s:%s" (include "resonance-flow.dependencyHostByName" (dict "root" $ "deps" $component.dependencies "name" "postgresql")) (include "resonance-flow.dependencyPort" (dict "deps" $component.dependencies "name" "postgresql")) | quote }}
      user: {{ $cfg.vector_store.user | quote }}
      db: {{ $cfg.vector_store.db | quote }}
    llm:
      model: {{ $cfg.llm.model | quote }}
      cache_dir: {{ $cfg.llm.cache_dir | quote }}
    ocr:
      provider: {{ $cfg.ocr.provider | quote }}
    asr:
      provider: {{ $cfg.asr.provider | quote }}
      whisper_model: {{ $cfg.asr.whisper_model | quote }}
    object_storage:
      endpoint: {{ printf "http://%s:%s" (include "resonance-flow.dependencyHostByName" (dict "root" $ "deps" $component.dependencies "name" "minio")) (include "resonance-flow.dependencyPort" (dict "deps" $component.dependencies "name" "minio")) | quote }}
      bucket: {{ $cfg.object_storage.bucket | quote }}
    kafka:
      bootstrap_servers: {{ printf "%s:%s" (include "resonance-flow.dependencyHostByName" (dict "root" $ "deps" $.Values.dependencies "name" "kafka")) (include "resonance-flow.dependencyPort" (dict "deps" $.Values.dependencies "name" "kafka")) | quote }}
      schema_registry_url: {{ printf "http://%s:%s/apis/ccompat/v6" (include "resonance-flow.dependencyHostByName" (dict "root" $ "deps" $component.dependencies "name" "schema-registry")) (include "resonance-flow.dependencyPort" (dict "deps" $component.dependencies "name" "schema-registry")) | quote }}
      producer:
        task_creation_requested_topic: {{ $cfg.kafka.producer.task_creation_requested_topic | quote }}
    service:
      log_level: {{ $cfg.service.log_level | quote }}
{{- end }}
{{- end }}
