      # persistent backend (its own Postgres/Kafka storage) before a real prod rollout.
      repository: "apicurio/apicurio-registry-mem"
      pullPolicy: IfNotPresent
      tag: "2.5.11.Final"
    containerPort: 8080
    service:
      type: ClusterIP
      port: 8080
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    startupProbe:
      httpGet:
        path: /health/live
        port: http
      periodSeconds: 5
      # Quarkus boot under a constrained CPU request measured ~200s+ locally (verified live -
      # killed with SIGTERM right at the old 40*5s=200s budget, before it finished starting).
      # 60*5s=300s matches the margin inbox's own startupProbe already carries for the same reason.
      failureThreshold: 60
    livenessProbe:
      httpGet:
        path: /health/live
        port: http
      periodSeconds: 10
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /health/ready
        port: http
      periodSeconds: 5
      failureThreshold: 3
