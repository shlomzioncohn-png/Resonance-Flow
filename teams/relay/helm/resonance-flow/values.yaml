imagePullSecrets: [] 
imagePullSecret:
  create: false 
  registry: ghcr.io
  username: "" 
  password: "" 
  email: "noreply@kamatech.org"
nameOverride: ""
fullnameOverride: ""
serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""
podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}
service:
  type: ClusterIP
  port: 8082
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
    - name: gateway
      sectionName: http
  hostnames:
    - chart-example.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /headers
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
volumes: []
volumeMounts: []
dependencies:
  - name: kafka
    host: kafka.kafka.svc.cluster.local
    port: 9092
initContainers: []
nodeSelector: {}
tolerations: []
affinity: {}
components:
  mind:
    replicaCount: 1
    image:
      repository: "ghcr.io/kamatechorg/resonance-flow/mind"
      pullPolicy: IfNotPresent
      tag: "22a8e01"
    containerPort: 8000
    service:
      type: ClusterIP
      port: 80
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    startupProbe:
      httpGet:
        path: /health
        port: http
      periodSeconds: 5
      failureThreshold: 40
    livenessProbe:
      httpGet:
        path: /health
        port: http
      periodSeconds: 10
      failureThreshold: 3
    readinessProbe:
