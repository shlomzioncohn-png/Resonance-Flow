imagePullSecrets: []
imagePullSecret:
  create: false
  registry: ghcr.io
  username: ""
  password: ""
  email: "noreply@kamatech.org"
nameOverride: ""
fullnameOverride: ""
serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""
podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}
service:
  type: ClusterIP
  port: 8082
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
    - name: gateway
      sectionName: http
  hostnames:
    - chart-example.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /headers
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
volumes: []
volumeMounts: []
dependencies:
  - name: kafka
    port: 9092
initContainers: []
nodeSelector: {}
tolerations: []
affinity: {}
x-defaults:
  resources: &defaultResources
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  healthProbes: &defaultHealthProbes
    startupProbe:
      httpGet:
        path: /health
        port: http
      periodSeconds: 5
      failureThreshold: 40
    livenessProbe:
      httpGet:
        path: /health
        port: http
      periodSeconds: 10
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /health
        port: http
      periodSeconds: 5
      failureThreshold: 3
  service: &defaultService
    type: ClusterIP
    port: 80
components:
  mind:
    enabled: true
    replicaCount: 1
    image:
      repository: "ghcr.io/kamatechorg/resonance-flow/mind"
      pullPolicy: IfNotPresent
      tag: "22a8e01"
    containerPort: 8000
    service: *defaultService
    resources: *defaultResources
    <<: *defaultHealthProbes
    dependencies:
      - name: minio
        port: 9000
  lens-bff:
    enabled: true
    replicaCount: 1
    image:
      repository: "ghcr.io/kamatechorg/resonance-flow/lens-bff"
      pullPolicy: IfNotPresent
      tag: "placeholder"
    containerPort: 8082
    service: *defaultService
    resources: *defaultResources
    <<: *defaultHealthProbes
  bridge:
    enabled: true
    replicaCount: 1
    image:
      repository: "ghcr.io/kamatechorg/resonance-flow/bridge"
      pullPolicy: IfNotPresent
      tag: "94c3259"
    containerPort: 8080
    service: *defaultService
    resources: *defaultResources
    <<: *defaultHealthProbes
    dependencies:
      - name: minio
        port: 9000
  lens-frontend:
    enabled: true
    replicaCount: 1
    image:
      repository: "ghcr.io/kamatechorg/resonance-flow/lens-frontend"
      pullPolicy: IfNotPresent
      tag: "placeholder"
    containerPort: 80
    service: *defaultService
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi
    startupProbe:
      httpGet:
        path: /
        port: http
      periodSeconds: 5
      failureThreshold: 40
    livenessProbe:
      httpGet:
        path: /
        port: http
      periodSeconds: 10
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /
        port: http
      periodSeconds: 5
      failureThreshold: 3
  chain:
    enabled: true
    replicaCount: 1
    image:
      repository: "ghcr.io/kamatechorg/resonance-flow/chain"
      pullPolicy: IfNotPresent
      tag: "placeholder"
    containerPort: 8081
    service: *defaultService
    resources: *defaultResources
    <<: *defaultHealthProbes
    # Password is DB_PASSWORD below, from the chain-db-credentials Secret - not a literal here.
    env:
      DB_PASSWORD:
        valueFrom:
          secretKeyRef:
            name: chain-db-credentials
            key: password
    dependencies:
      - name: postgresql
        port: 5432
    config:
      data:
        datasource:
          # Own database and user - not Inbox's tasks schema or its superuser.
          database: chain
          username: chain
        kafka:
          consumerGroupId: chain-service
          topics:
            taskDependenciesProposed: task.dependencies.proposed # drives addDependency
            taskDependenciesRemoved: task.dependencies.removed # drives removeDependency; PROPOSED
            # drives onTaskStatusChanged; PROPOSED, assumes Inbox's 8-value status enum
            taskStatusUpdated: task.status.updated
            taskSchedulingUpdated: task.scheduling.updated # produced, consumed by Inbox
        # No topic for onConstraintAdded/onConstraintStatusChanged - still REST-triggered.
  inbox:
    enabled: true
    replicaCount: 1
    image:
      repository: "ghcr.io/kamatechorg/resonance-flow/inbox"
      pullPolicy: IfNotPresent
      tag: "085a2e7"
    containerPort: 8080
    service: *defaultService
    resources: *defaultResources
    startupProbe:
      httpGet:
        path: /actuator/health/liveness
        port: http
      periodSeconds: 5
      # 300s budget - CI's constrained runner needs more than the ~186s observed locally.
      failureThreshold: 60
    livenessProbe:
      httpGet:
        path: /actuator/health/liveness
        port: http
      periodSeconds: 10
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /actuator/health/readiness
        port: http
      periodSeconds: 5
      failureThreshold: 3
    dependencies:
      - name: postgresql
        port: 5432
      - name: schema-registry
        port: 8080
    config:
      data:
        datasource:
          database: resonance_flow
          username: postgres
          password: postgres
        kafka:
          consumerGroupId: inbox-service
          topics:
            bridgeStructuredTasks: bridge.structured.tasks
            chainSchedulingUpdated: task.scheduling.updated
            mindTaskCreationRequested: task.creation.requested
  schema-registry:
    enabled: true
    replicaCount: 1
    image:
      repository: "apicurio/apicurio-registry-mem"
      pullPolicy: IfNotPresent
      tag: "2.5.11.Final"
    containerPort: 8080
    service:
      type: ClusterIP
      port: 8080
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    startupProbe:
      httpGet:
        path: /health/live
        port: http
      periodSeconds: 5
      failureThreshold: 60
    livenessProbe:
      httpGet:
        path: /health/live
        port: http
      periodSeconds: 10
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /health/ready
        port: http
      periodSeconds: 5
      failureThreshold: 3
  lens-gateway:
    enabled: true
    replicaCount: 1
    image:
      repository: "ghcr.io/kamatechorg/resonance-flow/lens-gateway"
      pullPolicy: IfNotPresent
      tag: "placeholder"
    containerPort: 8080
    service: *defaultService
    resources: *defaultResources
    <<: *defaultHealthProbes
kafka:
  enabled: true
  image:
    registry: docker.io
    repository: bitnamilegacy/kafka
  sasl:
    client:
      users:
        - inbox
      passwords:
        - "resonance-flow-dev-sasl"
  overrideConfiguration:
    offsets.topic.replication.factor: "1"
    transaction.state.log.replication.factor: "1"
    transaction.state.log.min.isr: "1"
  controller:
    replicaCount: 1
    controllerOnly: false
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 768Mi
  broker:
    replicaCount: 0
minio:
  enabled: true
  mode: standalone
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 150m
      memory: 192Mi
postgresql:
  enabled: true
  architecture: standalone
  auth:
    postgresPassword: postgres
    database: resonance_flow
  primary:
    persistence:
      enabled: false
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 150m
        memory: 192Mi
    initdb:
      scriptsConfigMap: chain-db-init
    extraEnvVars:
      - name: CHAIN_DB_PASSWORD
        valueFrom:
          secretKeyRef:
            name: chain-db-credentials
            key: password
