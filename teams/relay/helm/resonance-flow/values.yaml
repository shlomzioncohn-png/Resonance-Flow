            mindTaskCreationRequested: task.creation.requested
  schema-registry:
    enabled: true
    replicaCount: 1
    image:
      # Same image already used for local dev (teams/relay/docker-compose.yml) and the
      # draft teams/relay/schema-sync-hook chart - in-memory Apicurio registry, ccompat
