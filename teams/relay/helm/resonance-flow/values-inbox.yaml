components:
  inbox:
    replicaCount: 1
    image:
      repository: "ghcr.io/kamatechorg/resonance-flow/inbox"
      pullPolicy: IfNotPresent
      tag: "placeholder"
    containerPort: 8080
    service:
      type: ClusterIP
      port: 80
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    startupProbe:
      httpGet:
        path: /health
        port: http
      periodSeconds: 5
      failureThreshold: 40
    livenessProbe:
      httpGet:
        path: /health
        port: http
      periodSeconds: 10
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /health
        port: http
      periodSeconds: 5
      failureThreshold: 3
    env: {}
