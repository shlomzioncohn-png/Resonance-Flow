syntax = "proto3";

package com.rnd.inbox.event;

option java_package = "com.rnd.inbox.event";
option java_multiple_files = true;

// kafkaTopic: task.created
// DRAFT for review - mirrors the Inbox team's TaskCreatedEvent (branch sari/kafka-producer).
// Serialized as plain JSON there today, not Protobuf - this is a first-pass formalization

message TaskCreatedEvent {
  string id = 1;
  string title = 2;
  string description = 3;
}
