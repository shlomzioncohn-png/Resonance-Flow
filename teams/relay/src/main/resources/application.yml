server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful

spring:
  application:
    name: relay
  lifecycle:
    timeout-per-shutdown-phase: 30s
  config:
    import:
      - optional:${KAFKA_CONFIG_PATH:classpath:/kafka-config.yaml}
      # design doc §11 — pipe.* tunables (replay buffer size, outbox capacity, heartbeat interval).
      - optional:${PIPE_LIMITS_PATH:classpath:/pipe-limits.yaml}
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.protobuf.KafkaProtobufSerializer
    consumer:
      group-id: relay
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: io.confluent.kafka.serializers.protobuf.KafkaProtobufDeserializer
        specific.protobuf.value.type: com.rnd.relay.event.TaskEvent

management:
  endpoints:
    web:
      exposure:
        include: health,metrics

relay:
  kafka:
    task-event-topic: task-event
    task-notification-topic: resonance.task-notifications

  pipe:
    # Fresh group id per process so every pod fan-out-consumes the full topic (design doc §05).
    consumer-group-id: pipe-${random.uuid}