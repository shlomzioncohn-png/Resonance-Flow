apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  annotations:
    # After kube-prometheus-stack (wave 3): the chart fails its render when
    # metrics.prometheus.serviceMonitor is on and the ServiceMonitor CRD is
    # missing, and argocd-cm-patch.yaml gates each wave on the previous one's
    # health - on wave 2 a fresh cluster would never get past Traefik.
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 41.6.1
    helm:
      valuesObject:
        ingressClass:
          enabled: true
          isDefaultClass: false
          name: traefik
        providers:
          kubernetesIngress:
            # Match pathType: Prefix per path segment, as the Ingress spec says -
            # otherwise /api also catches /apifoo and /auth catches /authorize.
            strictPrefixMatching: true
            publishedService:
              enabled: true
        ports:
          web:
            http:
              redirections:
                entryPoint:
                  to: websecure
                  scheme: https
                  permanent: true
          # Browsers hold a long-lived WebSocket through lens-gateway, which needs an
          # edge timeout well above 60s (docs/pipe-design.md, "Edge idle timeout").
          websecure:
            transport:
              respondingTimeouts:
                readTimeout: 0s
        service:
          type: LoadBalancer
        # Prometheus metrics on the chart's internal `metrics` entryPoint (:9100),
        # scraped through a ServiceMonitor by kube-prometheus-stack.
        metrics:
          prometheus:
            # Off by default - without it there's no per-router breakdown, only
            # per-entryPoint (traefik_router_requests_total, ..._duration_seconds).
            addRoutersLabels: true
            addServicesLabels: true
            service:
              enabled: true
            serviceMonitor:
              enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
