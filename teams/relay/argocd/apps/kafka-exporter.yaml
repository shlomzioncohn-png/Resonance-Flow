apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kafka-exporter
  namespace: argocd
  annotations:
    # See README.md "Monitoring".
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus-kafka-exporter
    targetRevision: 4.0.0
    helm:
      releaseName: kafka-exporter
      valuesObject:
        kafkaServer:
          - resonance-flow-kafka.resonance-flow.svc.cluster.local:9092
        kafkaBrokerVersion: "3.6.0"
        sasl:
          enabled: true
          scram:
            enabled: true
            mechanism: plain
            username: inbox
            password: "resonance-flow-dev-sasl"
        prometheus:
          serviceMonitor:
            enabled: true
            namespace: monitoring
            interval: 30s
        liveness:
          enabled: true
        readiness:
          enabled: true
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
