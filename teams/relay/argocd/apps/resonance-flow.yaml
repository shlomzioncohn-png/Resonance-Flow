apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: resonance-flow
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/KamaTechOrg/Resonance-Flow.git
    targetRevision: main
    path: teams/relay/helm/resonance-flow
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: resonance-flow
  # helm template has no live cluster to check against, so Chain's DB credentials
  # Secret re-renders a fresh random password every sync - without this, selfHeal
  # would push that new value live and break Chain's DB connection every sync.
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: resonance-flow-chain-db-credentials
      namespace: resonance-flow
      jsonPointers:
        - /data/password
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
