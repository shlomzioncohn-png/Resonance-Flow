# A separate Application, not an ArgoCD hook: hooks only run inside their own
# Application, and this Job must wait for another one. root orders the two by
# sync-wave (gated on health via argocd-cm-patch.yaml).
#
# Wave "1", after resonance-flow's "0": the Job registers schemas in the
# Schema Registry, which is the `components.schema-registry` Deployment inside
# resonance-flow, so it has to be Ready first.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: schema-sync-hook
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/KamaTechOrg/Resonance-Flow.git
    targetRevision: main
    path: teams/relay/schema-sync-hook
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: schema-sync-hook
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
