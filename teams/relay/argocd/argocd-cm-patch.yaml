# ArgoCD 1.8 dropped the health check for `argoproj.io/Application`
# (https://github.com/argoproj/argo-cd/issues/3781). Without it, root can't
# tell when a child Application is Healthy, so the sync-waves in apps/
# ("0" -> "1" -> "2") don't wait for each other.
#
# This restores it, with one change from the script in the ArgoCD docs
# (https://argo-cd.readthedocs.io/en/stable/operator-manual/health/): a new
# child reports "Missing" for an instant, and the wave engine reads
# "Missing" as succeeded, so the gate opens at once. Mapping it to
# "Progressing" keeps the gate closed (verified on kind, #180, #186).
#
# Apply before root-app.yaml; kubectl apply merges these keys into the
# existing argocd-cm, it doesn't replace it:
#
#   kubectl apply -f teams/relay/argocd/argocd-cm-patch.yaml
#   kubectl apply -f teams/relay/argocd/root-app.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cm
    app.kubernetes.io/part-of: argocd
data:
  resource.customizations.health.argoproj.io_Application: |
    hs = {}
    hs.status = "Progressing"
    hs.message = ""
    if obj.status ~= nil then
      if obj.status.health ~= nil then
        if obj.status.health.status == "Missing" then
          -- Transient state right after the child Application is created,
          -- before its own controller has reconciled it. Treating this as
          -- "Progressing" (rather than passing it through verbatim) keeps
          -- the sync-wave gate closed - see comment above for why.
          hs.status = "Progressing"
        else
          hs.status = obj.status.health.status
        end
        if obj.status.health.message ~= nil then
          hs.message = obj.status.health.message
        end
      end
    end
    return hs
