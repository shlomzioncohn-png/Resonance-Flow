# Named "schema-registry" on port 8080 so the chart's default
# schemaRegistryUrl ("http://schema-registry:8080/apis/ccompat/v6") resolves
# when the Job runs in the same namespace.
apiVersion: v1
kind: Service
metadata:
  name: schema-registry
  labels:
    app: schema-registry
spec:
  selector:
    app: schema-registry
  ports:
    - name: http
      port: 8080
      targetPort: 8080
