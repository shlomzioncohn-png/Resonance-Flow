# Wave -2: the throwaway registry comes up before the hook (wave -1) runs.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: env-schema-registry
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  source:
    repoURL: https://github.com/KamaTechOrg/Resonance-Flow.git
    targetRevision: relay-team
    path: teams/relay/schema-sync-hook-env/schema-registry
  destination:
    server: https://kubernetes.default.svc
    namespace: schema-sync-hook
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
