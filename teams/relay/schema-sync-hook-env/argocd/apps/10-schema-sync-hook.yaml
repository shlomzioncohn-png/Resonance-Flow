# Wave -1: the chart this environment exercises.
# Same as teams/relay/schema-sync-hook/argocd-application.yaml, except:
#   - project is "default" (the "resonance-flow" AppProject does not exist in a
#     fresh kind + ArgoCD)
#   - namespace matches where the registry is deployed, so the chart's bare
#     "http://schema-registry:8080/..." resolves without a values override
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: env-schema-sync-hook
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://github.com/KamaTechOrg/Resonance-Flow.git
    targetRevision: relay-team
    path: teams/relay/schema-sync-hook
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: schema-sync-hook
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
