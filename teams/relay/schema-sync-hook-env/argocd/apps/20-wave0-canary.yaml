# Wave 0: stands in for resonance-flow (the services). The env-root app-of-apps
# only creates this Application after wave -1 (the hook Job) is Healthy. The
# gate check deletes this app + the hook + root and redeploys with a breaking
# schema, so root stalls at wave -1 and never recreates this.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: env-wave0-canary
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/KamaTechOrg/Resonance-Flow.git
    targetRevision: relay-team
    path: teams/relay/schema-sync-hook-env/wave0-canary
  destination:
    server: https://kubernetes.default.svc
    namespace: schema-sync-hook
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
