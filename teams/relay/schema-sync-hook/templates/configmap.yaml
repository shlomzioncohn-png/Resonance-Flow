apiVersion: v1
kind: ConfigMap

metadata:
  name: {{ include "schema-sync-hook.fullname" . }}
  labels:
    {{- include "schema-sync-hook.labels" . | nindent 4 }}

data:
  # Compatibility level, from the "# compatibility:" line in schema-subjects.tsv
  # (same source the CI check reads). run-all.sh applies it to the live registry
  # before checking — Apicurio enforces nothing by default.
  compatibility-level: {{ include "schema-sync-hook.compatLevel" . | quote }}

  # Orchestrator ONLY — the actual check/register logic lives in the two
  # verbatim copies below, not reinvented here. Sets the compatibility level,
  # then loops over every schema in schemas.tsv running check-then-register;
  # keeps going if one schema fails, but fails the whole Job at the end.
  run-all.sh: |
    #!/bin/bash
    set -euo pipefail

    REGISTRY_URL="${SCHEMA_REGISTRY_URL:-http://localhost:8081/apis/ccompat/v6}"
    LEVEL="$(cat /schema-list/compatibility-level)"
    echo "Setting global compatibility level to ${LEVEL}"
    curl -sf -X PUT "${REGISTRY_URL}/config" \
      -H "Content-Type: application/vnd.schemaregistry.v1+json" \
      -d "{\"compatibility\": \"${LEVEL}\"}" > /dev/null

    FAILED=0
    while IFS=$'\t' read -r FILE SUBJECT; do
      case "$FILE" in ''|'#'*) continue ;; esac
      echo "=== ${SUBJECT} ==="
      if bash /scripts/check-schema-compatibility.sh "/schema/${FILE}" "${SUBJECT}"; then
        bash /scripts/register-schema.sh "/schema/${FILE}" "${SUBJECT}" || FAILED=1
      else
        FAILED=1
      fi
    done < /schema-list/schemas.tsv

    exit $FAILED

  # Verbatim copy of teams/relay/ci/check-schema-compatibility.sh — see README
  # for why this chart can't reference that file directly yet.
  check-schema-compatibility.sh: |
{{ .Files.Get "files/ci/check-schema-compatibility.sh" | nindent 4 }}

  # Verbatim copy of teams/relay/ci/register-schema.sh.
  register-schema.sh: |
{{ .Files.Get "files/ci/register-schema.sh" | nindent 4 }}

  # One <file>\t<subject> pair per line. NOT configured here — derived from
  # teams/relay/ci/schema-subjects.tsv (copied in as files/schema-subjects.tsv
  # by relay-schema-sync.yaml), the single source of truth shared with the
  # PR-time CI check. Comment/blank lines are dropped here so run-all.sh gets a
  # clean list.
  schemas.tsv: |
    {{- range .Files.Lines "files/schema-subjects.tsv" }}
    {{- $line := trim . }}
    {{- if and $line (not (hasPrefix "#" $line)) }}
    {{ $line }}
    {{- end }}
    {{- end }}

---
apiVersion: v1
kind: ConfigMap

metadata:
  name: {{ include "schema-sync-hook.fullname" . }}-schemas
  labels:
    {{- include "schema-sync-hook.labels" . | nindent 4 }}

data:
  {{- range .Files.Lines "files/schema-subjects.tsv" }}
  {{- $line := trim . }}
  {{- if and $line (not (hasPrefix "#" $line)) }}
  {{- $file := first (splitList "\t" $line) }}
  {{ $file }}: |
{{ $.Files.Get (printf "files/schemas/%s" $file) | nindent 4 }}
  {{- end }}
  {{- end }}
