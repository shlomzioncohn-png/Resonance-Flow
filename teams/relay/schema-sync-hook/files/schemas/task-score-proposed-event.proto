syntax = "proto3";
package com.rnd.mind.event;

import "google/protobuf/timestamp.proto";
import "task-created-event.proto";

option java_package = "com.rnd.mind.event";
option java_multiple_files = true;

message TaskScoreProposedEvent {
  string event_id = 1;
  string task_id = 2;
  com.rnd.inbox.event.TaskTier tier = 3;
  float mind_score = 4;
  float confidence = 5;
  int32 effort_estimate_minutes = 6 [deprecated = true];
  google.protobuf.Timestamp deadline = 7 [deprecated = true];
  string tenant_id = 8;
  google.protobuf.Timestamp scored_at = 9;
  map<string, double> factors = 10;
}
