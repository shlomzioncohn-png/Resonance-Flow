syntax = "proto3";
package com.rnd.mind.event;

option java_package = "com.rnd.mind.event";
option java_multiple_files = true;

message DependencyProposedEvent {
  string event_id = 1;
  string task_id = 2;
  repeated Dependency dependencies = 3;
  string tenant_id = 4;
}
message Dependency {
  string depends_on_task_id = 1;
  float confidence = 2;
}
