# Default values for schema-sync-hook.

image:
  repository: alpine
  tag: "3.19"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

# The internal, in-cluster address — only reachable because this Job runs inside
# the cluster, same as Schema Registry itself. NOT the same value used for local
# testing (localhost) or from outside the cluster.
schemaRegistryUrl: "http://schema-registry:8080/apis/ccompat/v6"

# Which schemas this hook checks + registers is NOT configured here — it comes
# from teams/relay/ci/schema-subjects.tsv (copied in as files/schema-subjects.tsv
# by relay-schema-sync.yaml), the single source of truth also used by the
# PR-time CI check. Add a schema there, not here.
#
# Note: task-created-event.proto / raw-object-event.proto / github-task.proto in
# that list are still UNCONFIRMED DRAFTS (Inbox/Bridge haven't signed off).

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi
