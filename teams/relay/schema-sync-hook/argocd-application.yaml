# DRAFT — belongs in argocd/apps/ (see resonance-flow's real argocd/ folder),
# not here. Kept alongside this chart for now since everything is standalone.
#
# NOT a "hook" — ArgoCD hooks only apply within their own Application, and
# relay is deployed as part of the shared `resonance-flow` Application. This
# uses the same mechanism argocd/apps/kafka.yaml already uses for exactly this
# kind of ordering: a separate Application with an earlier sync-wave, so ArgoCD
# waits for it to succeed before starting the next wave.
#
# sync-wave here is "-1" — same as kafka.yaml — since Schema Registry isn't
# deployed anywhere yet (see README). Once it exists (presumably as part of, or
# alongside, the kafka chart), this wave may need adjusting so schema-sync-hook
# runs AFTER Schema Registry's own wave, but still BEFORE resonance-flow's "0".
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: schema-sync-hook
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: resonance-flow
  source:
    repoURL: https://github.com/KamaTechOrg/Resonance-Flow.git
    targetRevision: main
    path: teams/relay/schema-sync-hook
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: schema-sync-hook
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
