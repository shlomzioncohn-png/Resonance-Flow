# DRAFT — belongs in argocd/apps/ (see resonance-flow's real argocd/ folder),
# not here. Kept alongside this chart for now since everything is standalone.
#
# NOT a "hook" — ArgoCD hooks only apply within their own Application, and
# relay is deployed as part of the shared `resonance-flow` Application. Ordering
# is done with sync-wave instead: a separate Application at an earlier wave, so
# the app-of-apps root syncs it, waits for it to be Healthy (argocd-cm-patch.yaml
# enables that gating), then moves to the next wave.
#
# sync-wave order — decided, and proven end-to-end in teams/relay/schema-sync-hook-env/
# (the #260 e2e run on kind + ArgoCD):
#   Schema Registry   "-2"   comes up first — the Job talks to it, and its readiness
#                            probe holds the wave until the ccompat API answers
#   schema-sync-hook   "-1"   this Application
#   resonance-flow      "0"   the services — only synced once the Job has succeeded
# A real Schema Registry Application (wave "-2") still has to be created if and
# when the cluster gets a real registry; ../schema-sync-hook-env/schema-registry/
# is the starting point for those manifests.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: schema-sync-hook
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://github.com/KamaTechOrg/Resonance-Flow.git
    targetRevision: main
    path: teams/relay/schema-sync-hook
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: schema-sync-hook
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
