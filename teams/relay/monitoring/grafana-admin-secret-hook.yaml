apiVersion: v1
kind: ServiceAccount

metadata:
  name: grafana-admin-secret-init
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role

metadata:
  name: grafana-admin-secret-init
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-1"

rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  # get/delete only on this Secret - to reuse its password or repair an empty one.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "delete"]
    resourceNames:
      - grafana-admin
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding

metadata:
  name: grafana-admin-secret-init
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-1"

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: grafana-admin-secret-init
subjects:
  - kind: ServiceAccount
    name: grafana-admin-secret-init
    # The Application's destination namespace - a RoleBinding subject needs it spelled out.
    namespace: monitoring
---
apiVersion: batch/v1
kind: Job

metadata:
  name: grafana-admin-secret-init
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "0"

spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    spec:
      serviceAccountName: grafana-admin-secret-init
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        # The image's curl_user, numeric - runAsNonRoot can't verify a named user.
        runAsUser: 100
        runAsGroup: 101
      containers:
        - name: create-secret
          image: curlimages/curl:8.11.1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command:
            - sh
            - -c
            - |
              set -eu
              SECRET=grafana-admin
              SA=/var/run/secrets/kubernetes.io/serviceaccount
              API="https://kubernetes.default.svc/api/v1/namespaces/$(cat "$SA/namespace")/secrets"
              PASSWORD="$(tr -dc 'A-Za-z0-9' </dev/urandom | head -c 32)"
              if [ -z "$PASSWORD" ]; then
                echo "Generated an empty password, refusing to continue" >&2
                exit 1
              fi
              create() {
                curl -sS -o /tmp/response -w '%{http_code}' \
                  --cacert "$SA/ca.crt" \
                  -H "Authorization: Bearer $(cat "$SA/token")" \
                  -H "Content-Type: application/json" \
                  -X POST "$API" -d "$1"
              }
              BODY="{\"apiVersion\":\"v1\",\"kind\":\"Secret\",\"metadata\":{\"name\":\"$SECRET\"},\"type\":\"Opaque\",\"stringData\":{\"admin-user\":\"admin\",\"admin-password\":\"$PASSWORD\"}}"
              CODE=$(create "$BODY")
              case "$CODE" in
                201) echo "Created $SECRET" ;;
                409)
                  GET_CODE=$(curl -sS -o /tmp/get-response.json -w '%{http_code}' \
                    --cacert "$SA/ca.crt" \
                    -H "Authorization: Bearer $(cat "$SA/token")" \
                    -X GET "$API/$SECRET?pretty=false")
                  if [ "$GET_CODE" != "200" ]; then
                    echo "Unexpected HTTP $GET_CODE reading $SECRET:" >&2
                    cat /tmp/get-response.json >&2
                    exit 1
                  fi
                  EXISTING_PASSWORD="$(sed -n 's/.*"admin-password": *"\([^"]*\)".*/\1/p' /tmp/get-response.json | base64 -d)"
                  if [ -n "$EXISTING_PASSWORD" ]; then
                    echo "$SECRET already exists and looks valid - reusing its password"
                  else
                    echo "$SECRET exists but its password is empty - recreating it" >&2
                    DELETE_CODE=$(curl -sS -o /tmp/delete-response -w '%{http_code}' \
                      --cacert "$SA/ca.crt" \
                      -H "Authorization: Bearer $(cat "$SA/token")" \
                      -X DELETE "$API/$SECRET")
                    case "$DELETE_CODE" in
                      200|202) ;;
                      *) echo "Unexpected HTTP $DELETE_CODE deleting the broken $SECRET:" >&2; cat /tmp/delete-response >&2; exit 1 ;;
                    esac
                    RECREATE_CODE=$(create "$BODY")
                    if [ "$RECREATE_CODE" != "201" ]; then
                      echo "Unexpected HTTP $RECREATE_CODE recreating $SECRET:" >&2
                      cat /tmp/response >&2
                      exit 1
                    fi
                    echo "Recreated $SECRET with a new password"
                  fi
                  ;;
                *) echo "Unexpected HTTP $CODE creating $SECRET:" >&2; cat /tmp/response >&2; exit 1 ;;
              esac
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
