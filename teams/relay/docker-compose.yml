services:
  relay:
    build: .
    container_name: relay-service
    ports:
      - "${SERVER_PORT:-8082}:8082"
    environment:
      - SERVER_PORT=${SERVER_PORT:-8082}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-local}
      # application.yml falls back to a random POD_NAME when this is unset, so it's not
      # required here - set to a fixed, readable value instead of a random one purely so
      # local consumer-group ids (relay.pipe.consumer-group-id) are easier to read in logs.
      - POD_NAME=${POD_NAME:-relay-local}
