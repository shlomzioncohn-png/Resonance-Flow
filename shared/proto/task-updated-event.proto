syntax = "proto3";

package com.rnd.inbox.event;

option java_package = "com.rnd.inbox.event";
option java_multiple_files = true;

import "google/protobuf/timestamp.proto";
import "task-created-event.proto";

// kafkaTopic: task.updated
// Published by Inbox - built from teams/inbox/src/main/java/com/rnd/inbox/task/event/TaskUpdatedPayload.java
// by TaskUpdatedProtoMapper. Enums are imported from task-created-event.proto, registered as a
// schema reference to task.created-value.

message TaskUpdatedEvent {
  string task_id = 1;                                // UUID as string.
  string tenant_id = 2;                              // UUID as string.
  optional string project_id = 3;                    // UUID as string.
  string title = 4;
  string description = 5;
  bool is_available = 6;                             // Computed by Chain; Inbox only stores it.
  SourceType source_type = 7;
  string source_ref = 8;
  optional TaskTier tier = 9;                        // Unset until MIND classifies the task.
  optional TaskRoleContext role_context = 10;        // Unset until MIND classifies the task.
  optional int32 urgency = 11;                       // 1..5.
  optional int32 effort_estimate_minutes = 12;
  optional google.protobuf.Timestamp deadline = 13;
  TaskStatus status = 14;
  ExtractionProvenance extraction_provenance = 15;
  optional float confidence = 16;                    // 0..1.
  optional float effort_estimate_confidence = 17;    // 0..1.
  optional string suggested_owner_user_id = 18;      // UUID as string. Set later by MIND.
  optional float suggested_owner_confidence = 19;    // 0..1. Set later by MIND.
  google.protobuf.Timestamp updated_at = 20;
  optional string owner_id = 21;                     // UUID as string.
  optional string feedback_text = 22;                // Set only on a rejection that came with feedback.
  optional string feedback_user_id = 23;             // UUID as string. The user who gave the feedback.
}
