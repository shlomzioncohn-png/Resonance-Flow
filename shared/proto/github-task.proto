syntax = "proto3";

package com.rnd.bridge.dto;

option java_package = "com.rnd.bridge.dto";
option java_multiple_files = true;

import "google/protobuf/timestamp.proto";

// kafkaTopic: bridge.github.tasks
// Bridge's GitHub task event (GitHubKafkaProducer, teams/bridge/.../task/model/Task.java).
// Sent as JSON today, not Protobuf - registered only for compatibility checking.
// Out of date: doesn't match the current Java record's fields (e.g. organization_id, project_id,
// snoozed_until, completed_at are missing; effort_estimate_minutes is an Integer there).

message Task {
  string id = 1;
  string title = 2;
  optional string description = 3;
  SourceType source_type = 4;                 
  string source_ref = 5;                       
  string owner = 6;
  string role_context = 7;
  optional Tier tier = 8;
  optional int32 urgency = 9;
  optional double effort_estimate_minutes = 10;
  optional google.protobuf.Timestamp deadline = 11;
  optional string parent_task_id = 12;          
  repeated string depends_on = 13;
  repeated string constraints = 14;
  optional double confidence = 15;              
  ExtractionProvenance extraction_provenance = 16;
  TaskStatus status = 17;
}

enum SourceType {
  SOURCE_TYPE_UNSPECIFIED = 0;
  SOURCE_TYPE_GITHUB = 1;
}

enum Tier {
  TIER_UNSPECIFIED = 0;
  TIER_1 = 1;
  TIER_2 = 2;
  TIER_3 = 3;
}

enum ExtractionProvenance {
  EXTRACTION_PROVENANCE_UNSPECIFIED = 0;
  EXTRACTION_PROVENANCE_API = 1;
  EXTRACTION_PROVENANCE_WEBHOOK = 2;
}

enum TaskStatus {
  TASK_STATUS_UNSPECIFIED = 0;
  TASK_STATUS_OPEN = 1;
  TASK_STATUS_CLOSED = 2;
  TASK_STATUS_IN_PROGRESS = 3;
}
