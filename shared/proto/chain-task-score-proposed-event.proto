syntax = "proto3";

package com.rnd.mind.event;

import "google/protobuf/timestamp.proto";
import "chain-task-updated-event.proto";

option java_package = "com.rnd.mind.event";
option java_multiple_files = true;

// Chain's self-contained copy of task-score-proposed-event.proto; keep field numbers identical.
// It reuses TaskTier from chain-task-updated-event.proto so Chain does not compile task-created-event.proto.

message TaskScoreProposedEvent {
  string event_id = 1;                         // UUID as string. Chain dedupes on it.
  string task_id = 2;                          // UUID as string.
  com.rnd.inbox.event.TaskTier tier = 3;
  float mind_score = 4;                        // 0.0..1.0, importance only. Chain converts it to priority_score (1..10).
  float confidence = 5;                        // 0.0..1.0.
  int32 effort_estimate_minutes = 6 [deprecated = true];
  google.protobuf.Timestamp deadline = 7 [deprecated = true];
  string tenant_id = 8;                        // UUID as string.
  google.protobuf.Timestamp scored_at = 9;     // When Mind computed the score.
  map<string, double> factors = 10;            // Optional. The contributions behind mind_score.
}
