syntax = "proto3";

package com.rnd.inbox.event;

option java_package = "com.rnd.inbox.event";
option java_multiple_files = true;

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

// kafkaTopic: task.created
// Published by Inbox - built from teams/inbox/src/main/java/com/rnd/inbox/task/event/TaskCreatedPayload.java
// by TaskCreatedProtoMapper. Enums mirror Inbox's Postgres enum types; other task.* schemas import them.
//
// Registered under FULL compatibility: never renumber, retype or remove a field or enum value -
// only add. That's also why id/title/description keep their original names and nullability.
//
// Not a field here: correlation_id (a Kafka header, like event_id).
// suggested_owner_* carry MIND's proposal from task.creation.requested; they never set owner_id.

message TaskCreatedEvent {
  string id = 1;                                   // UUID as string.
  string title = 2;
  string description = 3;
  string tenant_id = 4;                            // UUID as string.
  optional string project_id = 5;                  // UUID as string.
  SourceType source_type = 6;
  string source_ref = 7;
  bool is_available = 8;                           // Computed by Chain; Inbox only stores it.
  optional TaskTier tier = 9;                      // Unset until MIND classifies the task.
  optional TaskRoleContext role_context = 10;      // Unset until MIND classifies the task.
  optional int32 urgency = 11;                     // 1..5 (DB check constraint).
  optional int32 effort_estimate_minutes = 12;
  optional google.protobuf.Timestamp deadline = 13;
  TaskStatus status = 14;
  ExtractionProvenance extraction_provenance = 15;
  optional float confidence = 16;                  // 0..1. Required by the DB when ML_INFERRED - enforced in code, not here.
  optional float effort_estimate_confidence = 17;  // 0..1.
  optional string created_by = 18;                 // UUID as string.
  google.protobuf.Timestamp created_at = 19;
  optional google.protobuf.Struct metadata = 20;   // Free-form JSONB.
  optional string owner_id = 21;                   // UUID as string.
  optional string suggested_owner_user_id = 22;    // UUID as string. A proposal, not the owner.
  optional float suggested_owner_confidence = 23;  // 0..1.
}

enum SourceType {
  SOURCE_TYPE_UNSPECIFIED = 0;
  SOURCE_TYPE_GITHUB_ISSUE = 1;
  SOURCE_TYPE_GITHUB_PR = 2;
  SOURCE_TYPE_CRM_DEAL = 3;
  SOURCE_TYPE_EMAIL = 4;
  SOURCE_TYPE_SLACK = 5;
  SOURCE_TYPE_WHATSAPP = 6;
  SOURCE_TYPE_MEETING = 7;
  SOURCE_TYPE_DOC = 8;
  SOURCE_TYPE_SCANNED_DOC = 9;
  SOURCE_TYPE_CALENDAR = 10;
  SOURCE_TYPE_MANUAL = 11;
  SOURCE_TYPE_DRIVE = 12;
  SOURCE_TYPE_JIRA_ISSUE = 13;
  SOURCE_TYPE_ZOOM = 14;
  SOURCE_TYPE_BIGBLUEBUTTON = 15;
}

enum TaskTier {
  TASK_TIER_UNSPECIFIED = 0;
  TASK_TIER_OPERATIONAL = 1;
  TASK_TIER_TACTICAL = 2;
  TASK_TIER_STRATEGIC = 3;
}

enum TaskRoleContext {
  TASK_ROLE_CONTEXT_UNSPECIFIED = 0;
  TASK_ROLE_CONTEXT_DEVELOPER = 1;
  TASK_ROLE_CONTEXT_MANAGER = 2;
  TASK_ROLE_CONTEXT_HIGHER_MANAGER = 3;
  TASK_ROLE_CONTEXT_FIELD_ENGINEER = 4;
  TASK_ROLE_CONTEXT_SALESPERSON = 5;
  TASK_ROLE_CONTEXT_CEO = 6;
}

enum TaskStatus {
  TASK_STATUS_UNSPECIFIED = 0;
  TASK_STATUS_NEW = 1;
  TASK_STATUS_IN_REVIEW = 2;
  TASK_STATUS_APPROVED = 3;
  TASK_STATUS_IN_PROGRESS = 4;
  TASK_STATUS_SNOOZED = 5;
  TASK_STATUS_DONE = 6;
  TASK_STATUS_REJECTED = 7;
  TASK_STATUS_CANCELLED = 8;
}

enum ExtractionProvenance {
  EXTRACTION_PROVENANCE_UNSPECIFIED = 0;
  EXTRACTION_PROVENANCE_ETL = 1;
  EXTRACTION_PROVENANCE_ML_INFERRED = 2;
  EXTRACTION_PROVENANCE_MANUAL = 3;
}
