syntax = "proto3";

package com.rnd.inbox.event;

option java_package = "com.rnd.inbox.event";
option java_multiple_files = true;

// kafkaTopic: task.completed
// Mirrors teams/inbox/src/main/java/com/rnd/inbox/task/TaskCompletedPayload.java
// (built via TaskCompletedPayload.from(Task), published by TaskService on EventType.TASK_COMPLETED).
// Both fields are non-nullable in the source class, so neither is `optional` here.

message TaskCompletedEvent {
  string task_id = 1;      // UUID as string.
  bool is_completed = 2;   // Always true in practice - from(Task) only sets this from status == DONE.
}
