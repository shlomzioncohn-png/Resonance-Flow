syntax = "proto3";

package com.rnd.inbox.event;

option java_package = "com.rnd.inbox.event";
option java_multiple_files = true;

import "google/protobuf/timestamp.proto";

// kafkaTopic: task.completed
// Published by Inbox - built from teams/inbox/src/main/java/com/rnd/inbox/task/event/TaskCompletedPayload.java
// by TaskCompletedProtoMapper.

message TaskCompletedEvent {
  string task_id = 1;      // UUID as string.
  bool is_completed = 2;   // true when status == DONE.
  google.protobuf.Timestamp updated_at = 3;
}
